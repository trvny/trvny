version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/mcp/status-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/weather-feed"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/codebench"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
