version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/mcp/status-mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "21:37"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/mcp/pet-dispatcher"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "21:37"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/gh-apps/kanarek-companion"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "21:37"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "deps"
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "21:37"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "ci"
    # gh-aw action pins are compiler-owned. Upgrade them together with the
    # compiler and generated workflow via `gh aw upgrade`, never independently.
    ignore:
      - dependency-name: "github/gh-aw-actions/*"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/.github"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "21:37"
      timezone: "Europe/Warsaw"
    commit-message:
      prefix: "ci"
    groups:
      hooks:
        patterns:
          - "*"
