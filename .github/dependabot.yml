version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /gh-apps/kanarek-companion
    schedule:
      interval: weekly
    groups:
      kanarek-companion:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /mcp/pet-dispatcher
    schedule:
      interval: weekly
    groups:
      mcp-pet-dispatcher:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /mcp/status-mcp
    schedule:
      interval: weekly
    groups:
      mcp-status-mcp:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /tg-bots/cloudflare-assistant
    schedule:
      interval: weekly
    groups:
      tg-cloudflare-assistant:
        patterns:
          - "*"
    labels:
      - dependencies

  - package-ecosystem: pre-commit
    directory: /.github
    schedule:
      interval: weekly
    groups:
      pre-commit:
        patterns:
          - "*"
    labels:
      - dependencies
