# MegaLinter configuration
# Docs: https://megalinter.io/latest/config-file/
---
FLAVOR_SUGGESTIONS: false
SECURITY_SUGGESTIONS: false
APPLY_FIXES: all
# Formatter output in the report artifact can be used as ready-made patches.
# Review and apply useful fixes selectively; accepting every fix is optional.

# The checkout does not persist credentials. Point changed-file mode at the
# already-fetched base branch so MegaLinter does not try to fetch origin/HEAD
# from this private repository without authentication.
DEFAULT_BRANCH: main

# REPOSITORY: secret/SAST scanning - GitHub secret scanning + Dependabot
#   already cover this here
# SPELL: cspell - not useful for this repo's content
# COPYPASTE: jscpd - not useful for this repo's size
DISABLE:
  - REPOSITORY
  - SPELL
  - COPYPASTE

# ACTION_ZIZMOR: run offline (no GitHub API -> no ref-confusion crash) and
# fail CI only on low+ severity. See .github/zizmor.yml for the ref-pin policy.
ACTION_ZIZMOR_ARGUMENTS:
  - "--offline"
  - "--min-severity=medium"

# YAML_YAMLLINT: first full-codebase run surfaced pre-existing style nits
# (missing "---", truthy value style) in the workflow/dependabot files.
# Non-blocking so the report stays useful without turning every push red.
DISABLE_ERRORS_LINTERS:
  - YAML_YAMLLINT

# .claude/: vendored Claude Code skills, not app code (this is where all the
# Python/PowerShell/Markdown volume was coming from)
# stuff/: personal scratch dir (old scripts, quote/feed dumps, configs) -
# not maintained project code
FILTER_REGEX_EXCLUDE: "(package-lock\\.json|\\.claude/|stuff/)"

# Keep generic linting for bench assets, except where established DOM ids and
# bundled CSS intentionally conflict with generic documentation-style rules.
CSS_STYLELINT_FILTER_REGEX_EXCLUDE: "streambench/public/styles\\.css"
HTML_DJLINT_FILTER_REGEX_EXCLUDE: "(codebench/public/index\\.html|streambench/public/index\\.html)"
HTML_HTMLHINT_FILTER_REGEX_EXCLUDE: "codebench/public/index\\.html"

MARKDOWN_MARKDOWNLINT_CONFIG_FILE: "https://raw.githubusercontent.com/trvny/feedseek/refs/heads/main/.github/linters/.markdownlint.json"
