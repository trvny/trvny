# MegaLinter configuration
# Docs: https://megalinter.io/latest/config-file/
---
FLAVOR_SUGGESTIONS: false
SECURITY_SUGGESTIONS: false
APPLY_FIXES: all
# Formatter output in the report artifact can be used as ready-made patches.
# Review and apply useful fixes selectively; accepting every fix is optional.

# The checkout does not persist credentials. Point changed-file mode at the
# already-fetched base branch so MegaLinter does not try to fetch origin/HEAD
# from this private repository without authentication.
DEFAULT_BRANCH: main

# REPOSITORY: secret/SAST scanning - GitHub secret scanning + Dependabot
#   already cover this here
# SPELL: cspell - not useful for this repo's content
# COPYPASTE: jscpd - not useful for this repo's size
DISABLE:
  - REPOSITORY
  - SPELL
  - COPYPASTE

# ACTION_ZIZMOR: run offline (no GitHub API -> no ref-confusion crash) and
# fail CI only on low+ severity. See .github/zizmor.yml for the ref-pin policy.
ACTION_ZIZMOR_ARGUMENTS:
  - "--offline"
  - "--min-severity=medium"

# actionlint 1.7.12 does not yet recognize GitHub's documented
# concurrency.queue key emitted by gh-aw. Ignore only that parser false positive.
# It also predates the job.workflow_repository/workflow_sha/workflow_ref/
# workflow_file_path context fields gh-aw emits for reusable-workflow callers,
# so its static type checker flags them as undefined properties on `job`.
ACTION_ACTIONLINT_ARGUMENTS: >-
  -ignore 'unexpected key "queue" for "concurrency" section'
  -ignore 'property "workflow_(repository|sha|ref|file_path)" is not defined'

# YAML_YAMLLINT: first full-codebase run surfaced pre-existing style nits
# (missing "---", truthy value style) in the workflow/dependabot files.
# Non-blocking so the report stays useful without turning every push red.
DISABLE_ERRORS_LINTERS:
  - YAML_YAMLLINT

# .claude/ is NOT excluded any more. It used to hold vendored Claude Code skills
# (all the Python/PowerShell/Markdown volume), but those were deleted in 75c12e0
# and the rest moved to .ai/.claude/. What lives there now is a SessionStart hook
# that runs on every session, so it is exactly the code shellcheck should see.
# stuff/: personal scratch dir (old scripts, quote/feed dumps, configs) -
# not maintained project code
# .ai/private/claude/memory/*.md: exported copies of notes maintained in
# ~/.claude/memory. Their README forbids editing them here (a fix would be lost
# on re-export), so a linter asking for edits has nowhere to send them, and the
# frontmatter they are generated with carries trailing whitespace.
# The exclusion is deliberately NOT the whole directory: memory/README.md and
# everything under memory/field-notes/ is written in this repository and can be
# fixed here, so it stays linted. Matching a single path segment ending in .md,
# minus README, is what draws that line.
FILTER_REGEX_EXCLUDE: "(package-lock\\.json|stuff/|\\.ai/private/claude/memory/(?!README\\.md)[^/]+\\.md)"

# Keep generic linting for bench assets, except where established DOM ids and
# bundled CSS intentionally conflict with generic documentation-style rules.

MARKDOWN_MARKDOWNLINT_CONFIG_FILE: "https://raw.githubusercontent.com/trvny/feedseek/refs/heads/main/.github/linters/.markdownlint.json"
