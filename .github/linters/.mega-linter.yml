# MegaLinter configuration
# Docs: https://megalinter.io/latest/config-file/
---
LINTER_RULES_PATH: .github/linters
DEFAULT_BRANCH: main

FLAVOR_SUGGESTIONS: false
SECURITY_SUGGESTIONS: false
IGNORE_GITIGNORED_FILES: true
IGNORE_GENERATED_FILES: true
FAIL_IF_UPDATED_SOURCES: false

# Apply safe formatter fixes only inside the runner. Updated Sources Reporter
# packages the resulting files in the workflow artifact; CI never commits them.
APPLY_FIXES:
  - BASH_SHFMT
  - CSS_STYLELINT
  - JAVASCRIPT_PRETTIER
  - JSON_PRETTIER
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_RUFF_FORMAT
  - TYPESCRIPT_PRETTIER
  - YAML_PRETTIER
UPDATED_SOURCES_REPORTER: true
UPDATED_SOURCES_REPORTER_DIR: updated_sources

# The workflow artifact is the reporting surface. Avoid PR-comment/check spam.
GITHUB_COMMENT_REPORTER: false
GITHUB_STATUS_REPORTER: false


# Keep MegaLinter cross-cutting. Project-specific build/type/test rules live in
# each package's own CI; these linters cover portable correctness and formatting.
ENABLE_LINTERS:
  - ACTION_ACTIONLINT
  - ACTION_ZIZMOR
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - CSS_STYLELINT
  - JAVASCRIPT_PRETTIER
  - JSON_JSONLINT
  - JSON_PRETTIER
  - MARKDOWN_MARKDOWNLINT
  - PYTHON_RUFF
  - PYTHON_RUFF_FORMAT
  - TYPESCRIPT_PRETTIER
  - YAML_PRETTIER
  - YAML_YAMLLINT

# Only high-signal correctness/security checks can fail the workflow. Style and
# formatter findings remain visible in reports and updated_sources.
ENABLE_ERRORS_LINTERS:
  - ACTION_ACTIONLINT
  - ACTION_ZIZMOR
  - BASH_SHELLCHECK
  - JSON_JSONLINT
  - PYTHON_RUFF

ACTION_ZIZMOR_ARGUMENTS:
  - "--offline"
  - "--min-severity=medium"

# actionlint 1.7.12 does not yet understand these newer GitHub/gh-aw fields.
ACTION_ACTIONLINT_ARGUMENTS: >-
  -ignore 'unexpected key "queue" for "concurrency" section'
  -ignore 'property "workflow_(repository|sha|ref|file_path)" is not defined'

# Scratch/generated/exported content has another maintained source of truth.
FILTER_REGEX_EXCLUDE: "(package-lock\\.json|stuff/|token-worldcup/[^/]+\\.html|\\.ai/private/claude/memory/(?!README\\.md)[^/]+\\.md)"
