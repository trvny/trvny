# MegaLinter configuration
# Docs: https://megalinter.io/latest/config-file/
---
APPLY_FIXES: none

# REPOSITORY: secret/SAST scanning - GitHub secret scanning + Dependabot
#   already cover this here
# SPELL: cspell - not useful for this repo's content
# COPYPASTE: jscpd - not useful for this repo's size
DISABLE:
  - REPOSITORY
  - SPELL
  - COPYPASTE

# ACTION_ZIZMOR: same as autka/tvpi - real workflow-security debt, worth its
#   own pass, not blocking this rollout.
# TYPESCRIPT_STANDARD: can't locate tsconfig.json from repo root - two
#   independent TS projects (weather-feed/, mcp/status-mcp/); revisit with
#   explicit --project args if you want this back.
DISABLE_LINTERS:
  - ACTION_ZIZMOR
  - TYPESCRIPT_STANDARD

FILTER_REGEX_EXCLUDE: "(package-lock\\.json)"
