name: AIHubMix review smoke

on:
  push:
    branches: [feat/review-aihubmix]
    paths:
      - .github/workflows/aihubmix-review-smoke.yml

permissions: {}

jobs:
  smoke:
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/kanarek-review-aihubmix-worker.lock.yml
    with:
      pr_number: "348"
      head_sha: ${{ github.sha }}
      base_sha: 847b56396c69d876d77869f947081fa333837cfa
    secrets:
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      COPILOT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
