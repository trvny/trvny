name: AIHubMix secret probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/aihubmix-secret-probe.yml

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
        shell: bash
        run: |
          if [ -n "$AIHUBMIX_API_KEY" ]; then
            echo "configured=true"
          else
            echo "configured=false"
            exit 2
          fi
