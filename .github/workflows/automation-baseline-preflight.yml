name: Automation Worker baseline preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-preflight:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test baseline assertions
        run: node --test .github/scripts/automation-baseline-preflight.test.mjs
      - name: Verify current Cloudflare metadata (GET only)
        run: node .github/scripts/automation-baseline-preflight.mjs
