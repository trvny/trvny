name: Automation Worker baseline preflight

on:
  pull_request:
    paths:
      - .github/scripts/automation-baseline-preflight.mjs
      - .github/scripts/automation-baseline-preflight.test.mjs
      - .github/workflows/automation-baseline-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test .github/scripts/automation-baseline-preflight.test.mjs

  read-only-preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/automation-baseline-preflight.mjs
