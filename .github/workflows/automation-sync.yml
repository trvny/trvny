name: Sync Kanarek credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    concurrency:
      group: automation-sync-cloudflare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
    steps:
      - name: Sync Worker credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          : "${KANAREK_REVIEW_ROUTER_TOKEN:?KANAREK_REVIEW_ROUTER_TOKEN must be configured}"
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_text(
              json.dumps({
                  **{
                      "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_API_TOKEN"],
                      "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
                  },
                  **{
                      key: os.environ[key]
                      for key in ("KANAREK_REVIEW_ROUTER_TOKEN", "GEMINI_API_KEY", "AIHUBMIX_API_KEY", "OPENROUTER_API_KEY", "ORCAROUTER_API_KEY")
                      if os.environ.get(key)
                  },
              }),
              encoding="utf-8",
          )
          PY
          chmod 600 "$secrets_file"
          npx --yes wrangler@4.127.1 secret bulk "$secrets_file" --name kanarek-companion

          current_secrets="$(npx --yes wrangler@4.127.1 secret list --name kanarek-companion --format json)"
          for key in GEMINI_API_KEY AIHUBMIX_API_KEY OPENROUTER_API_KEY ORCAROUTER_API_KEY; do
            if [ -n "${!key:-}" ]; then
              continue
            fi
            if CURRENT_SECRETS="$current_secrets" SECRET_KEY="$key" python3 - <<'PY'
          import json
          import os

          secrets = json.loads(os.environ["CURRENT_SECRETS"])
          raise SystemExit(0 if any(item.get("name") == os.environ["SECRET_KEY"] for item in secrets) else 1)
          PY
            then
              printf 'y\n' | npx --yes wrangler@4.127.1 secret delete "$key" --name kanarek-companion
            fi
          done
