name: Sync Worker credentials

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/migrate-kanarek-quip-recovery.py
  workflow_dispatch:
    inputs:
      target:
        description: Worker credential target
        required: true
        default: kanarek-companion
        type: choice
        options:
          - kanarek-companion
          - kanarek-quips-recovery
          - kanarek-review
          - travny-tg-assistant
          - pet-dispatcher
          - all

permissions:
  contents: read

jobs:
  cloudflare:
    if: ${{ inputs.target == 'kanarek-companion' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-cloudflare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KANAREK_COMPANION_HEALTH_URL: https://kanarek-companion.travny.workers.dev/health
      KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
      GPTOMEK_WAKE_TOKEN: ${{ secrets.GPTOMEK_WAKE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - name: Sync Worker credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          : "${KANAREK_REVIEW_ROUTER_TOKEN:?KANAREK_REVIEW_ROUTER_TOKEN must be configured}"
          : "${GPTOMEK_WAKE_TOKEN:?GPTOMEK_WAKE_TOKEN must be configured}"
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT

          live_tag=$(
            curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$KANAREK_COMPANION_HEALTH_URL" 2>/dev/null |
              jq -r '.gateway.workerVersion.tag // empty' || true
          )
          if [[ "$live_tag" =~ ^[0-9a-fA-F]{40}$ ]]; then
            version_tag="${live_tag,,}"
          else
            version_tag="$GITHUB_SHA"
          fi
          version_message="Kanarek credential sync ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          rollback_message="Rollback failed Kanarek credential sync ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          previous_deployment=$(npx --yes wrangler@4.127.1 deployments status \
            --name kanarek-companion --json)
          mapfile -t previous_specs < <(
            jq -r '.versions[] | "\(.version_id)@\(.percentage)%"' \
              <<<"$previous_deployment"
          )
          if [ "${#previous_specs[@]}" -eq 0 ]; then
            echo "Could not capture the current Worker deployment for rollback." >&2
            exit 1
          fi

          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import pathlib
          import sys

          required = {
              "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_API_TOKEN"],
              "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "KANAREK_REVIEW_ROUTER_TOKEN": os.environ["KANAREK_REVIEW_ROUTER_TOKEN"],
              "GPTOMEK_WAKE_TOKEN": os.environ["GPTOMEK_WAKE_TOKEN"],
          }
          direct_optional = {
              key: os.environ[key]
              for key in (
                  "GEMINI_API_KEY",
                  "OPENAI_API_KEY",
                  "ANTHROPIC_API_KEY",
                  "XAI_API_KEY",
              )
              if os.environ.get(key)
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps({**required, **direct_optional}),
              encoding="utf-8",
          )
          PY
          chmod 600 "$secrets_file"

          secret_names=$(npx --yes wrangler@4.127.1 secret list \
            --name kanarek-companion --format json | jq -r '.[].name')
          for retired_secret in \
            AIHUBMIX_API_KEY OPENROUTER_API_KEY ORCAROUTER_API_KEY GROQ_API_KEY OLLAMA_API_KEY AI_GATEWAY_API_KEY HUGGINGFACE_API_KEY
          do
            if grep -Fxq "$retired_secret" <<<"$secret_names"; then
              npx --yes wrangler@4.127.1 secret delete "$retired_secret" \
                --name kanarek-companion
            fi
          done

          npx --yes wrangler@4.127.1 versions secret bulk "$secrets_file" \
            --name kanarek-companion \
            --tag "$version_tag" \
            --message "$version_message"

          versions_json=$(npx --yes wrangler@4.127.1 versions list \
            --name kanarek-companion --json)
          version_id=$(jq -r \
            --arg tag "$version_tag" \
            --arg message "$version_message" \
            '[.[] | select(.annotations["workers/tag"] == $tag and .annotations["workers/message"] == $message)] | last | .id // empty' \
            <<<"$versions_json")
          if [ -z "$version_id" ]; then
            echo "Could not identify the tagged credential-sync Worker version." >&2
            exit 1
          fi

          npx --yes wrangler@4.127.1 versions deploy \
            "$version_id@100%" \
            --name kanarek-companion \
            --message "$version_message" \
            --yes

          for _attempt in {1..12}; do
            if live_health=$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              "$KANAREK_COMPANION_HEALTH_URL") &&
              jq -e --arg tag "$version_tag" --arg id "$version_id" \
                '.ok == true and .reviewWebhook.ready == true and .gateway.workerVersion.id == $id and .gateway.workerVersion.tag == $tag' \
                <<<"$live_health" >/dev/null
            then
              exit 0
            fi
            sleep 5
          done

          echo "Credential sync deployed, but the tagged Worker did not become healthy; rolling back." >&2
          if ! npx --yes wrangler@4.127.1 versions deploy \
            "${previous_specs[@]}" \
            --name kanarek-companion \
            --message "$rollback_message" \
            --yes
          then
            echo "Rollback of the previous Worker deployment also failed." >&2
          fi
          exit 1

  kanarek-quip-recovery:
    if: >-
      ${{ github.event_name == 'push' ||
          inputs.target == 'kanarek-quips-recovery' }}
    concurrency:
      group: automation-sync-kanarek-quips-recovery
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build safe recovered quip batch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/migrate-kanarek-quip-recovery.py \
            gh-apps/kanarek-companion/recovery/2026-09-24-v1-comments \
            "${RUNNER_TEMP}/kanarek-recovered-quips.json"
          jq -e 'length == 221' "${RUNNER_TEMP}/kanarek-recovered-quips.json" >/dev/null
      - name: Import recovered quips into the active v2 bank
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          namespace_id=$(
            jq -r '.kv_namespaces[] | select(.binding == "KANAREK_QUIP_KV") | .id' \
              gh-apps/kanarek-companion/wrangler.jsonc
          )
          test -n "$namespace_id"
          response="${RUNNER_TEMP}/kanarek-recovery-response.json"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${RUNNER_TEMP}/kanarek-recovered-quips.json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${namespace_id}/bulk" \
            >"$response"
          jq -e '.success == true' "$response" >/dev/null
      - name: Verify every recovered key exists in v2
        shell: bash
        run: |
          set -euo pipefail
          namespace_id=$(
            jq -r '.kv_namespaces[] | select(.binding == "KANAREK_QUIP_KV") | .id' \
              gh-apps/kanarek-companion/wrangler.jsonc
          )
          listing="${RUNNER_TEMP}/kanarek-v2-keys.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --get \
            --data-urlencode "prefix=kanarek:companion:quip-bank:v2:entry:" \
            --data-urlencode "limit=1000" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces/${namespace_id}/keys" \
            >"$listing"
          python3 - "${RUNNER_TEMP}/kanarek-recovered-quips.json" "$listing" <<'PY'
          import json
          import pathlib
          import sys

          expected = {
              item["key"]
              for item in json.loads(pathlib.Path(sys.argv[1]).read_text())
          }
          response = json.loads(pathlib.Path(sys.argv[2]).read_text())
          if not response.get("success"):
              raise SystemExit("Cloudflare KV listing failed")
          actual = {item["name"] for item in response.get("result", [])}
          missing = expected - actual
          if missing:
              raise SystemExit(f"missing {len(missing)} recovered v2 keys")
          print(f"verified {len(expected)} recovered v2 keys")
          PY

  kanarek-review:
    if: ${{ inputs.target == 'kanarek-review' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-kanarek-review
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
    steps:
      - name: Sync review provider credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          : "${AIHUBMIX_API_KEY:?AIHUBMIX_API_KEY must be configured}"
          : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be configured}"
          : "${ORCAROUTER_API_KEY:?ORCAROUTER_API_KEY must be configured}"
          : "${GROQ_API_KEY:?GROQ_API_KEY must be configured}"
          : "${OLLAMA_API_KEY:?OLLAMA_API_KEY must be configured}"
          : "${AI_GATEWAY_API_KEY:?AI_GATEWAY_API_KEY must be configured}"
          : "${HUGGINGFACE_API_KEY:?HUGGINGFACE_API_KEY must be configured}"

          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import pathlib
          import sys

          names = ("AIHUBMIX_API_KEY", "OPENROUTER_API_KEY", "ORCAROUTER_API_KEY", "GROQ_API_KEY", "OLLAMA_API_KEY", "AI_GATEWAY_API_KEY", "HUGGINGFACE_API_KEY")
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps({name: os.environ[name] for name in names}),
              encoding="utf-8",
          )
          PY
          chmod 600 "$secrets_file"

          npx --yes wrangler@4.129.0 secret bulk "$secrets_file" \
            --name kanarek-review

          secrets_json=$(npx --yes wrangler@4.129.0 secret list \
            --name kanarek-review --format json)
          jq -e '
            ([.[].name] | sort) as $names |
            ["AIHUBMIX_API_KEY", "OPENROUTER_API_KEY", "ORCAROUTER_API_KEY", "GROQ_API_KEY", "OLLAMA_API_KEY", "AI_GATEWAY_API_KEY", "HUGGINGFACE_API_KEY"] |
            all(. as $required | $names | index($required))
          ' <<<"$secrets_json" >/dev/null

  telegram-assistant:
    if: ${{ inputs.target == 'travny-tg-assistant' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-travny-tg-assistant
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
      TELEGRAM_ASSISTANT_HEALTH_URL: https://travny-tg-assistant.travny.workers.dev/health
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync shared free-router credential
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/sync-cloudflare-worker-secret.sh"
          travny-tg-assistant KANAREK_REVIEW_ROUTER_TOKEN KANAREK_REVIEW_ROUTER_TOKEN required

      - name: Verify Telegram assistant health
        shell: bash
        run: |
          set -euo pipefail
          for _attempt in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$TELEGRAM_ASSISTANT_HEALTH_URL" |
              jq -e '.ok == true and .service == "travny-tg-assistant"' >/dev/null
            then
              exit 0
            fi
            sleep 5
          done
          echo "Telegram assistant credential sync completed, but the Worker did not become healthy." >&2
          exit 1
  pet-dispatcher:
    if: ${{ inputs.target == 'pet-dispatcher' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-pet-dispatcher
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PET_DISPATCHER_MCP_CONNECTOR_TOKEN: ${{ secrets.PET_DISPATCHER_MCP_CONNECTOR_TOKEN }}
      KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
      PET_DISPATCHER_HEALTH_URL: https://pet-dispatcher-control.travny.workers.dev/health
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync private MCP connector credential
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/sync-cloudflare-worker-secret.sh"
          pet-dispatcher-control MCP_CONNECTOR_TOKEN PET_DISPATCHER_MCP_CONNECTOR_TOKEN optional
      - name: Sync shared free-router credential
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/sync-cloudflare-worker-secret.sh"
          pet-dispatcher-control KANAREK_REVIEW_ROUTER_TOKEN KANAREK_REVIEW_ROUTER_TOKEN required
      - name: Verify Pet Dispatcher health
        shell: bash
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            "$PET_DISPATCHER_HEALTH_URL" |
            jq -e '.ok == true and .service == "pet-dispatcher-control"' >/dev/null
