name: Sync Worker credentials

on:
  repository_dispatch:
    types:
      - kanarek-companion-deploy
  workflow_dispatch:
    inputs:
      target:
        description: Worker credential target
        required: true
        default: kanarek-companion
        type: choice
        options:
          - kanarek-companion
          - kanarek-companion-deploy
          - kanarek-review
          - gremlin
          - tg-assistant
          - pet-dispatcher
          - all

permissions:
  contents: read

jobs:
  deploy-kanarek-companion:
    name: Deploy Kanarek Companion
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
        inputs.target == 'kanarek-companion-deploy') ||
       (github.event_name == 'repository_dispatch' &&
        github.event.action == 'kanarek-companion-deploy' &&
        github.actor == 'gptomek[bot]'))
    concurrency:
      group: automation-sync-cloudflare
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json
      - run: npm ci
      - name: Check source
        run: npm run check
      - name: Record previous deployment
        id: previous
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?Missing Cloudflare token}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing Cloudflare account}"
          current=$(npx --no-install wrangler deployments status --name kanarek-companion --json)
          specs=$(jq -c '[.versions[] | "\(.version_id)@\(.percentage)%"]' <<<"$current")
          if [ "$(jq 'length' <<<"$specs")" -eq 0 ]; then
            echo "::error::No current deployment for safe rollback."
            exit 1
          fi
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
      - name: Deploy checked source
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..12}; do
            if response=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              https://kanarek-companion.travny.workers.dev/health) &&
              jq -e --arg sha "$WORKERS_CI_COMMIT_SHA" \
                '.ok == true and .reviewWebhook.ready == true and .gateway.workerVersion.tag == $sha' \
                <<<"$response" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deployed Worker did not pass commit-specific health check."
          exit 1
      - name: Roll back unhealthy deployment
        # Reverts Worker code/version, not incompatible Durable Object migrations.
        if: ${{ failure() && steps.previous.outcome == 'success' && steps.deploy.outcome != 'skipped' }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_SPECS: ${{ steps.previous.outputs.specs }}
        run: |
          set -euo pipefail
          mapfile -t versions < <(jq -r '.[]' <<<"$ROLLBACK_SPECS")
          if [ "${#versions[@]}" -eq 0 ]; then exit 1; fi
          npx --no-install wrangler versions deploy "${versions[@]}" \
            --name kanarek-companion --message "Rollback failed source deployment" --yes

  cloudflare:
    if: ${{ inputs.target == 'kanarek-companion' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-cloudflare
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KANAREK_COMPANION_HEALTH_URL: https://kanarek-companion.travny.workers.dev/health
      KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
      GPTOMEK_WAKE_TOKEN: ${{ secrets.GPTOMEK_WAKE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json
      # Wrangler comes from the package lockfile so Dependabot keeps it current.
      - run: npm ci
      - name: Sync Worker credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          : "${KANAREK_REVIEW_ROUTER_TOKEN:?KANAREK_REVIEW_ROUTER_TOKEN must be configured}"
          : "${GPTOMEK_WAKE_TOKEN:?GPTOMEK_WAKE_TOKEN must be configured}"
          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT

          live_tag=$(
            curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$KANAREK_COMPANION_HEALTH_URL" 2>/dev/null |
              jq -r '.gateway.workerVersion.tag // empty' || true
          )
          if [[ "$live_tag" =~ ^[0-9a-fA-F]{40}$ ]]; then
            version_tag="${live_tag,,}"
          else
            version_tag="$GITHUB_SHA"
          fi
          version_message="Kanarek credential sync ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          rollback_message="Rollback failed Kanarek credential sync ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"

          previous_deployment=$(npx --no-install wrangler deployments status \
            --name kanarek-companion --json)
          mapfile -t previous_specs < <(
            jq -r '.versions[] | "\(.version_id)@\(.percentage)%"' \
              <<<"$previous_deployment"
          )
          if [ "${#previous_specs[@]}" -eq 0 ]; then
            echo "Could not capture the current Worker deployment for rollback." >&2
            exit 1
          fi

          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import pathlib
          import sys

          required = {
              "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_API_TOKEN"],
              "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
              "KANAREK_REVIEW_ROUTER_TOKEN": os.environ["KANAREK_REVIEW_ROUTER_TOKEN"],
              "GPTOMEK_WAKE_TOKEN": os.environ["GPTOMEK_WAKE_TOKEN"],
          }
          direct_optional = {
              key: os.environ[key]
              for key in (
                  "GEMINI_API_KEY",
                  "OPENAI_API_KEY",
                  "ANTHROPIC_API_KEY",
                  "XAI_API_KEY",
              )
              if os.environ.get(key)
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps({**required, **direct_optional}),
              encoding="utf-8",
          )
          PY
          chmod 600 "$secrets_file"

          secret_names=$(npx --no-install wrangler secret list \
            --name kanarek-companion --format json | jq -r '.[].name')
          for retired_secret in \
            AIHUBMIX_API_KEY OPENROUTER_API_KEY ORCAROUTER_API_KEY GROQ_API_KEY OLLAMA_API_KEY AI_GATEWAY_API_KEY HUGGINGFACE_API_KEY DEEPSEEK_API_KEY
          do
            if grep -Fxq "$retired_secret" <<<"$secret_names"; then
              npx --no-install wrangler secret delete "$retired_secret" \
                --name kanarek-companion
            fi
          done

          npx --no-install wrangler versions secret bulk "$secrets_file" \
            --name kanarek-companion \
            --tag "$version_tag" \
            --message "$version_message"

          versions_json=$(npx --no-install wrangler versions list \
            --name kanarek-companion --json)
          version_id=$(jq -r \
            --arg tag "$version_tag" \
            --arg message "$version_message" \
            '[.[] | select(.annotations["workers/tag"] == $tag and .annotations["workers/message"] == $message)] | last | .id // empty' \
            <<<"$versions_json")
          if [ -z "$version_id" ]; then
            echo "Could not identify the tagged credential-sync Worker version." >&2
            exit 1
          fi

          npx --no-install wrangler versions deploy \
            "$version_id@100%" \
            --name kanarek-companion \
            --message "$version_message" \
            --yes

          for _attempt in {1..12}; do
            if live_health=$(curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 10 \
              "$KANAREK_COMPANION_HEALTH_URL") &&
              jq -e --arg tag "$version_tag" --arg id "$version_id" \
                '.ok == true and .reviewWebhook.ready == true and .gateway.workerVersion.id == $id and .gateway.workerVersion.tag == $tag' \
                <<<"$live_health" >/dev/null
            then
              exit 0
            fi
            sleep 5
          done

          echo "Credential sync deployed, but the tagged Worker did not become healthy; rolling back." >&2
          if ! npx --no-install wrangler versions deploy \
            "${previous_specs[@]}" \
            --name kanarek-companion \
            --message "$rollback_message" \
            --yes
          then
            echo "Rollback of the previous Worker deployment also failed." >&2
          fi
          exit 1

  kanarek-review:
    if: ${{ inputs.target == 'kanarek-review' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-kanarek-review
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: gh-apps/kanarek-review
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-review/package-lock.json
      # Wrangler comes from the package lockfile so Dependabot keeps it current.
      - run: npm ci
      - name: Sync review provider credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          : "${AIHUBMIX_API_KEY:?AIHUBMIX_API_KEY must be configured}"
          : "${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be configured}"
          : "${ORCAROUTER_API_KEY:?ORCAROUTER_API_KEY must be configured}"
          : "${GROQ_API_KEY:?GROQ_API_KEY must be configured}"
          : "${OLLAMA_API_KEY:?OLLAMA_API_KEY must be configured}"
          : "${AI_GATEWAY_API_KEY:?AI_GATEWAY_API_KEY must be configured}"
          : "${HUGGINGFACE_API_KEY:?HUGGINGFACE_API_KEY must be configured}"

          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import pathlib
          import sys

          names = ("AIHUBMIX_API_KEY", "OPENROUTER_API_KEY", "ORCAROUTER_API_KEY", "GROQ_API_KEY", "OLLAMA_API_KEY", "AI_GATEWAY_API_KEY", "HUGGINGFACE_API_KEY")
          secrets = {name: os.environ[name] for name in names}
          if os.environ.get("DEEPSEEK_API_KEY"):
              secrets["DEEPSEEK_API_KEY"] = os.environ["DEEPSEEK_API_KEY"]
          if os.environ.get("GEMINI_API_KEY"):
              secrets["GEMINI_API_KEY"] = os.environ["GEMINI_API_KEY"]
          if os.environ.get("QWEN_API_KEY"):
              secrets["QWEN_API_KEY"] = os.environ["QWEN_API_KEY"]
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(secrets),
              encoding="utf-8",
          )
          PY
          chmod 600 "$secrets_file"

          npx --no-install wrangler secret bulk "$secrets_file" \
            --name kanarek-review

          secrets_json=$(npx --no-install wrangler secret list \
            --name kanarek-review --format json)
          jq -e '
            ([.[].name] | sort) as $names |
            ["AIHUBMIX_API_KEY", "OPENROUTER_API_KEY", "ORCAROUTER_API_KEY", "GROQ_API_KEY", "OLLAMA_API_KEY", "AI_GATEWAY_API_KEY", "HUGGINGFACE_API_KEY"] |
            all(. as $required | $names | index($required))
          ' <<<"$secrets_json" >/dev/null
          if [ -n "${DEEPSEEK_API_KEY:-}" ]; then
            jq -e '([.[].name] | index("DEEPSEEK_API_KEY")) != null' <<<"$secrets_json" >/dev/null
          fi
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            jq -e '([.[].name] | index("GEMINI_API_KEY")) != null' <<<"$secrets_json" >/dev/null
          fi
          if [ -n "${QWEN_API_KEY:-}" ]; then
            jq -e '([.[].name] | index("QWEN_API_KEY")) != null' <<<"$secrets_json" >/dev/null
          fi

  gremlin:
    if: ${{ inputs.target == 'gremlin' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-gremlin
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENGRAM_API_KEY: ${{ secrets.ENGRAM_API_KEY }}
      CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
      GREMLIN_OAUTH_CLIENT_ID: ${{ secrets.GREMLIN_OAUTH_CLIENT_ID }}
      GREMLIN_OAUTH_CLIENT_SECRET: ${{ secrets.GREMLIN_OAUTH_CLIENT_SECRET }}
      GREMLIN_HEALTH_URL: https://gremlin.travny.workers.dev/health
    defaults:
      run:
        working-directory: gh-apps/gremlin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/gremlin/package-lock.json
      # Wrangler comes from the package lockfile so Dependabot keeps it current.
      - run: npm ci
      # Code deploys via Workers Builds; this job only syncs credentials.
      - name: Sync Gremlin credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"

          if [[ -n "${GREMLIN_OAUTH_CLIENT_ID:-}" && -z "${GREMLIN_OAUTH_CLIENT_SECRET:-}" ]] || \
             [[ -z "${GREMLIN_OAUTH_CLIENT_ID:-}" && -n "${GREMLIN_OAUTH_CLIENT_SECRET:-}" ]]; then
            echo "::error::Gremlin OAuth client ID and secret must be configured together."
            exit 1
          fi

          # OAuth is mandatory for the migrated MCP entry; /health alone is not a sign-in check.
          for required in GREMLIN_OAUTH_CLIENT_ID GREMLIN_OAUTH_CLIENT_SECRET; do
            if [ -z "${!required:-}" ]; then
              echo "::error::$required must be configured in repository secrets."
              exit 1
            fi
          done

          secrets_file=$(mktemp)
          trap 'rm -f "$secrets_file"' EXIT
          python3 - "$secrets_file" <<'PY'
          import json
          import os
          import pathlib
          import sys

          secrets = {
              "CLOUDFLARE_API_TOKEN": os.environ["CLOUDFLARE_API_TOKEN"],
              "CLOUDFLARE_ACCOUNT_ID": os.environ["CLOUDFLARE_ACCOUNT_ID"],
          }
          for name in ("ENGRAM_API_KEY", "CONTEXT7_API_KEY", "GREMLIN_OAUTH_CLIENT_ID", "GREMLIN_OAUTH_CLIENT_SECRET"):
              if os.environ.get(name):
                  secrets[name] = os.environ[name]
          pathlib.Path(sys.argv[1]).write_text(json.dumps(secrets), encoding="utf-8")
          PY
          chmod 600 "$secrets_file"

          npx --no-install wrangler secret bulk "$secrets_file" --name gremlin

          secrets_json=$(npx --no-install wrangler secret list --name gremlin --format json)
          if ! jq -e '([.[].name] | sort) as $names | ["GREMLIN_OAUTH_CLIENT_ID","GREMLIN_OAUTH_CLIENT_SECRET"] | all(. as $required | $names | index($required))' <<<"$secrets_json" >/dev/null; then
            echo "::error::Gremlin OAuth secrets missing after synchronization."
            exit 1
          fi
          # GPTomek JWTs come from the GPTOMEK_SIGNER binding; a stray local PEM
          # would silently win over it.
          if jq -e '[.[].name] | index("GPTOMEK_PRIVATE_KEY") != null' <<<"$secrets_json" >/dev/null; then
            echo "::error::GPTOMEK_PRIVATE_KEY is set on gremlin; delete it so GPTOMEK_SIGNER is used."
            exit 1
          fi
          for name in ENGRAM_API_KEY GREMLIN_OAUTH_CLIENT_ID GREMLIN_OAUTH_CLIENT_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::$name is not set as a repository secret; any existing value on gremlin was left untouched."
            elif ! jq -e --arg name "$name" '[.[].name] | index($name) != null' <<<"$secrets_json" >/dev/null; then
              echo "::warning::$name is not set on gremlin after sync."
            fi
          done

          for _attempt in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$GREMLIN_HEALTH_URL" | jq -e '.ok == true and .service == "gremlin"' >/dev/null
            then
              exit 0
            fi
            sleep 5
          done
          echo "Gremlin deployed but /health did not report ok." >&2
          exit 1

  telegram-assistant:
    if: ${{ inputs.target == 'tg-assistant' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-tg-assistant
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
      TELEGRAM_ASSISTANT_HEALTH_URL: https://tg-assistant.travny.workers.dev/health
    defaults:
      run:
        working-directory: tg-bots/cloudflare-assistant
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tg-bots/cloudflare-assistant/package-lock.json
      # Wrangler comes from the package lockfile so Dependabot keeps it current.
      - run: npm ci
      - name: Sync shared free-router credential
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/sync-cloudflare-worker-secret.sh"
          tg-assistant KANAREK_REVIEW_ROUTER_TOKEN KANAREK_REVIEW_ROUTER_TOKEN required

      - name: Verify Telegram assistant health
        shell: bash
        run: |
          set -euo pipefail
          for _attempt in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              "$TELEGRAM_ASSISTANT_HEALTH_URL" |
              jq -e '.ok == true and .service == "tg-assistant"' >/dev/null
            then
              exit 0
            fi
            sleep 5
          done
          echo "Telegram assistant credential sync completed, but the Worker did not become healthy." >&2
          exit 1
  pet-dispatcher:
    if: ${{ inputs.target == 'pet-dispatcher' || inputs.target == 'all' }}
    concurrency:
      group: automation-sync-pet-dispatcher
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PET_DISPATCHER_MCP_CONNECTOR_TOKEN: ${{ secrets.PET_DISPATCHER_MCP_CONNECTOR_TOKEN }}
      KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
      PET_DISPATCHER_HEALTH_URL: https://pet-dispatcher-control.travny.workers.dev/health
    defaults:
      run:
        working-directory: mcp/pet-dispatcher
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/pet-dispatcher/package-lock.json
      # Wrangler comes from the package lockfile so Dependabot keeps it current.
      - run: npm ci
      - name: Sync private MCP connector credential
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/sync-cloudflare-worker-secret.sh"
          pet-dispatcher-control MCP_CONNECTOR_TOKEN PET_DISPATCHER_MCP_CONNECTOR_TOKEN optional
      - name: Sync shared free-router credential
        shell: bash
        run: >-
          bash "$GITHUB_WORKSPACE/.github/scripts/sync-cloudflare-worker-secret.sh"
          pet-dispatcher-control KANAREK_REVIEW_ROUTER_TOKEN KANAREK_REVIEW_ROUTER_TOKEN required
      - name: Verify Pet Dispatcher health
        shell: bash
        run: |
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            "$PET_DISPATCHER_HEALTH_URL" |
            jq -e '.ok == true and .service == "pet-dispatcher-control"' >/dev/null
