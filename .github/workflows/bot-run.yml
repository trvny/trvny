# Temporary runner for changes that are generated rather than hand-written
# (codemods, lockfile regeneration). Lives only on bot/** branches and is
# deleted before merge together with .bot/.
name: Bot run

on: # yamllint disable-line rule:truthy
  push:
    branches: ["bot/**"]

concurrency:
  group: bot-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run .bot/run.sh
        if: hashFiles('.bot/run.sh') != '' && hashFiles('.bot/cleanup') == ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash .bot/run.sh
      - name: Commit result
        if: hashFiles('.bot/run.sh') != '' && hashFiles('.bot/cleanup') == ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.bot'
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -F .bot/commit-message.txt
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          if [ -z "$GH_PAT" ]; then
            echo "::error::Push with GITHUB_TOKEN failed and GH_PAT is not set."
            exit 1
          fi
          echo "GITHUB_TOKEN push failed; retrying with GH_PAT."
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
      # GITHUB_TOKEN may not touch workflow files, so removing this runner
      # needs GH_PAT with workflow scope. Its push also triggers normal CI.
      - name: Remove runner
        if: hashFiles('.bot/cleanup') != ''
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT is required to delete workflow files."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rq .bot .github/workflows/bot-run.yml
          git commit -m "chore(bot): remove runner" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git -c http.https://github.com/.extraheader= push \
            "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
