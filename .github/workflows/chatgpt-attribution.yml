name: ChatGPT attribution guard

on: # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_call:

concurrency:
  group: chatgpt-attribution-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  attribution:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'trvny'
    runs-on: ubuntu-slim
    steps:
      - name: Label ChatGPT-assisted PRs and verify commit attribution
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const pr = context.payload.pull_request;
            const marker = '<!-- chatgpt-assisted-pr -->';
            const note = '*AI assistance: [ChatGPT Codex Connector](https://github.com/apps/chatgpt-codex-connector).*';
            const issue = (await github.rest.issues.get({ owner, repo, issue_number: pull_number })).data;
            const viaConnector = issue.performed_via_github_app?.slug === 'chatgpt-codex-connector';
            const body = pr.body ?? '';
            const hasMarker = (value) => value.split(/\r?\n/).some((line) => line.trim() === marker);
            const assisted = viaConnector || hasMarker(body);

            // Inspect commit authors, not the PR author's login.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number, per_page: 100,
            });
            const trailer = /^Co-authored-by:[ \t]*chatgpt-codex-connector\[bot\][ \t]+<199175422\+chatgpt-codex-connector\[bot\]@users\.noreply\.github\.com>[ \t]*$/i;
            const hasConnectorTrailer = (message) => {
              const blocks = message.trimEnd().split(/\r?\n\r?\n/);
              if (blocks.length < 2) return false;
              const footer = blocks.at(-1).split(/\r?\n/);
              return footer.every((line) => /^[A-Za-z][A-Za-z0-9-]*:[ \t]+\S/.test(line)) &&
                footer.some((line) => trailer.test(line));
            };
            const missing = commits.filter((item) => {
              const login = item.author?.login;
              const name = item.commit?.author?.name?.toLowerCase();
              const relevant = login === 'trvny' || login === 'gptomek[bot]' ||
                name === 'trvny' || name === 'gptomek';
              return relevant && !hasConnectorTrailer(item.commit?.message ?? '');
            });

            if (!assisted) {
              if (missing.length > 0) {
                core.warning('Some commits by trvny/GPTomek lack ChatGPT co-author attribution. If this PR was made with ChatGPT, add the chatgpt-assisted-pr marker to its description and fix the commit trailers.');
              }
              return;
            }

            // Serialize runs; re-read the current PR body before updating it.
            if (viaConnector && pr.head.repo.full_name === `${owner}/${repo}`) {
              const currentBody = (await github.rest.pulls.get({ owner, repo, pull_number })).data.body ?? '';
              if (!hasMarker(currentBody)) {
                const nextBody = `${currentBody.trimEnd()}${currentBody.trim() ? '\n\n' : ''}${note}\n\n${marker}`;
                await github.rest.pulls.update({ owner, repo, pull_number, body: nextBody });
                core.notice('Added ChatGPT attribution to PR description.');
              }
            }

            if (commits.length >= 250) {
              core.setFailed('Commit list may exceed the GitHub PR API limit (250). Review attribution manually.');
            }
            if (missing.length > 0) {
              const ids = missing.slice(0, 20).map((c) => c.sha.slice(0, 12)).join(', ');
              core.setFailed(`ChatGPT-assisted PR has ${missing.length} commit(s) by trvny/GPTomek without the connector co-author trailer: ${ids}. Amend before merge or use GPTomek adopt_branch on the reviewed tree. Do not rewrite the PR branch automatically.`);
            } else if (commits.length < 250) {
              core.notice('ChatGPT-assisted PR attribution verified.');
            }
