# Claude Code review on opened and updated pull requests.
---
name: Claude review

on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:
  workflow_call:

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Skip PRs from forks: secrets are not exposed to them, so the action cannot authenticate.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 10
