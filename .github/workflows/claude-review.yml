# Claude Code review on opened and updated pull requests.
---
name: Claude review

on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - review_requested
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    # Automatic reviews need a same-repository PR and regular Actions secrets.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'workflow_call' ||
        (github.event.pull_request.user.login != 'dependabot[bot]' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: >-
            ${{
              github.event.pull_request.head.sha ||
              format('refs/pull/{0}/head', inputs.pr_number)
            }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr_number }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 5
          additional_permissions: |
            actions: read
