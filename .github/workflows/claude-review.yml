# Claude Code review, run explicitly when useful.
---
name: Claude review

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number

concurrency:
  group: claude-review-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          ref: ${{ format('refs/pull/{0}/head', inputs.pr_number) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ inputs.pr_number }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 5
          additional_permissions: |
            actions: read
