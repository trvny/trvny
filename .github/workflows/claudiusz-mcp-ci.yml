name: Claudiusz MCP CI

on:
  push:
    branches: [main]
    paths:
      - "gh-apps/claudiusz/**"
      - "!gh-apps/claudiusz/**/*.md"
      - "gh-apps/kanarek-companion/src/github-app.ts"
      - ".github/workflows/claudiusz-mcp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gh-apps/claudiusz/**"
      - "!gh-apps/claudiusz/**/*.md"
      - "gh-apps/kanarek-companion/src/github-app.ts"
      - "gh-apps/kanarek-companion/package.json"
      - ".github/workflows/claudiusz-mcp-ci.yml"
  workflow_dispatch:

concurrency:
  group: claudiusz-mcp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gh-apps/claudiusz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/claudiusz/package-lock.json
      - run: npm ci
      - run: npm run check
