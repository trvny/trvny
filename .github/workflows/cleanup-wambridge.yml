name: Cleanup migrated WAM Bridge

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'cleanup/extract-wambridge'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/extract-wambridge
          fetch-depth: 0

      - name: Remove migrated project
        shell: bash
        run: |
          set -euo pipefail

          git rm -r wambridge

          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          badge_anchor = (
              "[![streambench](https://img.shields.io/badge/streambench-media-7c3aed?"
              "style=for-the-badge&logo=vlcmediaplayer&logoColor=white)]"
              "(https://streambench.travny.workers.dev)"
          )
          wam_badge = (
              "[![wambridge](https://img.shields.io/badge/wambridge-Samsung_M5-1428a0?"
              "style=for-the-badge&logo=samsung&logoColor=white)]"
              "(https://github.com/trvny/wambridge)"
          )
          if wam_badge not in text:
              text = text.replace(badge_anchor, f"{badge_anchor}\n{wam_badge}", 1)

          autka_row = (
              "| 🚗 **Autka** | [repo](https://github.com/trvny/autka) | "
              "Androidowy agregator ofert samochodów z Polski, UE i importu z USA, "
              "razem z kalkulacją kosztu sprowadzenia. |"
          )
          wam_row = (
              "| 🔊 **WAM Bridge** | [repo](https://github.com/trvny/wambridge) | "
              "Most audio do głośników Samsung Wireless Audio Multiroom oraz "
              "natywne wyjście foobar2000 dla Shape M5. |"
          )
          if wam_row not in text:
              text = text.replace(autka_row, f"{autka_row}\n{wam_row}", 1)

          old_row = (
              "| 🔊 **[WAM Bridge](wambridge/)** | Windows/LAN | "
              "Lokalny most audio do głośników Samsung Wireless Audio Multiroom, "
              "zaczynając od Shape M5. |\n"
          )
          if old_row not in text:
              raise SystemExit("WAM Bridge monorepo row not found")
          text = text.replace(old_row, "", 1)

          path.write_text(text, encoding="utf-8")
          PY

          refs="$(git grep -n -i -E 'wambridge|WAM Bridge' -- \
            ':!README.md' \
            ':!.github/workflows/**' \
            ':!.cleanup-wambridge-trigger' || true)"
          if [[ -n "$refs" ]]; then
            printf '%s\n' "$refs"
            exit 1
          fi

          git rm .cleanup-wambridge-trigger
          git add README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove migrated WAM Bridge"
          git push origin HEAD:cleanup/extract-wambridge
