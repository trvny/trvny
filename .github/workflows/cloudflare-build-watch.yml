---
name: Sync Workers Builds watch paths

on: # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Sync build watch paths
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Set CLOUDFLARE_BUILDS_API_TOKEN with Workers Builds Configuration/Edit and Workers Scripts/Read."
            exit 1
          fi

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          curl_args=(
            --fail-with-body
            --silent
            --show-error
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          )
          scripts="$(curl "${curl_args[@]}" "${api}/workers/scripts")"

          sync_watch() {
            script="$1"
            includes="$2"
            excludes="$3"

            tag="$(
              jq -r \
                --arg script "$script" \
                '.result[] | select(.id == $script) | .tag // empty' \
                <<<"$scripts" |
                head -n1
            )"
            if [ -z "$tag" ]; then
              echo "::error::Worker ${script} not found."
              return 1
            fi

            triggers="$(
              curl "${curl_args[@]}" "${api}/builds/workers/${tag}/triggers"
            )"
            trigger_uuid="$(
              jq -r '
                [
                  .result[]
                  | select((.branch_includes // []) | index("main"))
                  | .trigger_uuid
                ][0] // empty
              ' <<<"$triggers"
            )"
            if [ -z "$trigger_uuid" ]; then
              echo "::error::Production build trigger for ${script} not found."
              return 1
            fi

            payload="$(
              jq -cn \
                --argjson path_includes "$includes" \
                --argjson path_excludes "$excludes" \
                '{path_includes: $path_includes, path_excludes: $path_excludes}'
            )"

            curl "${curl_args[@]}" \
              --request PATCH \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "${api}/builds/triggers/${trigger_uuid}" >/dev/null

            echo "Synced ${script}: ${includes}"
          }

          sync_watch \
            "streambench" \
            '["streambench/*","stuff/playlists/iptv.m3u8","stuff/playlists/internet_radio.m3u8"]' \
            '["*.md"]'
          sync_watch "codebench" '["codebench/*"]' '["*.md"]'
          sync_watch \
            "kanarek-companion" \
            '["gh-apps/kanarek-companion/*"]' \
            '["*.md"]'
          sync_watch "feeds-proxy" '["feeds-proxy/*"]' '["*.md"]'
          sync_watch "kanarek" '["worker/*"]' '["*.md"]'
