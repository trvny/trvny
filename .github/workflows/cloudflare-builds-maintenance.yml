name: Deploy twojstar Cloudflare fallback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout twojstar workshop
        uses: actions/checkout@v7.0.1
        with:
          repository: twojstar/twojstar
          ref: main
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            source/benches/package-lock.json
            source/weather-feed/package-lock.json

      - name: Verify Cloudflare deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          for worker in codebench docbench streambench weather; do
            npx --yes wrangler@4.128.0 deployments status --name "$worker" --json >/dev/null
            echo "$worker: credentials OK"
          done

      - name: Install Bench dependencies
        working-directory: source/benches
        run: npm ci

      - name: Build Benches
        working-directory: source/benches
        run: npm run build

      - name: Install and check Weather
        working-directory: source/weather-feed
        run: npm ci && npm run check

      - name: Deploy Benches
        working-directory: source/benches
        shell: bash
        run: |
          set -euo pipefail
          npm run deploy:codebench
          npm run deploy:docbench
          npm run deploy:streambench

      - name: Deploy Weather
        working-directory: source/weather-feed
        run: npm run deploy

      - name: Smoke current production
        shell: bash
        run: |
          set -euo pipefail
          expected_hls=$(jq -r '.dependencies["hls.js"]' source/benches/streambench/package.json)
          expected_pdf=$(jq -r '.dependencies["pdfjs-dist"]' source/benches/docbench/package.json)
          curl -fsS https://streambench.trfny.com/vendor/hls.min.js | grep -Fq "$expected_hls"
          curl -fsS https://docbench.travny.workers.dev/vendor/pdfjs/pdf.mjs | grep -Fq "$expected_pdf"
          curl -fsS https://codebench.trfny.com/ >/dev/null
          curl -fsS https://weather.trfny.com/healthz | jq -e '.ok == true' >/dev/null
          echo "Production matches current twojstar/main assets and Weather is healthy."
