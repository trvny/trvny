name: Check codebench

on:
  push:
    branches: [main]
    paths:
      - "codebench/**"
      - ".github/workflows/codebench-check.yml"
  pull_request:
    paths:
      - "codebench/**"
      - ".github/workflows/codebench-check.yml"
  workflow_dispatch:

concurrency:
  group: check-codebench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: codebench
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: codebench/package-lock.json
      - run: npm install
      - name: Build vendored assets
        run: npm run build
      - name: Check JavaScript syntax
        run: node --check src/index.js && node --check public/hardening.js
      - name: Check Worker bundle
        run: npx wrangler deploy --dry-run
