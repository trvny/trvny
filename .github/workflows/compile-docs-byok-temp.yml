name: Temporary gh-aw BYOK compile

on:
  push:
    branches:
      - fix/gh-aw-orcarouter-byok
    paths:
      - ".github/workflows/compile-docs-byok-temp.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT }}
          ref: fix/gh-aw-orcarouter-byok
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh extension install github/gh-aw --pin v0.87.2
      - name: Compile
        run: gh aw compile docs-orchestrator docs-worker --strict --no-check-update --approve
      - name: Commit generated locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/docs-orchestrator.lock.yml .github/workflows/docs-worker.lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: regenerate documentation workflow locks"
          git push
