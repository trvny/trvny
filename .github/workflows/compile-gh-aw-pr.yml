# Temporary compiler for PR #295. Remove after lock generation.
name: Compile gh-aw PR

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [synchronize]

permissions:
  contents: write

jobs:
  compile:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.number == 295 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'gh-aw/docs-flash-lite' &&
      github.event.pull_request.user.login == 'trvny'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@main
        with:
          version: v0.87.0

      - name: Compile
        run: gh aw compile --strict --approve

      - name: Commit generated locks
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/docs-orchestrator.lock.yml .github/workflows/docs-worker.lock.yml
          git diff --cached --quiet || git commit -m "chore: compile docs workflows"
          git push origin "HEAD:${HEAD_REF}"
