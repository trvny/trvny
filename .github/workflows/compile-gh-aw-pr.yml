# Temporary compiler for PR #295. Remove after lock generation.
name: Compile gh-aw PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  compile:
    if: >-
      github.event.issue.number == 295 &&
      github.event.issue.pull_request &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/compile-gh-aw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-aw/docs-flash-lite

      - name: Install gh-aw CLI
        uses: github/gh-aw/actions/setup-cli@main
        with:
          version: v0.87.0

      - name: Compile
        run: gh aw compile --strict --approve

      - name: Commit generated locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/docs-orchestrator.lock.yml .github/workflows/docs-worker.lock.yml
          git diff --cached --quiet || git commit -m "chore: compile docs workflows"
          git push origin HEAD:gh-aw/docs-flash-lite
