name: Compile gh-aw sources

on:
  push:
    branches:
      - gh-aw/central-docs-control
    paths:
      - .github/workflows/docs-orchestrator.md
      - .github/workflows/docs-worker.md
      - .github/workflows/compile-gh-aw.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@80a44d777dd097c7f4455162764590f66937d6f6
        with:
          version: v0.87.0

      - name: Compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile docs-orchestrator docs-worker --strict

      - name: Commit generated locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/docs-orchestrator.lock.yml .github/workflows/docs-worker.lock.yml .github/aw
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: compile central docs workflows"
          git push
