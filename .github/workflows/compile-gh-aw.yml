name: Compile gh-aw sources

on:
  pull_request:
    paths:
      - .github/workflows/docs-orchestrator.md
      - .github/workflows/docs-worker.md
      - .github/workflows/compile-gh-aw.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install gh-aw
        id: setup
        uses: github/gh-aw/actions/setup-cli@80a44d777dd097c7f4455162764590f66937d6f6
        with:
          version: v0.87.0

      - name: Compile
        id: compile
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh aw compile docs-orchestrator docs-worker --strict --approve 2>&1 | tee /tmp/gh-aw-compile.log

      - name: Commit generated files or diagnostics
        if: always()
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          CROSS_REPO_TOKEN_PRESENT: ${{ secrets.GH_AW_GITHUB_TOKEN != '' }}
        run: |
          mkdir -p .github/aw
          {
            echo "setup=${SETUP_OUTCOME}"
            echo "compile=${COMPILE_OUTCOME}"
            echo "cross_repo_token=${CROSS_REPO_TOKEN_PRESENT}"
            if [ -f /tmp/gh-aw-compile.log ]; then
              echo
              cat /tmp/gh-aw-compile.log
            fi
          } > .github/aw/compile-status.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/aw/compile-status.txt
          if [ "$COMPILE_OUTCOME" = "success" ]; then
            git add .github/workflows/docs-orchestrator.lock.yml .github/workflows/docs-worker.lock.yml
            git add .github/aw
          fi
          git commit -m "ci: record central docs compile" || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Fail on compile error
        if: ${{ steps.compile.outcome != 'success' }}
        run: exit 1
