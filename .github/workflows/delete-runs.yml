name: Delete old runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delete-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 90
    permissions: {}
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GH_PAT }}
          retries: 3
          retry-exempt-status-codes: 400,401,404,422
          script: |
            const repositories = [
              'trvny/trvny',
              'trvny/feeds',
              'trvny/tvpi',
              'trvny/autka',
            ];
            const retainDays = 14;
            const keepMinimumRuns = 3;
            const cutoff = Date.now() - retainDays * 24 * 60 * 60 * 1000;
            const failures = [];

            for (const repository of repositories) {
              const [owner, repo] = repository.split('/');
              try {
                const [workflows, runs] = await Promise.all([
                  github.paginate(
                    github.rest.actions.listRepoWorkflows,
                    { owner, repo, per_page: 100 },
                  ),
                  github.paginate(
                    github.rest.actions.listWorkflowRunsForRepo,
                    { owner, repo, status: 'completed', per_page: 100 },
                  ),
                ]);
                const activeWorkflowIds = new Set(workflows.map((workflow) => workflow.id));
                const runsByWorkflow = new Map();

                for (const run of runs) {
                  const workflowRuns = runsByWorkflow.get(run.workflow_id) ?? [];
                  workflowRuns.push(run);
                  runsByWorkflow.set(run.workflow_id, workflowRuns);
                }

                const runsToDelete = [];
                for (const [workflowId, workflowRuns] of runsByWorkflow) {
                  workflowRuns.sort(
                    (left, right) => Date.parse(right.created_at) - Date.parse(left.created_at),
                  );
                  const minimum = activeWorkflowIds.has(workflowId) ? keepMinimumRuns : 0;

                  for (const run of workflowRuns.slice(minimum)) {
                    if (Date.parse(run.created_at) < cutoff) {
                      runsToDelete.push(run);
                    }
                  }
                }

                core.info(`${repository}: ${runsToDelete.length} run(s) to delete`);
                for (const run of runsToDelete) {
                  try {
                    await github.rest.actions.deleteWorkflowRun({
                      owner,
                      repo,
                      run_id: run.id,
                    });
                  } catch (error) {
                    failures.push(`${repository}#${run.id}: ${error.message}`);
                    core.error(failures.at(-1));
                  }
                }
              } catch (error) {
                failures.push(`${repository}: ${error.message}`);
                core.error(failures.at(-1));
              }
            }

            if (failures.length > 0) {
              core.setFailed(`${failures.length} workflow run(s) could not be deleted`);
            }
