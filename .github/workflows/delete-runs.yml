name: Delete old runs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *" # Monthly at 00:00 on the 1st

# The action authenticates with GH_PAT for cross-repo calls, so the
# job's GITHUB_TOKEN needs nothing. Least privilege at the top.
permissions: {}

concurrency:
  group: delete-runs
  cancel-in-progress: true

jobs:
  delete-runs:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Delete runs in trvny/trvny
        id: trvny
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.GH_PAT }}
          repository: trvny/trvny
          retain_days: 14
          keep_minimum_runs: 3

      - name: Delete runs in trvny/feeds
        id: feeds
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.GH_PAT }}
          repository: trvny/feeds
          retain_days: 14
          keep_minimum_runs: 3

      - name: Delete runs in trvny/tvpi
        id: tvpi
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.GH_PAT }}
          repository: trvny/tvpi
          retain_days: 14
          keep_minimum_runs: 3

      - name: Delete runs in trvny/autka
        id: autka
        continue-on-error: true
        uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
        with:
          token: ${{ secrets.GH_PAT }}
          repository: trvny/autka
          retain_days: 14
          keep_minimum_runs: 3

      - name: Apply cleanup gate
        if: always()
        env:
          TRVNY_OUTCOME: ${{ steps.trvny.outcome }}
          FEEDS_OUTCOME: ${{ steps.feeds.outcome }}
          TVPI_OUTCOME: ${{ steps.tvpi.outcome }}
          AUTKA_OUTCOME: ${{ steps.autka.outcome }}
        run: |
          failed=0
          for outcome in "$TRVNY_OUTCOME" "$FEEDS_OUTCOME" "$TVPI_OUTCOME" "$AUTKA_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
