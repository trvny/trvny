name: Inspect Dependabot alerts

on:
  push:
    branches:
      - chore/dependabot-audit
    paths:
      - ".github/workflows/dependabot-audit-temp.yml"
  pull_request:
    paths:
      - ".github/workflows/dependabot-audit-temp.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

jobs:
  inspect:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: List open Dependabot alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/dependabot/alerts?state=open&per_page=100")"
          count="$(jq 'length' <<<"${response}")"
          echo "Open alerts: ${count}"
          jq -r '.[] | [
            (.number | tostring),
            .dependency.package.ecosystem,
            .dependency.package.name,
            .dependency.manifest_path,
            .security_advisory.severity,
            .security_advisory.summary,
            (.security_vulnerability.vulnerable_version_range // ""),
            (.security_vulnerability.first_patched_version.identifier // "no patch")
          ] | @tsv' <<<"${response}"
