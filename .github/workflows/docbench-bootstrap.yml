---
name: Docbench bootstrap

on: # yamllint disable-line rule:truthy
  push:
    branches: [feat/docbench-foundation]
    paths:
      - docbench/**
      - .github/workflows/docbench-bootstrap.yml

permissions:
  contents: write

jobs:
  lock-and-check:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate lockfile
        working-directory: docbench
        run: npm install --package-lock-only --ignore-scripts
      - name: Install and check
        working-directory: docbench
        run: |
          npm ci
          npm run check
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docbench/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(docbench): lock dependencies"
          git push
