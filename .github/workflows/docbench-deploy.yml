name: Deploy Docbench

on:
  push:
    branches: [main]
    paths:
      - "docbench/**"
      - "!docbench/**/*.md"
      - ".github/workflows/docbench-deploy.yml"
  pull_request:
    paths:
      - "docbench/**"
      - "!docbench/**/*.md"
      - ".github/workflows/docbench-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-docbench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docbench
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docbench/package-lock.json

      - run: npm ci

      - name: Build and check
        run: npm run check

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
