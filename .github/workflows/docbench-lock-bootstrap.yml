---
name: Docbench lock bootstrap

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - docbench/package.json
      - .github/workflows/docbench-lock-bootstrap.yml

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate lockfile
        working-directory: docbench
        run: npm install --package-lock-only --ignore-scripts
      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: docbench-package-lock
          path: docbench/package-lock.json
          retention-days: 1
