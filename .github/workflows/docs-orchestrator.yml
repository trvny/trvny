name: Documentation Orchestrator

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: documentation-orchestrator
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-slim
    timeout-minutes: 240
    steps:
      - name: Run documentation cascade
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          repos=(
            trvny/feedseek
            trvny/kanarek
            trvny/tvpi
            trvny/wambridge
            trvny/trvny
            trvny/Autka
            trvny/.ai
          )

          find_run() {
            local workflow=$1
            local request_id=$2
            local run_id=''

            for _ in $(seq 1 30); do
              run_id=$(gh run list \
                --repo "$GITHUB_REPOSITORY" \
                --workflow "$workflow" \
                --event workflow_dispatch \
                --branch "$REF" \
                --limit 50 \
                --json databaseId,displayTitle \
                --jq ".[] | select(.displayTitle | contains(\"$request_id\")) | .databaseId" \
                | head -1)
              if [ -n "$run_id" ]; then
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 2
            done
            return 1
          }

          run_worker() {
            local workflow=$1
            local repo=$2
            local request_id=$3
            shift 3

            echo "::group::$repo Â· $workflow"
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$REF" \
              -f "target_repo=$repo" \
              -f "request_id=$request_id" \
              "$@"

            local run_id
            if ! run_id=$(find_run "$workflow" "$request_id"); then
              echo "Could not locate dispatched run for $repo ($workflow)" >&2
              echo '::endgroup::'
              return 1
            fi

            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
            local result=0
            gh run watch "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --interval 5 \
              --exit-status || result=$?
            echo '::endgroup::'
            return "$result"
          }

          failed=()
          index=0
          for repo in "${repos[@]}"; do
            request_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${index}"
            echo "### $repo"

            if run_worker docs-worker.lock.yml "$repo" "$request_id"; then
              echo "$repo: OrcaRouter / DeepSeek V4 Flash Free"
            elif run_worker docs-openrouter-worker.lock.yml "$repo" "$request_id" \
              -f 'model=nvidia/nemotron-3-ultra-550b-a55b:free'; then
              echo "$repo: OpenRouter / Nemotron 3 Ultra Free"
            elif run_worker docs-openrouter-worker.lock.yml "$repo" "$request_id" \
              -f 'model=nvidia/nemotron-3.5-lightning:free'; then
              echo "$repo: OpenRouter / Nemotron 3.5 Lightning Free"
            elif run_worker docs-openrouter-worker.lock.yml "$repo" "$request_id" \
              -f 'model=openrouter/free'; then
              echo "$repo: OpenRouter / Free Models Router"
            else
              failed+=("$repo")
            fi

            index=$((index + 1))
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            printf 'All providers failed for: %s\n' "${failed[*]}" >&2
            exit 1
          fi
