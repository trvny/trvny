---
name: Feedboard CI

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - feedboard/**
      - .github/workflows/feedboard-ci.yml
  pull_request:
    branches: [main]
    paths:
      - feedboard/**
      - .github/workflows/feedboard-ci.yml
  workflow_dispatch:

concurrency:
  group: feedboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build unsigned x64 MSIX
        shell: pwsh
        run: |
          $project = "feedboard\src\Feedboard.WidgetProvider\Feedboard.WidgetProvider.csproj"
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "feedboard\artifacts\msix"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          msbuild $project `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxPackageDir="$packageDir\" `
            /p:GenerateAppxPackageOnBuild=true

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $packages = @(Get-ChildItem $packageDir -Recurse -File -Filter *.msix)
          if ($packages.Count -eq 0) {
            throw "MSIX package was not produced."
          }

          Copy-Item "feedboard\tools\install-dev-package.ps1" $packageDir

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feedboard-msix-x64
          path: feedboard/artifacts/msix/
          if-no-files-found: error
          retention-days: 7
