name: Polish status-mcp copy

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/status-mcp-weather'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/status-mcp-weather

      - name: Fix stale wording
        shell: python
        run: |
          from pathlib import Path

          def replace(path: Path, old: str, new: str) -> None:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match for {old!r}, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1))

          readme = Path("mcp/status-mcp/README.md")
          replace(readme, "Cloudflare Worker, **free tier**: no\nbindings, no token, pure outbound fetch.", "Cloudflare Worker, **free tier**: service\nbindings, no token, plus outbound GitHub fetches.")
          replace(readme, "fans out to all three in parallel", "fans out to all four in parallel")

          index = Path("mcp/status-mcp/src/index.ts")
          replace(index, "so tvpi\n * weather, and autka", "so tvpi,\n * weather, and autka")
          replace(index, "instead of invoking three separate tools", "instead of invoking four separate tools")

      - run: npm ci
        working-directory: mcp/status-mcp

      - run: npm run typecheck
        working-directory: mcp/status-mcp

      - name: Commit clean result
        run: |
          rm .github/workflows/fix-status-mcp-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp/status-mcp .github/workflows/fix-status-mcp-copy.yml
          git commit -m "Polish status-mcp weather copy"
          git push origin HEAD:feat/status-mcp-weather
