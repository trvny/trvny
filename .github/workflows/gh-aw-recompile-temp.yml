name: Temporary gh-aw recompile

on:
  push:
    branches: [chore/gh-aw-orcarouter]
    paths:
      - ".github/workflows/docs-orchestrator.md"
      - ".github/workflows/docs-worker.md"
      - ".github/workflows/gh-aw-recompile-temp.yml"

concurrency:
  group: gh-aw-recompile-temp
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-aw
        uses: github/gh-aw/actions/setup-cli@v0.87.0
        with:
          version: v0.87.0

      - name: Compile documentation workflows
        run: gh aw compile docs-orchestrator docs-worker --strict --no-check-update

      - name: Upload generated locks
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gh-aw-locks
          path: |
            .github/workflows/docs-orchestrator.lock.yml
            .github/workflows/docs-worker.lock.yml
          if-no-files-found: error
          retention-days: 1
