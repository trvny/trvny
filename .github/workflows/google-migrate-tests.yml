name: google-migrate-tests

on:
  pull_request:
    paths:
      - 'yt-migrate/google/**'
      - '.github/workflows/google-migrate*.yml'
  push:
    branches: [main]
    paths:
      - 'yt-migrate/google/**'
      - '.github/workflows/google-migrate*.yml'

permissions: {}

jobs:
  unit:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: yt-migrate/google
      - name: Tests
        run: python3 -m unittest discover -s yt-migrate/google -p 'test_*.py' -v
