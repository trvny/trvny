name: Run GPTomek JSON comment

on: # yamllint disable-line rule:truthy
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command:
    permissions:
      issues: write
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 203 &&
      github.event.issue.user.login == 'trvny' &&
      github.actor == 'trvny' &&
      github.event.comment.user.login == 'trvny'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Execute JSON command
        id: execute
        continue-on-error: true
        env:
          GPTOMEK_WAKE_TOKEN: ${{ secrets.GPTOMEK_WAKE_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GPTOMEK_WAKE_TOKEN:?GPTOMEK_WAKE_TOKEN must be configured}"
          response="$(
            curl --fail --silent --show-error --retry 2 \
              --connect-timeout 5 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${GPTOMEK_WAKE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --argjson commentId "$COMMENT_ID" '{commentId:$commentId}')" \
              https://automation.trfny.com/gptomek/wake
          )"
          printf '%s\n' "$response"
          state="$(jq -r '.state // empty' <<<"$response")"
          duplicate="$(jq -r '.duplicate // false' <<<"$response")"
          reason="$(jq -r '.commandError // empty' <<<"$response")"
          {
            echo "state=$state"
            echo "duplicate=$duplicate"
          } >>"$GITHUB_OUTPUT"
          if [[ "$state" == "gptomek-comment-error" ]]; then
            echo "::error::GPTomek command failed: ${reason:-unknown_error}"
          fi
          if [[ "$duplicate" == "true" ]]; then
            exit 0
          fi
          [[ "$state" == "gptomek-comment-ok" || "$state" == "gptomek-comment-error" ]]

      - name: Remove acknowledged command comment
        if: >-
          steps.execute.outcome == 'success' &&
          steps.execute.outputs.state == 'gptomek-comment-ok' &&
          steps.execute.outputs.duplicate != 'true'
        env:
          GPTOMEK_WAKE_TOKEN: ${{ secrets.GPTOMEK_WAKE_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          # First wake returned; DO persisted the delivery before this phase.
          if ! response="$(
            curl --fail --silent --show-error --retry 2 \
              --connect-timeout 5 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${GPTOMEK_WAKE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --argjson commentId "$COMMENT_ID" '{commentId:$commentId,cleanup:true}')" \
              https://automation.trfny.com/gptomek/wake
          )"; then
            echo "::warning::Command succeeded; cleanup request failed. Safe to retry cleanup."
            exit 0
          fi
          cleanup="$(jq -r '.commentCleanup // empty' <<<"$response")"
          if [[ "$cleanup" != "deleted" ]]; then
            echo "::warning::Command succeeded; cleanup=${cleanup:-unknown}. Source preserved."
          fi

      - name: Mark command failure
        if: >-
          always() && (
            steps.execute.outcome == 'failure' ||
            steps.execute.outputs.state == 'gptomek-comment-error'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/trvny/trvny/issues/comments/${COMMENT_ID}/reactions" \
            -f content='-1' \
            >/dev/null || true

      - name: Fail rejected command
        if: >-
          always() && (
            steps.execute.outcome == 'failure' ||
            steps.execute.outputs.state == 'gptomek-comment-error'
          )
        shell: bash
        run: exit 1

  cleanup:
    permissions:
      issues: write
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Remove failed commands older than seven days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          # Only failure reactions from this workflow qualify, not user reactions.
          gh api --paginate 'repos/trvny/trvny/issues/203/comments?per_page=100' \
            --jq '.[] | select(.user.login == "trvny" and ((.reactions["-1"] // 0) > 0)) | .id' |
            while IFS= read -r comment_id; do
              bot_reactions="$(
                gh api --paginate \
                  "repos/trvny/trvny/issues/comments/${comment_id}/reactions?per_page=100" \
                  --jq '.[] | select(.user.login == "github-actions[bot]" and .content == "-1") | .id'
              )"
              [[ -n "$bot_reactions" ]] || continue

              # Re-read the comment immediately before removal. Never execute it.
              comment="$(gh api "repos/trvny/trvny/issues/comments/${comment_id}")"
              if ! jq -e --arg cutoff "$cutoff" '
                .user.login == "trvny" and
                .created_at <= $cutoff and
                .updated_at <= $cutoff and
                .created_at == .updated_at and
                ((.reactions["-1"] // 0) > 0) and
                (.body | test("^\\s*```gptomek[ \\t]*\\r?\\n[\\s\\S]*?\\r?\\n```\\s*$"))
              ' <<<"$comment" >/dev/null; then
                continue
              fi
              gh api --method DELETE "repos/trvny/trvny/issues/comments/${comment_id}" >/dev/null
              echo "Removed expired GPTomek failure comment ${comment_id}"
            done
