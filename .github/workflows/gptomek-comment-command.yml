name: Run GPTomek JSON comment

on: # yamllint disable-line rule:truthy
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  command:
    if: >-
      github.event.issue.number == 203 &&
      github.event.issue.user.login == 'trvny' &&
      github.actor == 'trvny' &&
      github.event.comment.user.login == 'trvny'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Execute JSON command
        id: execute
        continue-on-error: true
        env:
          GPTOMEK_WAKE_TOKEN: ${{ secrets.GPTOMEK_WAKE_TOKEN }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GPTOMEK_WAKE_TOKEN:?GPTOMEK_WAKE_TOKEN must be configured}"
          response="$(
            curl --fail --silent --show-error --retry 2 \
              --connect-timeout 5 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${GPTOMEK_WAKE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --argjson commentId "$COMMENT_ID" '{commentId:$commentId}')" \
              https://kanarek-companion.travny.workers.dev/gptomek/wake
          )"
          printf '%s\n' "$response"
          state="$(jq -r '.state // empty' <<<"$response")"
          duplicate="$(jq -r '.duplicate // false' <<<"$response")"
          body_hash="$(jq -r '.commentBodySha256 // empty' <<<"$response")"
          {
            echo "state=$state"
            echo "duplicate=$duplicate"
            echo "body_hash=$body_hash"
          } >>"$GITHUB_OUTPUT"
          if [[ "$duplicate" == "true" ]]; then
            exit 0
          fi
          [[ "$state" == "gptomek-comment-ok" || "$state" == "gptomek-comment-error" ]]

      - name: Remove completed command comment
        id: cleanup
        if: >-
          steps.execute.outcome == 'success' &&
          steps.execute.outputs.duplicate != 'true' &&
          steps.execute.outputs.state == 'gptomek-comment-ok'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          EXPECTED_BODY_SHA256: ${{ steps.execute.outputs.body_hash }}
        shell: bash
        run: |
          set -euo pipefail
          # Compare the REST comment actually processed by GPTomek with the
          # live REST body, not the possibly different Actions event payload.
          current="$(gh api "repos/trvny/trvny/issues/comments/${COMMENT_ID}")"
          if ! jq -e --argjson id "$COMMENT_ID" \
            --arg issue_url "https://api.github.com/repos/trvny/trvny/issues/203" '
              .id == $id and
              .issue_url == $issue_url and
              .user.login == "trvny" and
              .created_at == .updated_at
            ' <<<"$current" >/dev/null; then
            echo "::error::Command comment edited or unexpected source; preserving it."
            exit 1
          fi
          current_hash="$(jq -rj '.body' <<<"$current" | sha256sum | cut -d' ' -f1)"
          if [[ ! "$EXPECTED_BODY_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
            [[ "$current_hash" != "$EXPECTED_BODY_SHA256" ]]; then
            echo "::error::Command body changed after GPTomek executed; preserving it."
            exit 1
          fi
          gh api \
            --method DELETE \
            "repos/trvny/trvny/issues/comments/${COMMENT_ID}" \
            >/dev/null

      - name: Mark command failure
        if: >-
          steps.execute.outcome == 'failure' ||
          steps.execute.outputs.state == 'gptomek-comment-error' ||
          steps.cleanup.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/trvny/trvny/issues/comments/${COMMENT_ID}/reactions" \
            -f content='-1' \
            >/dev/null || true

      - name: Fail rejected command
        if: >-
          steps.execute.outcome == 'failure' ||
          steps.execute.outputs.state == 'gptomek-comment-error' ||
          steps.cleanup.outcome == 'failure'
        shell: bash
        run: exit 1
