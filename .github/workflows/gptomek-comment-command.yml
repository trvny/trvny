name: GPTomek JSON comment
run-name: >-
  ${{ github.event_name == 'issue_comment' && format('GPTomek #{0}', github.event.comment.id) || (github.event_name == 'workflow_dispatch' && inputs.comment_id != '' && format('GPTomek #{0} manual', inputs.comment_id)) || 'GPTomek mailbox cleanup' }}

on: # yamllint disable-line rule:truthy
  issue_comment:
    types: [created]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      comment_id:
        description: 'Existing #203 comment ID (manual recovery; inspect live state first)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  command:
    permissions:
      issues: write
    if: >-
      github.actor == 'trvny' && (
        (github.event_name == 'issue_comment' &&
         vars.GPTOMEK_WEBHOOK_PRIMARY != 'true' &&
         github.event.issue.number == 203 &&
         github.event.issue.user.login == 'trvny' &&
         github.event.comment.user.login == 'trvny') ||
        (github.event_name == 'workflow_dispatch' && inputs.comment_id != '')
      )
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Verify manual recovery target
        id: verify
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMMENT_ID" =~ ^[1-9][0-9]{0,15}$ ]] || exit 1
          comment="$(gh api "repos/trvny/trvny/issues/comments/${COMMENT_ID}")"
          jq -e '
            .issue_url == "https://api.github.com/repos/trvny/trvny/issues/203" and
            .user.login == "trvny" and .created_at == .updated_at and
            (.body | test("^\\s*```gptomek[ \\t]*\\r?\\n[\\s\\S]*?\\r?\\n```\\s*$"))
          ' <<<"$comment" >/dev/null
          digest="$(jq -j .body <<<"$comment" | sha256sum | cut -d ' ' -f 1)"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Execute mailbox command
        id: execute
        continue-on-error: true
        env:
          GPTOMEK_WAKE_TOKEN: ${{ secrets.GPTOMEK_WAKE_TOKEN }}
          COMMENT_ID: ${{ inputs.comment_id || github.event.comment.id }}
          COMMENT_DIGEST: ${{ steps.verify.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GPTOMEK_WAKE_TOKEN:?GPTOMEK_WAKE_TOKEN must be configured}"
          [[ "$COMMENT_ID" =~ ^[1-9][0-9]{0,15}$ ]] || exit 1
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          # A seekable output file keeps only the final attempt's body.
          curl_status=0
          http_status="$(
            curl --silent --show-error --retry 2 \
              --connect-timeout 5 --max-time 30 \
              --output "$response_file" --write-out '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer ${GPTOMEK_WAKE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --argjson commentId "$COMMENT_ID" --arg digest "$COMMENT_DIGEST" '{commentId:$commentId} + (if $digest == "" then {} else {bodySha256:$digest} end)')" \
              https://automation.travny.workers.dev/gptomek/wake
          )" || curl_status=$?
          response="$(cat "$response_file")"
          if [[ "$curl_status" != 0 || "$http_status" != 2[0-9][0-9] ]]; then
            worker_error="$(jq -r '.error | strings | select(test("^[a-z0-9_]{1,100}$"))' <<<"$response" 2>/dev/null || true)"
            echo "::error::GPTomek wake not confirmed; inspect live state before retrying."
            printf 'Comment: %s\n\nOutcome: wake not confirmed. HTTP: %s; curl: %s; Worker error: %s.\n' \
              "$COMMENT_ID" "${http_status:-none}" "$curl_status" "${worker_error:-none}" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s\n' "$response"
          state="$(jq -r '.state // empty' <<<"$response")"
          duplicate="$(jq -r '.duplicate // false' <<<"$response")"
          reason="$(jq -r '.commandError // empty' <<<"$response")"
          # Compact JSON in an indented code block: no Markdown interpretation.
          printf 'Comment: %s\n\n    %s\n' "$COMMENT_ID" \
            "$(jq -c '{state, duplicate, commandError}' <<<"$response")" >>"$GITHUB_STEP_SUMMARY"
          {
            echo "state=$state"
            echo "duplicate=$duplicate"
          } >>"$GITHUB_OUTPUT"
          if [[ "$state" == "gptomek-comment-error" ]]; then
            echo "::error::GPTomek command failed: ${reason:-unknown_error}"
          fi
          if [[ "$duplicate" == "true" ]]; then
            exit 0
          fi
          [[ "$state" == "gptomek-comment-ok" || "$state" == "gptomek-comment-error" ]]

      - name: Remove acknowledged command comment
        if: >-
          steps.execute.outcome == 'success' &&
          steps.execute.outputs.state == 'gptomek-comment-ok' &&
          steps.execute.outputs.duplicate != 'true'
        env:
          GPTOMEK_WAKE_TOKEN: ${{ secrets.GPTOMEK_WAKE_TOKEN }}
          COMMENT_ID: ${{ inputs.comment_id || github.event.comment.id }}
          COMMENT_DIGEST: ${{ steps.verify.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          # First wake returned; DO persisted the delivery before this phase.
          if ! response="$(
            curl --fail --silent --show-error --retry 2 \
              --connect-timeout 5 --max-time 30 \
              -X POST \
              -H "Authorization: Bearer ${GPTOMEK_WAKE_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$(jq -nc --argjson commentId "$COMMENT_ID" --arg digest "$COMMENT_DIGEST" '{commentId:$commentId,cleanup:true} + (if $digest == "" then {} else {bodySha256:$digest} end)')" \
              https://automation.travny.workers.dev/gptomek/wake
          )"; then
            echo "::warning::Command succeeded; cleanup request failed. Safe to retry cleanup."
            exit 0
          fi
          cleanup="$(jq -r '.commentCleanup // empty' <<<"$response")"
          if [[ "$cleanup" != "deleted" ]]; then
            echo "::warning::Command succeeded; cleanup=${cleanup:-unknown}. Source preserved."
          fi

      - name: Mark command failure
        if: >-
          always() && github.event_name == 'issue_comment' && (
            steps.execute.outcome == 'failure' ||
            steps.execute.outputs.state == 'gptomek-comment-error'
          )
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ inputs.comment_id || github.event.comment.id }}
        shell: bash
        run: |
          [[ "$COMMENT_ID" =~ ^[1-9][0-9]{0,15}$ ]] || exit 0
          gh api \
            --method POST \
            "repos/trvny/trvny/issues/comments/${COMMENT_ID}/reactions" \
            -f content='-1' \
            >/dev/null || true

      - name: Fail rejected command
        if: >-
          always() && (
            steps.execute.outcome == 'failure' ||
            steps.execute.outputs.state == 'gptomek-comment-error'
          )
        shell: bash
        run: exit 1

  cleanup:
    permissions:
      issues: write
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.comment_id == '')
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - name: Remove failed commands older than seven days
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')"
          # Only transport bot failure reactions qualify, not user reactions.
          gh api --paginate 'repos/trvny/trvny/issues/203/comments?per_page=100' \
            --jq '.[] | select(.user.login == "trvny" and ((.reactions["-1"] // 0) > 0)) | .id' |
            while IFS= read -r comment_id; do
              bot_reactions="$(
                gh api --paginate \
                  "repos/trvny/trvny/issues/comments/${comment_id}/reactions?per_page=100" \
                  --jq '.[] | select((.user.login == "github-actions[bot]" or .user.login == "gptomek[bot]") and .content == "-1") | .id'
              )"
              [[ -n "$bot_reactions" ]] || continue

              # Re-read the comment immediately before removal. Never execute it.
              comment="$(gh api "repos/trvny/trvny/issues/comments/${comment_id}")"
              if ! jq -e --arg cutoff "$cutoff" '
                .user.login == "trvny" and
                .created_at <= $cutoff and
                .updated_at <= $cutoff and
                .created_at == .updated_at and
                ((.reactions["-1"] // 0) > 0) and
                (.body | test("^\\s*```gptomek[ \\t]*\\r?\\n[\\s\\S]*?\\r?\\n```\\s*$"))
              ' <<<"$comment" >/dev/null; then
                continue
              fi
              gh api --method DELETE "repos/trvny/trvny/issues/comments/${comment_id}" >/dev/null
              echo "Removed expired GPTomek failure comment ${comment_id}"
            done
          # Prune diagnostic receipts only; never execute them.
          gh api --paginate 'repos/trvny/trvny/issues/203/comments?per_page=100' \
            --jq '.[] | select(.user.login == "gptomek[bot]") | .id' |
            while IFS= read -r receipt_id; do
              receipt="$(gh api "repos/trvny/trvny/issues/comments/${receipt_id}")"
              if jq -e --arg cutoff "$cutoff" '
                .user.login == "gptomek[bot]" and
                .created_at <= $cutoff and .updated_at <= $cutoff and
                .created_at == .updated_at and
                (.body | test("<!-- gptomek-error:[0-9]+:[a-f0-9]{64} -->$"))
              ' <<<"$receipt" >/dev/null; then
                gh api --method DELETE "repos/trvny/trvny/issues/comments/${receipt_id}" >/dev/null
              fi
            done
