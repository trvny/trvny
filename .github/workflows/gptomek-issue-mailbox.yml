name: Wake GPTomek issue mailbox

on:
  issues:
    types: [edited, labeled, unlabeled]

concurrency:
  group: gptomek-control-mailbox
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  wake:
    if: >-
      github.event.issue.number == 203 &&
      github.event.issue.user.login == 'trvny' &&
      github.actor == 'trvny' &&
      contains(github.event.issue.body, '<!-- gptomek-command:') &&
      (github.event.action == 'edited' ||
       ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
        github.event.label.name == 'gptomek-wake'))
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout fallback transport
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/gptomek-mailbox-fallback.py
          sparse-checkout-cone-mode: false
      - name: Inspect mailbox snapshot
        id: mailbox
        shell: bash
        run: |
          set -euo pipefail
          command_count="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          body = str((payload.get('issue') or {}).get('body') or '')
          pattern = r'<!--\s*gptomek-command:[A-Za-z0-9+/_-]+={0,2}\s*-->'
          print(len(re.findall(pattern, body)))
          PY
          )"
          echo "command_count=${command_count}" >>"$GITHUB_OUTPUT"

      - name: Wake primary Issue mailbox
        id: primary
        if: steps.mailbox.outputs.command_count == '1'
        continue-on-error: true
        env:
          GPTOMEK_WAKE_TOKEN: ${{ secrets.GPTOMEK_WAKE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GPTOMEK_WAKE_TOKEN:?GPTOMEK_WAKE_TOKEN must be configured}"
          curl --fail --silent --show-error --retry 2 \
            --connect-timeout 5 --max-time 20 \
            -X POST \
            -H "Authorization: Bearer ${GPTOMEK_WAKE_TOKEN}" \
            https://kanarek-companion.travny.workers.dev/gptomek/wake \
            >/dev/null

      - name: Drain through legacy PR mailbox
        if: steps.mailbox.outputs.command_count != '1' || steps.primary.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 .github/scripts/gptomek-mailbox-fallback.py "$GITHUB_EVENT_PATH"
