name: Sync Gremlin Cloudflare secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gremlin-cloudflare-secrets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Sync operator credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx --yes wrangler@4.127.1 secret put CLOUDFLARE_API_TOKEN --name kanarek-companion
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx --yes wrangler@4.127.1 secret put CLOUDFLARE_ACCOUNT_ID --name kanarek-companion
