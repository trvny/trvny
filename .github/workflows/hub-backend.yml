name: Hub backend

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - "pages/worker/**"
      - "pages/functions/api/**"
      - "pages/functions/_shared/radio-*.js"
      - "pages/functions/_shared/hub-backend.js"
      - "pages/tests/hub-worker.test.mjs"
      - "pages/tests/radio*.test.mjs"
      - ".github/workflows/hub-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "pages/worker/**"
      - "pages/functions/api/**"
      - "pages/functions/_shared/radio-*.js"
      - "pages/functions/_shared/hub-backend.js"
      - "pages/tests/hub-worker.test.mjs"
      - "pages/tests/radio*.test.mjs"
      - ".github/workflows/hub-backend.yml"
  workflow_dispatch:

concurrency:
  group: hub-backend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/radio-now.test.mjs tests/radio-station.test.mjs tests/hub-worker.test.mjs
      - run: npx --yes wrangler@4.160.0 deploy --config worker/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/hub-worker"

  deploy:
    needs: check
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes wrangler@4.160.0 deploy --config worker/wrangler.jsonc
        working-directory: pages
      - name: Ensure Pages production service binding
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/travny"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          current=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$endpoint")
          jq -e '.success == true' <<<"$current" >/dev/null
          service=$(jq -r '.result.deployment_configs.production.services.HUB_BACKEND.service // ""' <<<"$current")
          if [[ -n "$service" && "$service" != "travny-hub-backend" ]]; then
            echo "::error::Existing HUB_BACKEND points to another Worker."
            exit 1
          fi
          probe() {
            local headers status
            headers=$(mktemp)
            status=$(curl --silent --show-error --max-time 15 -o /dev/null -D "$headers" \
              -w '%{http_code}' 'https://travny.pages.dev/api/radio-station?station=invalid') || status=000
            if [[ "$status" == 400 ]] && grep -Eiq '^x-travny-backend:[[:space:]]*worker[[:space:]]*$' "$headers"; then
              rm -f "$headers"
              return 0
            fi
            rm -f "$headers"
            return 1
          }
          if [[ "$service" == "travny-hub-backend" ]]; then
            if probe; then exit 0; fi
          else
            payload=$(jq -c '{
              deployment_configs:{production:{services:(
                (.result.deployment_configs.production.services // {}) +
                {HUB_BACKEND:{service:"travny-hub-backend",environment:"production"}}
              )}}
            }' <<<"$current")
            updated=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
              -H "Content-Type: application/json" -X PATCH --data "$payload" "$endpoint")
            jq -e '.success == true and .result.deployment_configs.production.services.HUB_BACKEND.service == "travny-hub-backend"' <<<"$updated" >/dev/null
          fi
          # Existing builds may predate the binding. Retry activation if the
          # configuration exists but the live API still uses the local fallback.
          id=$(curl --fail-with-body --silent --show-error "${auth[@]}" -X POST \
            -F branch=main "$endpoint/deployments" | jq -er '.result.id')
          for _ in $(seq 1 36); do
            stage=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
              "$endpoint/deployments/$id" | jq -r '.result.latest_stage | "\(.name)/\(.status)"')
            case "$stage" in
              deploy/success) if probe; then exit 0; fi ;;
              */failure|*/canceled) echo "::error::Pages activation $id ended $stage."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Worker binding not confirmed in production (deployment $id)."
          exit 1
