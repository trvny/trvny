name: IndexNow

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "23 */6 * * *"
  # Manual production submissions must be dispatched from main.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/indexnow.yml"
      - "pages/scripts/indexnow.py"
      - "pages/scripts/test_indexnow.py"

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require main for manual production runs
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Dispatch IndexNow from main."
          exit 1
      - run: python -m pip install defusedxml==0.7.1
      - run: python -m unittest discover -s pages/scripts -p test_indexnow.py

  notify:
    needs: check
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site: [hub, feedseek, codebench, docbench, streambench, weather, reactor]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python -m pip install defusedxml==0.7.1
      - uses: actions/cache/restore@v5
        with:
          path: .indexnow-state/${{ matrix.site }}.json
          key: indexnow-${{ matrix.site }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-${{ matrix.site }}-v1-
      - run: python pages/scripts/indexnow.py .indexnow-state/${{ matrix.site }}.json ${{ matrix.site }}
      - uses: actions/cache/save@v5
        if: ${{ always() && hashFiles(format('.indexnow-state/{0}.json', matrix.site)) != '' }}
        with:
          path: .indexnow-state/${{ matrix.site }}.json
          key: indexnow-${{ matrix.site }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
