name: interia-bridge

# Regenerates feeds/interia-bridge.xml every hour and commits it back
# if the content changed.

on:
  schedule:
    # Top of every hour (UTC). GitHub may delay scheduled runs under load.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Needed so the job can push the regenerated feed back to the repo.
permissions:
  contents: write

# If a run is still going when the next hour fires, let the new one wait
# rather than overlap.
concurrency:
  group: interia-bridge
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate interia-bridge feed
        run: python3 interia_bridge.py --output feeds/interia-bridge.xml

      - name: Validate feed
        # Fails the job (and skips the commit) if the Atom output is broken
        # or empty — so a bad run never overwrites a good feed.
        run: python3 validate_feed.py feeds/interia-bridge.xml

      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/interia-bridge.xml
          if git diff --cached --quiet; then
            echo "No feed changes — nothing to commit."
          else
            git commit -m "chore: refresh interia-bridge feed"
            git push
          fi
