name: Kanarek companion CI

on:
  push:
    branches: [main]
    paths:
      - "kanarek-companion/**"
      - "!kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "kanarek-companion/**"
      - "!kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-companion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kanarek-companion/package-lock.json

      - name: Regenerate lockfile diagnostic
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Dependency audit diagnostic
        run: npm audit --json || true
      - run: npm run check

      - name: Archive updated lockfile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kanarek-companion-updated-lockfile
          path: kanarek-companion/package-lock.json
          if-no-files-found: error
          retention-days: 1
