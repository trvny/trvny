name: Kanarek companion CI

on:
  push:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-companion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - run: npm run check

  smoke-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-slim
    timeout-minutes: 12
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - name: Wait for Cloudflare production and smoke the live gateway
        run: npm run smoke:live
        env:
          KANAREK_LIVE_ORIGIN: https://kanarek-companion.travny.workers.dev
          KANAREK_SMOKE_ATTEMPTS: "36"
          KANAREK_SMOKE_INTERVAL_MS: "15000"
