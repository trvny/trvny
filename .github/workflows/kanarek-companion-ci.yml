name: Kanarek companion CI

on:
  push:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-companion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - run: npm run check

  repair-pr297:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 297 &&
      github.event.pull_request.head.repo.full_name == 'trvny/trvny' &&
      github.event.pull_request.head.ref == 'feat/code-change-autopilot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/code-change-autopilot
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - name: Apply review patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr297-review-fixes.yml').read_text()
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          script = script.replace("r'''\\\n", "'''\\\n")
          script = script.replace(
              're.subn(pattern, replacement, text, count=1, flags=re.S)',
              're.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)',
          )

          patch_lines = script.splitlines()
          marker = next(i for i, line in enumerate(patch_lines) if "'recover call provenance'" in line)
          block_start = max(i for i in range(marker) if patch_lines[i].lstrip().startswith('text = replace_once('))
          block_end = next(i for i in range(marker + 1, len(patch_lines)) if patch_lines[i].strip() == ')')
          del patch_lines[block_start:block_end + 1]
          script = '\n'.join(patch_lines) + '\n'
          exec(compile(script, '<pr297-review-fixes>', 'exec'), {'__name__': '__main__'})

          orchestration = Path('gh-apps/kanarek-companion/src/code-change-orchestration.ts')
          text = orchestration.read_text()
          old_call = """    core,
              currentBranch,
              currentBase.defaultBranch,
            );"""
          new_call = """    core,
              inputHash,
              currentBranch,
              currentBase.defaultBranch,
            );"""
          if text.count(old_call) != 1:
              raise SystemExit(f'recover call provenance: expected 1 match, got {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)

          old_scope = """  if (
              !files.length ||
              files.some((value) => !isObject(value) || !stringValue(value.filename) || !allowed.has(String(value.filename)))
            ) {"""
          new_scope = """  if (
              files.some((value) => !isObject(value) || !stringValue(value.filename) || !allowed.has(String(value.filename)))
            ) {"""
          if text.count(old_scope) != 1:
              raise SystemExit(f'empty aggregate diff recovery: expected 1 match, got {text.count(old_scope)}')
          orchestration.write_text(text.replace(old_scope, new_scope, 1))
          PY

      - name: Validate patched companion
        working-directory: gh-apps/kanarek-companion
        run: |
          npm ci
          npm run check

      - name: Commit and push review fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name GPTomek
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add gh-apps/kanarek-companion/src gh-apps/kanarek-companion/test
          git diff --cached --check
          git commit -m 'fix(gpt-actions): close autopilot review gaps'
          git push "https://x-access-token:${GH_TOKEN}@github.com/trvny/trvny.git" HEAD:feat/code-change-autopilot

  smoke-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-slim
    timeout-minutes: 12
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - name: Wait for Cloudflare production and smoke the live gateway
        run: npm run smoke:live
        env:
          KANAREK_LIVE_ORIGIN: https://kanarek-companion.travny.workers.dev
          KANAREK_SMOKE_ATTEMPTS: "36"
          KANAREK_SMOKE_INTERVAL_MS: "15000"
