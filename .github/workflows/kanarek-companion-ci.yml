name: Kanarek companion CI

on:
  push:
    branches: [main]
    paths:
      - "kanarek-companion/**"
      - "!kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "kanarek-companion/**"
      - "!kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-companion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ci/kanarek-audit-diagnostic

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate patched lockfile
        run: npm install --package-lock-only --ignore-scripts

      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check

      - name: Commit patched lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Kanarek dependency lock"
          git push origin HEAD:ci/kanarek-audit-diagnostic
