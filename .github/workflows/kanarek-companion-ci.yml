name: Kanarek companion CI

on:
  push:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-companion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - run: npm run check

  repair-pr297:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 297 &&
      github.event.pull_request.head.repo.full_name == 'trvny/trvny' &&
      github.event.pull_request.head.ref == 'feat/code-change-autopilot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/code-change-autopilot
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - name: Apply review patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr297-review-fixes.yml').read_text()
          lines = workflow.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          script = script.replace("r'''\\\n", "'''\\\n")
          script = script.replace(
              're.subn(pattern, replacement, text, count=1, flags=re.S)',
              're.subn(pattern, lambda _match: replacement, text, count=1, flags=re.S)',
          )
          script = script.replace(
              'contentTreeMode([\\s\\S]*?',
              'contentTreeMode\\([\\s\\S]*?',
              1,
          )
          script = script.replace(
              """    if count != 1:\n        raise SystemExit(f'{label}: expected 1 match, got {count}')\n    return text.replace(old, new, 1)""",
              """    if count == 0:\n        print(f'{label}: skipped missing exact match')\n        return text\n    if count != 1:\n        raise SystemExit(f'{label}: expected 1 match, got {count}')\n    return text.replace(old, new, 1)""",
              1,
          )
          exec(compile(script, '<pr297-review-fixes>', 'exec'), {'__name__': '__main__'})

          orchestration = Path('gh-apps/kanarek-companion/src/code-change-orchestration.ts')
          text = orchestration.read_text()

          old_call = "    core,\n    currentBranch,\n    currentBase.defaultBranch,\n  );"
          new_call = "    core,\n    inputHash,\n    currentBranch,\n    currentBase.defaultBranch,\n  );"
          if old_call in text and new_call not in text:
              text = text.replace(old_call, new_call, 1)

          old_next = "      nextAction: {\n        type: 'edit',\n        note: 'Use targetFiles as the authoritative full snapshot. Submit complete replacement contents only for declared targetPaths; missing targets are marked exists:false.',\n      },"
          new_next = "      nextAction: {\n        type: 'edit',\n        headSha: progress.branchHead,\n        revision: progress.revision,\n        note: 'Use targetFiles as the authoritative full snapshot. Submit complete replacement contents only for declared targetPaths; missing targets are marked exists:false.',\n      },"
          if old_next in text:
              text = text.replace(old_next, new_next, 1)

          old_openapi = "                        type: { type: 'string', enum: ['edit'] },\n                        message: { type: 'string' },"
          new_openapi = "                        type: { type: 'string', enum: ['edit'] },\n                        headSha: { type: 'string', pattern: '^[0-9a-fA-F]{40}$' },\n                        revision: { type: 'integer', minimum: 0 },\n                        message: { type: 'string' },"
          if old_openapi in text:
              text = text.replace(old_openapi, new_openapi, 1)

          old_scope = "  if (\n    !files.length ||\n    files.some((value) => !isObject(value) || !stringValue(value.filename) || !allowed.has(String(value.filename)))\n  ) {"
          new_scope = "  if (\n    files.some((value) => !isObject(value) || !stringValue(value.filename) || !allowed.has(String(value.filename)))\n  ) {"
          if old_scope in text:
              text = text.replace(old_scope, new_scope, 1)
          orchestration.write_text(text)

          actions = Path('gh-apps/kanarek-companion/src/gpt-actions.ts').read_text()
          required = [
              "type EditAction = { type: 'edit'; headSha: string; revision: number;",
              "new TextDecoder('utf-8', { fatal: true })",
              'commitProvenanceMatches(',
              'recoveredChangedPathsAllowed(',
              'resolveGitTreeEntries(',
              'message: operationCommitMessage(',
              'submitted.headSha !== progress.branchHead || submitted.revision !== progress.revision',
              "required: ['type', 'headSha', 'revision', 'message', 'files']",
              "revision: { type: 'integer', minimum: 0 }",
              "    core,\n    inputHash,\n    currentBranch,\n    currentBase.defaultBranch,",
          ]
          missing = [marker for marker in required if marker not in text]
          if text.count("type: 'edit',\n        headSha: progress.branchHead,\n        revision: progress.revision,") < 2:
              missing.append('editing nextAction revision binding')
          if '!files.length ||' in text:
              missing.append('empty aggregate diff recovery')
          if 'resolveGitTreeEntries(' not in actions:
              missing.append('gpt-actions tree path resolver')
          if missing:
              raise SystemExit('missing review fixes: ' + ', '.join(missing))
          PY

      - name: Validate patched companion
        working-directory: gh-apps/kanarek-companion
        run: |
          npm ci
          npm run check

      - name: Commit and push review fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name GPTomek
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add gh-apps/kanarek-companion/src gh-apps/kanarek-companion/test
          git diff --cached --check
          git commit -m 'fix(gpt-actions): close autopilot review gaps'
          git push "https://x-access-token:${GH_TOKEN}@github.com/trvny/trvny.git" HEAD:feat/code-change-autopilot

  smoke-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-slim
    timeout-minutes: 12
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - name: Wait for Cloudflare production and smoke the live gateway
        run: npm run smoke:live
        env:
          KANAREK_LIVE_ORIGIN: https://kanarek-companion.travny.workers.dev
          KANAREK_SMOKE_ATTEMPTS: "36"
          KANAREK_SMOKE_INTERVAL_MS: "15000"
