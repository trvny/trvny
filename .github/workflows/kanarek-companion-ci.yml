name: Kanarek companion CI

on:
  push:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-companion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - run: npm run check

  fix-pr297-final-review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 297 &&
      github.event.pull_request.head.repo.full_name == 'trvny/trvny' &&
      github.event.pull_request.head.ref == 'feat/code-change-autopilot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/code-change-autopilot
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - name: Apply final review fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('gh-apps/kanarek-companion/src/code-change-orchestration.ts')
          text = path.read_text()
          old = "          nextAction: blockers.some((blocker) => blocker.startsWith('ci:failure'))\n            ? { type: 'edit', note: 'Diagnose the failed CI before finalization.' }\n            : { type: 'review', note: 'Wait for or resolve final-head CI/review blockers.' },"
          new = "          nextAction: blockers.some((blocker) => blocker.startsWith('ci:failure'))\n            ? {\n              type: 'edit',\n              headSha: progress.branchHead,\n              revision: progress.revision,\n              note: 'Diagnose the failed CI before finalization.',\n            }\n            : { type: 'review', note: 'Wait for or resolve final-head CI/review blockers.' },"
          if text.count(old) != 1:
              raise SystemExit(f'expected one final edit action, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate companion
        working-directory: gh-apps/kanarek-companion
        run: |
          npm ci
          npm run check

      - name: Commit and push fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name GPTomek
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add gh-apps/kanarek-companion/src/code-change-orchestration.ts
          git diff --cached --check
          git commit -m 'fix(gpt-actions): expose review-stage edit guard'
          git push "https://x-access-token:${GH_TOKEN}@github.com/trvny/trvny.git" HEAD:feat/code-change-autopilot

  smoke-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-slim
    timeout-minutes: 12
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - name: Wait for Cloudflare production and smoke the live gateway
        run: npm run smoke:live
        env:
          KANAREK_LIVE_ORIGIN: https://kanarek-companion.travny.workers.dev
          KANAREK_SMOKE_ATTEMPTS: "36"
          KANAREK_SMOKE_INTERVAL_MS: "15000"
