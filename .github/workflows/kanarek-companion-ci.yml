name: Kanarek companion CI

on:
  push:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "gh-apps/kanarek-companion/**"
      - "!gh-apps/kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-ci.yml"
  workflow_dispatch:

concurrency:
  group: kanarek-companion-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose-pr297:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 297
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "--- replacement counts ---"
            python - <<'PY'
          from pathlib import Path
          source = Path('gh-apps/kanarek-companion/src/code-change-orchestration.ts').read_text()
          old_discovery = "  if (!response) return { ok: false, error: 'targeted_test_route_missing' };\n  return responseObject(response);\n"
          old_recovery = "      const alreadyMerged = await mergedPullRequest(request, invoke, core, progress.pullRequest.number);\n      if (alreadyMerged) {\n        const cleanupResult = await cleanup(request, invoke, core, progress.pullRequest);\n"
          print('discovery=', source.count(old_discovery))
          print('recovery=', source.count(old_recovery))
          PY
            echo "--- npm ci ---"
            cd gh-apps/kanarek-companion
            npm ci
            echo "npm_ci_exit=$?"
            echo "--- npm run check ---"
            npm run check
            echo "npm_check_exit=$?"
          } > "$GITHUB_WORKSPACE/pr297-diag.txt" 2>&1
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: pr297-diagnostics
          path: pr297-diag.txt
          if-no-files-found: error
          retention-days: 1

  autopilot-review-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 297
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact review fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("gh-apps/kanarek-companion/src/code-change-orchestration.ts")
          source = path.read_text()

          old_discovery = (
              "  if (!response) return { ok: false, error: 'targeted_test_route_missing' };\n"
              "  return responseObject(response);\n"
          )
          new_discovery = (
              "  if (!response) throw new CodeChangeError('targeted_test_route_missing', 502);\n"
              "  const payload = await responseObject(response);\n"
              "  if (!response.ok || payload.ok !== true) {\n"
              "    throw new CodeChangeError(\n"
              "      typeof payload.error === 'string' ? payload.error : 'targeted_test_discovery_failed',\n"
              "      response.status,\n"
              "      payload,\n"
              "    );\n"
              "  }\n"
              "  return payload;\n"
          )

          old_recovery = (
              "      const alreadyMerged = await mergedPullRequest(request, invoke, core, progress.pullRequest.number);\n"
              "      if (alreadyMerged) {\n"
              "        const cleanupResult = await cleanup(request, invoke, core, progress.pullRequest);\n"
          )
          new_recovery = (
              "      const alreadyMerged = await mergedPullRequest(request, invoke, core, progress.pullRequest.number);\n"
              "      if (alreadyMerged) {\n"
              "        const mergedHead = isObject(alreadyMerged.head) ? stringValue(alreadyMerged.head.sha) : null;\n"
              "        const mergedBase = isObject(alreadyMerged.base) ? stringValue(alreadyMerged.base.ref) : null;\n"
              "        if (!mergedHead || mergedHead.toLowerCase() !== progress.branchHead) {\n"
              "          throw new CodeChangeError('pull_request_head_changed', 409, {\n"
              "            expected: progress.branchHead,\n"
              "            current: mergedHead,\n"
              "          });\n"
              "        }\n"
              "        if (mergedBase !== progress.defaultBranch) {\n"
              "          throw new CodeChangeError('pull_request_base_changed', 409, {\n"
              "            expected: progress.defaultBranch,\n"
              "            current: mergedBase,\n"
              "          });\n"
              "        }\n"
              "        const cleanupResult = await cleanup(request, invoke, core, progress.pullRequest);\n"
          )

          for label, old, new in (
              ("targeted discovery", old_discovery, new_discovery),
              ("merged recovery", old_recovery, new_recovery),
          ):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Commit source fix
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gh-apps/kanarek-companion/src/code-change-orchestration.ts
          git commit -m "fix(gpt-actions): harden code change recovery"
          git push origin HEAD:${HEAD_REF}

  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - run: npm run check

  smoke-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-slim
    timeout-minutes: 12
    defaults:
      run:
        working-directory: gh-apps/kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - run: npm ci
      - name: Wait for Cloudflare production and smoke the live gateway
        run: npm run smoke:live
        env:
          KANAREK_LIVE_ORIGIN: https://kanarek-companion.travny.workers.dev
          KANAREK_SMOKE_ATTEMPTS: "36"
          KANAREK_SMOKE_INTERVAL_MS: "15000"
