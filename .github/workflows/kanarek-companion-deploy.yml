name: Deploy Kanarek companion

on:
  push:
    branches: [main]
    paths:
      - "kanarek-companion/**"
      - "!kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "kanarek-companion/**"
      - "!kanarek-companion/**/*.md"
      - ".github/workflows/kanarek-companion-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-kanarek-companion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: kanarek-companion
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kanarek-companion/package-lock.json

      - run: npm ci

      - name: Check
        run: npm run check

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
