name: Sync Kanarek review secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Sync router secrets
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            trvny/feedseek
            trvny/kanarek
            trvny/Autka
            trvny/tvpi
            trvny/wambridge
          )
          for repo in "${repos[@]}"; do
            printf '%s' "$ORCAROUTER_API_KEY" |
              gh secret set ORCAROUTER_API_KEY --repo "$repo"
            printf '%s' "$OPENROUTER_API_KEY" |
              gh secret set OPENROUTER_API_KEY --repo "$repo"
          done
