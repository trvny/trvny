name: Sync Kanarek review rollout

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
    steps:
      - name: Checkout review caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync review secrets and caller
        shell: bash
        run: |
          set -euo pipefail
          caller=.github/workflows/kanarek-review.yml
          repos=(
            trvny/feedseek
            trvny/kanarek
            trvny/Autka
            trvny/tvpi
            trvny/wambridge
          )

          for repo in "${repos[@]}"; do
            printf '%s' "$ORCAROUTER_API_KEY" |
              gh secret set ORCAROUTER_API_KEY --repo "$repo"
            printf '%s' "$OPENROUTER_API_KEY" |
              gh secret set OPENROUTER_API_KEY --repo "$repo"
            printf '%s' "$AIHUBMIX_API_KEY" |
              gh secret set AIHUBMIX_API_KEY --repo "$repo"

            default_branch=$(gh api "repos/$repo" --jq .default_branch)
            tmp=$(mktemp)
            blob_sha=''
            if gh api \
              -H 'Accept: application/vnd.github.raw+json' \
              "repos/$repo/contents/.github/workflows/kanarek-review.yml?ref=$default_branch" \
              >"$tmp" 2>/dev/null; then
              if cmp -s "$caller" "$tmp"; then
                rm -f "$tmp"
                continue
              fi
              blob_sha=$(gh api \
                "repos/$repo/contents/.github/workflows/kanarek-review.yml?ref=$default_branch" \
                --jq .sha)
            fi
            rm -f "$tmp"

            content=$(base64 -w0 "$caller")
            payload=$(jq -n \
              --arg message 'Sync Kanarek review caller' \
              --arg content "$content" \
              --arg branch "$default_branch" \
              --arg sha "$blob_sha" \
              '{
                message: $message,
                content: $content,
                branch: $branch,
                author: {
                  name: "GPTomek",
                  email: "314538226+gptomek[bot]@users.noreply.github.com"
                },
                committer: {
                  name: "GPTomek",
                  email: "314538226+gptomek[bot]@users.noreply.github.com"
                }
              } + (if $sha == "" then {} else {sha: $sha} end)')
            printf '%s' "$payload" |
              gh api --method PUT \
                "repos/$repo/contents/.github/workflows/kanarek-review.yml" \
                --input - >/dev/null
          done
