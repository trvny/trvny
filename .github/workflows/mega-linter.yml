# MegaLinter - code quality reports and project checks.
# https://megalinter.io
---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  # Everything that reaches main gets linted, including the trivial fixes that
  # AGENTS.md allows to be pushed straight there. Pushes and pull requests both
  # lint changed files only; the full-codebase sweep is reserved for
  # workflow_dispatch, since running it on every push is what made this
  # workflow the single largest consumer of Actions minutes. The trade-off is
  # real: after changing the rules under .github/linters, existing files are not
  # rescanned until someone dispatches a run by hand.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/documentation@v10
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none

      - name: Archive MegaLinter reports
        if: always() && steps.megalinter.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate MegaLinter
        if: always() && steps.megalinter.outcome != 'success'
        run: exit 1
