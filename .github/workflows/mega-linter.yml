# MegaLinter - code quality reports and project checks.
# https://megalinter.io
---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request: null
  workflow_dispatch:

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect bench changes
        id: benches
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          codebench=false
          streambench=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            codebench=true
            streambench=true
          elif [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            codebench=true
            streambench=true
          else
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"

            if printf '%s\n' "$changed_files" | grep -q '^\.github/workflows/mega-linter\.yml$'; then
              codebench=true
              streambench=true
            else
              if printf '%s\n' "$changed_files" | grep '^codebench/' | grep -qv '\.md$'; then
                codebench=true
              fi
              if printf '%s\n' "$changed_files" | grep '^streambench/' | grep -qv '\.md$'; then
                streambench=true
              fi
              if printf '%s\n' "$changed_files" | grep -q '^stuff/playlists/wklejony-tekst\.m3u8$'; then
                streambench=true
              fi
            fi
          fi

          echo "codebench=$codebench" >> "$GITHUB_OUTPUT"
          echo "streambench=$streambench" >> "$GITHUB_OUTPUT"

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/documentation@v9
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'workflow_dispatch' ||
              (
                github.event_name == 'push' &&
                contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
              )
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none

      - name: Set up Node.js
        if: steps.benches.outputs.codebench == 'true' || steps.benches.outputs.streambench == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check codebench
        id: codebench
        if: steps.benches.outputs.codebench == 'true'
        continue-on-error: true
        working-directory: codebench
        run: |
          npm install
          npm run build
          node --check src/index.js
          for file in public/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/privacy-check.mjs
          npx wrangler deploy --dry-run

      - name: Check streambench
        id: streambench
        if: steps.benches.outputs.streambench == 'true'
        continue-on-error: true
        working-directory: streambench
        run: |
          npm install
          npm run check

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "false"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate checks
        if: always()
        env:
          CODEBENCH_OUTCOME: ${{ steps.codebench.outcome }}
          STREAMBENCH_OUTCOME: ${{ steps.streambench.outcome }}
          MEGALINTER_OUTCOME: ${{ steps.megalinter.outcome }}
        run: |
          failed=false

          for check in \
            "codebench:$CODEBENCH_OUTCOME" \
            "streambench:$STREAMBENCH_OUTCOME" \
            "MegaLinter:$MEGALINTER_OUTCOME"
          do
            name="${check%%:*}"
            outcome="${check#*:}"
            case "$outcome" in
              success|skipped) ;;
              *)
                echo "$name failed: $outcome"
                failed=true
                ;;
            esac
          done

          [ "$failed" = false ]
