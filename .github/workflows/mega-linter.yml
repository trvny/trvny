# MegaLinter - cross-cutting lint and ready-made fix artifacts.
# https://megalinter.io
---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths: &lint-paths
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.json"
      - "**/*.md"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/linters/**"
      - ".github/instructions/**"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - "**/.windsurfrules"
      - "**/.clinerules"
      - ".github/workflows/mega-linter.yml"
  pull_request:
    paths: *lint-paths
  workflow_dispatch:
    inputs:
      sha:
        description: Optional DeepSource PR head SHA; leave blank to run MegaLinter
        required: false
        type: string

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.sha == '')
    concurrency:
      group: megalinter-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instruction Rot
        id: instruction_rot
        continue-on-error: true
        uses: trvny/.github/.github/actions/instruction-rot@9d3b98f7ceafd52aae0c707c1c667a1a8dedac0a
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/cupcake@v10.2.0
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none
          # Never expose the shared LLM credential to code/config from pull requests.
          LLM_ADVISOR_ENABLED: ${{ github.event_name != 'pull_request' && secrets.ORCAROUTER_API_KEY != '' }}
          LLM_PROVIDER: orcarouter
          LLM_MODEL_NAME: orcarouter/auto
          ORCAROUTER_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ORCAROUTER_API_KEY || '' }}

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          if-no-files-found: ignore
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate MegaLinter
        if: always() && steps.megalinter.outcome != 'success'
        run: exit 1

      - name: Gate Instruction Rot
        if: always() && steps.instruction_rot.outcome == 'failure'
        run: exit 1

  # Reporter is explicit opt-in. Never schedule GitHub API polling for PR statuses.
  deepsource_report:
    name: DeepSource PR findings (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.sha != ''
    permissions:
      pull-requests: read
      issues: write
    concurrency:
      group: deepsource-report-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Validate commit SHA
        env:
          TARGET_SHA: ${{ inputs.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Expected a 40-character commit SHA."
            exit 1
          fi

      - name: Publish DeepSource findings
        uses: trvny/.github/.github/actions/deepsource-pr-report@db7df3aeaf1ea883253cf09069612ed53b600dac
        with:
          deepsource-token: ${{ secrets.DEEPSOURCE_PAT }}
          github-token: ${{ github.token }}
          commit-sha: ${{ inputs.sha }}
