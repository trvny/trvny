# MegaLinter - code quality reports and project checks.
# https://megalinter.io
---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request: null
  workflow_dispatch:

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  benches:
    name: Bench checks
    runs-on: ubuntu-slim
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect bench changes
        id: benches
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          codebench=false
          streambench=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ] ||
             [ -z "$BASE_SHA" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            codebench=true
            streambench=true
          else
            if ! git diff --quiet "$BASE_SHA" HEAD -- codebench/; then
              codebench=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              streambench/ \
              stuff/playlists/iptv.m3u8 \
              stuff/playlists/internet_radio.m3u8; then
              streambench=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              .github/workflows/mega-linter.yml \
              .github/linters/.mega-linter.yml; then
              codebench=true
              streambench=true
            fi
          fi

          echo "codebench=$codebench" >> "$GITHUB_OUTPUT"
          echo "streambench=$streambench" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: >-
          steps.benches.outputs.codebench == 'true' ||
          steps.benches.outputs.streambench == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            codebench/package-lock.json
            streambench/package-lock.json

      - name: Check codebench
        id: codebench
        if: steps.benches.outputs.codebench == 'true'
        continue-on-error: true
        working-directory: codebench
        run: |
          npm ci
          npm run build
          node --check src/index.js
          for file in public/*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/privacy-check.mjs
          npx wrangler deploy --dry-run

      - name: Check streambench
        id: streambench
        if: steps.benches.outputs.streambench == 'true'
        continue-on-error: true
        working-directory: streambench
        run: |
          npm ci
          npm run check

      - name: Gate bench checks
        if: >-
          always() &&
          (
            (
              steps.benches.outputs.codebench == 'true' &&
              steps.codebench.outcome != 'success'
            ) ||
            (
              steps.benches.outputs.streambench == 'true' &&
              steps.streambench.outcome != 'success'
            )
          )
        run: exit 1

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/documentation@v9
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: >-
            ${{
              github.event_name == 'workflow_dispatch' ||
              (
                github.event_name == 'push' &&
                contains(fromJSON('["refs/heads/main", "refs/heads/master"]'), github.ref)
              )
            }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate MegaLinter
        if: always() && steps.megalinter.outcome != 'success'
        run: exit 1
