# MegaLinter - code quality reports and project checks.
# https://megalinter.io
---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  # Everything that reaches main gets linted, including the trivial fixes that
  # AGENTS.md allows to be pushed straight there. Pushes and pull requests both
  # lint changed files only; the full-codebase sweep is reserved for
  # workflow_dispatch, since running it on every push is what made this
  # workflow the single largest consumer of Actions minutes.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  benches:
    name: Bench checks
    if: github.event_name != 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect bench changes
        id: benches
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          codebench=false
          streambench=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ] ||
             [ -z "$BASE_SHA" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            codebench=true
            streambench=true
          else
            if ! git diff --quiet "$BASE_SHA" HEAD -- codebench/; then
              codebench=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- streambench/; then
              streambench=true
            fi
            if ! git diff --quiet "$BASE_SHA" HEAD -- \
              .github/workflows/benches-release.yml \
              .github/workflows/mega-linter.yml; then
              codebench=true
              streambench=true
            fi
          fi

          echo "codebench=$codebench" >> "$GITHUB_OUTPUT"
          echo "streambench=$streambench" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: >-
          steps.benches.outputs.codebench == 'true' ||
          steps.benches.outputs.streambench == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            codebench/package-lock.json
            streambench/package-lock.json

      - name: Check codebench
        id: codebench
        if: steps.benches.outputs.codebench == 'true'
        continue-on-error: true
        working-directory: codebench
        run: |
          npm ci
          npm run check

      - name: Check streambench
        id: streambench
        if: steps.benches.outputs.streambench == 'true'
        continue-on-error: true
        working-directory: streambench
        run: |
          npm ci
          npm run check

      - name: Gate bench checks
        if: >-
          always() &&
          (
            (
              steps.benches.outputs.codebench == 'true' &&
              steps.codebench.outcome != 'success'
            ) ||
            (
              steps.benches.outputs.streambench == 'true' &&
              steps.streambench.outcome != 'success'
            )
          )
        run: exit 1

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/documentation@v10
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none

      - name: Archive MegaLinter reports
        if: always() && steps.megalinter.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate MegaLinter
        if: always() && steps.megalinter.outcome != 'success'
        run: exit 1
