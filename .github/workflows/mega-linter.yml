# MegaLinter - cross-cutting lint and ready-made fix artifacts.
# https://megalinter.io
---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths: &lint-paths
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.json"
      - "**/*.md"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/linters/**"
      - ".github/instructions/**"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - "**/.windsurfrules"
      - "**/.clinerules"
      - ".github/workflows/mega-linter.yml"
  pull_request:
    paths: *lint-paths
  # Group external status updates into one periodic PR scan.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      sha:
        description: Optional DeepSource PR head SHA; leave blank to run MegaLinter
        required: false
        type: string

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.sha == '')
    concurrency:
      group: megalinter-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instruction Rot
        id: instruction_rot
        continue-on-error: true
        uses: trvny/.github/.github/actions/instruction-rot@9d3b98f7ceafd52aae0c707c1c667a1a8dedac0a
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/cupcake@v10.2.0
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none
          # Never expose the shared LLM credential to code/config from pull requests.
          LLM_ADVISOR_ENABLED: ${{ github.event_name != 'pull_request' && secrets.ORCAROUTER_API_KEY != '' }}
          LLM_PROVIDER: orcarouter
          LLM_MODEL_NAME: orcarouter/auto
          ORCAROUTER_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ORCAROUTER_API_KEY || '' }}

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          if-no-files-found: ignore
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate MegaLinter
        if: always() && steps.megalinter.outcome != 'success'
        run: exit 1

      - name: Gate Instruction Rot
        if: always() && steps.instruction_rot.outcome == 'failure'
        run: exit 1

  # A status trigger starts a workflow for every DeepSource analyzer transition,
  # including pending statuses; inspect completed PR heads on a timer instead.
  deepsource_targets:
    name: DeepSource report targets
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.sha != '')
    permissions:
      pull-requests: read
      statuses: read
      issues: read
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      shas: ${{ steps.targets.outputs.shas }}
    steps:
      - name: Find completed DeepSource PR heads
        id: targets
        uses: actions/github-script@v8
        env:
          MANUAL_SHA: ${{ inputs.sha || '' }}
        with:
          script: |
            const manual = process.env.MANUAL_SHA.trim();
            if (context.eventName === 'workflow_dispatch') {
              if (!/^[0-9a-f]{40}$/i.test(manual)) {
                core.setFailed('Expected a full 40-character commit SHA.');
                core.setOutput('shas', '[]');
                return;
              }
              core.setOutput('shas', JSON.stringify([manual.toLowerCase()]));
              return;
            }
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const ready = [];
            for (const pr of prs) {
              if (pr.head.repo?.full_name !== `${owner}/${repo}`) continue;
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                { owner, repo, ref: pr.head.sha, per_page: 100 },
              );
              const latest = new Map();
              for (const status of statuses) {
                if (status.context.startsWith('DeepSource: ') &&
                    !latest.has(status.context)) {
                  latest.set(status.context, status);
                }
              }
              // A single finished analyzer is not a completed DeepSource run.
              const expected = [
                'DeepSource: Java',
                'DeepSource: JavaScript',
                'DeepSource: Python',
                'DeepSource: Secrets',
                'DeepSource: Shell',
              ];
              if (!expected.every(name => latest.has(name)) ||
                  [...latest.values()].some(status => status.state === 'pending')) {
                continue;
              }
              // The existing PR report is the deduplication record.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              const prior = comments.find(comment =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes('<!-- deepsource-pr-findings:v1 -->')
              );
              const shortSha = pr.head.sha.slice(0, 7);
              const matchesHead = prior && (
                prior.body.includes(`DeepSource findings: ${shortSha}`) ||
                prior.body.includes(`DeepSource clear on ${shortSha}`)
              );
              const latestStatusAt = Math.max(...[...latest.values()].map(
                status => Date.parse(status.updated_at || status.created_at) || 0
              ));
              if (!matchesHead ||
                  Date.parse(prior.updated_at) < latestStatusAt) {
                ready.push(pr.head.sha);
              }
            }
            core.setOutput('shas', JSON.stringify([...new Set(ready)]));

  deepsource_report:
    name: DeepSource PR findings
    needs: deepsource_targets
    if: needs.deepsource_targets.outputs.shas != '[]'
    permissions:
      pull-requests: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sha: ${{ fromJSON(needs.deepsource_targets.outputs.shas) }}
    concurrency:
      group: deepsource-report-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Publish DeepSource findings
        uses: trvny/.github/.github/actions/deepsource-pr-report@db7df3aeaf1ea883253cf09069612ed53b600dac
        with:
          deepsource-token: ${{ secrets.DEEPSOURCE_PAT }}
          github-token: ${{ github.token }}
          commit-sha: ${{ matrix.sha }}
