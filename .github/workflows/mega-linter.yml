# MegaLinter - cross-cutting lint and ready-made fix artifacts.
# https://megalinter.io
---
name: MegaLinter

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths: &lint-paths
      - "**/*.css"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.json"
      - "**/*.md"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.yml"
      - "**/*.yaml"
      - ".github/linters/**"
      - ".github/instructions/**"
      - "**/.cursor/rules/**"
      - "**/.cursorrules"
      - "**/.windsurfrules"
      - "**/.clinerules"
      - ".github/workflows/mega-linter.yml"
  pull_request:
    paths: *lint-paths
  status:
  workflow_dispatch:
    inputs:
      sha:
        description: Optional DeepSource PR head SHA; leave blank to run MegaLinter
        required: false
        type: string

permissions:
  contents: read

jobs:
  megalinter:
    name: MegaLinter
    if: >-
      github.event_name != 'status' &&
      (github.event_name != 'workflow_dispatch' || inputs.sha == '')
    concurrency:
      group: megalinter-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instruction Rot
        id: instruction_rot
        continue-on-error: true
        uses: trvny/.github/.github/actions/instruction-rot@9d3b98f7ceafd52aae0c707c1c667a1a8dedac0a
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: MegaLinter
        id: megalinter
        continue-on-error: true
        uses: oxsecurity/megalinter/flavors/cupcake@v10.1.0
        env:
          MEGALINTER_CONFIG: .github/linters/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'workflow_dispatch' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_FIXES_EVENT: none
          # Never expose the shared LLM credential to code/config from pull requests.
          LLM_ADVISOR_ENABLED: ${{ github.event_name != 'pull_request' && secrets.ORCAROUTER_API_KEY != '' }}
          LLM_PROVIDER: orcarouter
          LLM_MODEL_NAME: orcarouter/auto
          ORCAROUTER_API_KEY: ${{ github.event_name != 'pull_request' && secrets.ORCAROUTER_API_KEY || '' }}

      - name: Archive MegaLinter reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          if-no-files-found: ignore
          retention-days: 7
          path: |
            megalinter-reports
            mega-linter.log

      - name: Gate MegaLinter
        if: always() && steps.megalinter.outcome != 'success'
        run: exit 1

      - name: Gate Instruction Rot
        if: always() && steps.instruction_rot.outcome == 'failure'
        run: exit 1

  # DeepSource code-quality statuses share the MegaLinter workflow.
  deepsource_report:
    name: DeepSource PR findings
    permissions:
      contents: read
      pull-requests: read
      issues: write
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.sha != '') ||
      (github.event_name == 'status' &&
       startsWith(github.event.context, 'DeepSource: ') &&
       github.event.state != 'pending')
    concurrency:
      group: deepsource-report-${{ github.event.sha || inputs.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Sync DeepSource details into PR conversation
        env:
          DEEPSOURCE_PAT: ${{ secrets.DEEPSOURCE_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.sha || inputs.sha }}
        run: |
          if [[ -z "$DEEPSOURCE_PAT" ]]; then
            echo "::notice::Configure DEEPSOURCE_PAT to enable issue reporting."
            exit 0
          fi
          python3 .github/scripts/deepsource_pr_report.py
