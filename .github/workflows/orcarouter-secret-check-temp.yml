name: Temporary OrcaRouter secret check

on:
  push:
    branches: [chore/gh-aw-orcarouter]
    paths:
      - ".github/workflows/orcarouter-secret-check-temp.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ORCAROUTER_CONFIGURED: ${{ secrets.ORCAROUTER_API_KEY != '' }}
    steps:
      - name: Verify OrcaRouter secret presence
        run: |
          echo "ORCAROUTER_API_KEY configured: ${ORCAROUTER_CONFIGURED}"
          test "${ORCAROUTER_CONFIGURED}" = "true"
