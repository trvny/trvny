---
name: Paint.NET ICO release

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    tags: [paintdotnet-ico-v*]
    paths:
      - stuff/other/paintdotnet-ico/**
      - .github/workflows/paintdotnet-ico-release.yml
  pull_request:
    paths:
      - stuff/other/paintdotnet-ico/**
      - .github/workflows/paintdotnet-ico-release.yml
  workflow_dispatch:

concurrency:
  group: paintdotnet-ico-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  PLUGIN_DIR: stuff/other/paintdotnet-ico
  PDN_51_URL: https://github.com/paintdotnet/release/releases/download/v5.1.12/paint.net.5.1.12.portable.x64.zip
  PDN_51_SHA256: d5ae7043f2fb9d365b48dfe243a2aca1c74924de99b04b6445916c95354aefa3
  PDN_52_URL: https://github.com/paintdotnet/release/releases/download/v5.2-alpha.5.200.9719.1528/paint.net.5.200.9719.1528.portable.x64.zip
  PDN_52_SHA256: 8a7be1aa650bf09341c2905dcfcc88b662bcf2fb24aff34d8ffc771afc4c88d0

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Read plugin version
        id: meta
        shell: pwsh
        run: |
          $legacy = [xml](Get-Content "$env:PLUGIN_DIR/PaintDotNetIco.csproj")
          $modern = [xml](Get-Content "$env:PLUGIN_DIR/PaintDotNetIco.Modern.csproj")
          $legacyVersion = $legacy.Project.PropertyGroup.Version | Select-Object -First 1
          $modernVersion = $modern.Project.PropertyGroup.Version | Select-Object -First 1
          if (-not $legacyVersion -or $legacyVersion -ne $modernVersion) {
            throw "Adapter versions differ: legacy=$legacyVersion modern=$modernVersion"
          }
          "version=$legacyVersion" >> $env:GITHUB_OUTPUT

      - name: Download verified Paint.NET SDK binaries
        shell: pwsh
        run: |
          $legacyZip = Join-Path $env:RUNNER_TEMP 'paintdotnet-5.1.zip'
          $modernZip = Join-Path $env:RUNNER_TEMP 'paintdotnet-5.2.zip'
          Invoke-WebRequest $env:PDN_51_URL -OutFile $legacyZip
          Invoke-WebRequest $env:PDN_52_URL -OutFile $modernZip
          $legacyHash = (Get-FileHash $legacyZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $modernHash = (Get-FileHash $modernZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($legacyHash -ne $env:PDN_51_SHA256) { throw 'Paint.NET 5.1 archive checksum mismatch.' }
          if ($modernHash -ne $env:PDN_52_SHA256) { throw 'Paint.NET 5.2 archive checksum mismatch.' }
          Expand-Archive $legacyZip -DestinationPath "$env:RUNNER_TEMP/pdn51"
          Expand-Archive $modernZip -DestinationPath "$env:RUNNER_TEMP/pdn52"
          $legacyProbe = Get-ChildItem "$env:RUNNER_TEMP/pdn51" -Recurse -Filter PaintDotNet.Data.dll | Select-Object -First 1
          $modernProbe = Get-ChildItem "$env:RUNNER_TEMP/pdn52" -Recurse -Filter PaintDotNet.FileTypes.dll | Select-Object -First 1
          if (-not $legacyProbe -or -not $modernProbe) { throw 'Paint.NET reference assemblies not found.' }
          "PDN_51_DIR=$($legacyProbe.Directory.FullName)" >> $env:GITHUB_ENV
          "PDN_52_DIR=$($modernProbe.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Build both adapters
        working-directory: ${{ env.PLUGIN_DIR }}
        shell: pwsh
        run: |
          dotnet build .\PaintDotNetIco.csproj -c Release -p:PaintDotNetDir="$env:PDN_51_DIR" --nologo
          dotnet build .\PaintDotNetIco.Modern.csproj -c Release -p:PaintDotNetDir="$env:PDN_52_DIR" --nologo

      - name: Package release assets
        working-directory: ${{ env.PLUGIN_DIR }}
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          $package = Join-Path $dist 'package'
          New-Item "$package/Paint.NET-5.1" -ItemType Directory -Force | Out-Null
          New-Item "$package/Paint.NET-5.2+" -ItemType Directory -Force | Out-Null
          $legacyDll = 'bin/Release/net9.0-windows/Travny.PaintDotNet.IcoFileType.dll'
          $modernDll = 'bin/Release/net10.0-windows/Travny.PaintDotNet.IcoFileType.Modern.dll'
          Copy-Item $legacyDll "$package/Paint.NET-5.1/"
          Copy-Item $modernDll "$package/Paint.NET-5.2+/"
          Copy-Item $legacyDll "$dist/Travny.PaintDotNet.IcoFileType.dll"
          Copy-Item $modernDll "$dist/Travny.PaintDotNet.IcoFileType.Modern.dll"
          @'
          Paint.NET ICO FileType

          Use Paint.NET-5.2+ for Paint.NET 5.2 or newer.
          Use Paint.NET-5.1 for Paint.NET 5.1.x.
          Copy the matching DLL to Paint.NET\FileTypes and restart Paint.NET.
          '@ | Set-Content "$package/INSTALL.txt"
          Compress-Archive -Path "$package/*" -DestinationPath "$dist/paintdotnet-ico.zip" -CompressionLevel Optimal
          $assets = @(
            "$dist/Travny.PaintDotNet.IcoFileType.dll",
            "$dist/Travny.PaintDotNet.IcoFileType.Modern.dll",
            "$dist/paintdotnet-ico.zip"
          )
          $lines = foreach ($asset in $assets) {
            $file = Get-Item $asset
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "$dist/SHA256SUMS"

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: paintdotnet-ico-release
          path: |
            stuff/other/paintdotnet-ico/dist/Travny.PaintDotNet.IcoFileType.dll
            stuff/other/paintdotnet-ico/dist/Travny.PaintDotNet.IcoFileType.Modern.dll
            stuff/other/paintdotnet-ico/dist/paintdotnet-ico.zip
            stuff/other/paintdotnet-ico/dist/SHA256SUMS
          retention-days: 1

  release:
    name: Publish release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v8
        with:
          name: paintdotnet-ico-release
          path: dist

      - name: Publish versioned and rolling releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            dist/Travny.PaintDotNet.IcoFileType.dll
            dist/Travny.PaintDotNet.IcoFileType.Modern.dll
            dist/paintdotnet-ico.zip
            dist/SHA256SUMS
          )

          cat > release-notes.md <<EOF
          Paint.NET ICO FileType v${VERSION}.

          - \`paintdotnet-ico.zip\`: both adapters with install notes
          - \`Travny.PaintDotNet.IcoFileType.Modern.dll\`: Paint.NET 5.2+
          - \`Travny.PaintDotNet.IcoFileType.dll\`: Paint.NET 5.1.x
          - \`SHA256SUMS\`: release asset checksums
          EOF
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version_tag="paintdotnet-ico-v${VERSION}"
            if [ "${GITHUB_REF_NAME}" != "$version_tag" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match project version ${VERSION}." >&2
              exit 1
            fi

            if gh release view "$version_tag" >/dev/null 2>&1; then
              is_draft="$(gh release view "$version_tag" --json isDraft --jq .isDraft)"
              if [ "$is_draft" = "true" ]; then
                gh release upload "$version_tag" "${assets[@]}" --clobber
                gh release edit "$version_tag" --draft=false --latest=false
              else
                echo "Versioned release $version_tag already exists; leaving it unchanged."
              fi
            else
              gh release create "$version_tag" \
                --draft \
                --verify-tag \
                --title "Paint.NET ICO v${VERSION}" \
                --notes-file release-notes.md \
                --latest=false
              gh release upload "$version_tag" "${assets[@]}"
              gh release edit "$version_tag" --draft=false --latest=false
            fi
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            rolling_tag="paintdotnet-ico-latest"
            cat > rolling-notes.md <<EOF
          Current Paint.NET ICO FileType build, v${VERSION}, from \`${GITHUB_SHA}\`.

          This rolling release backs the stable download link in the plugin README.
          Versioned releases use tags such as \`paintdotnet-ico-v${VERSION}\`.
          EOF

            if gh release view "$rolling_tag" >/dev/null 2>&1; then
              backup_dir="$(mktemp -d)"
              mkdir -p "$backup_dir/assets"
              old_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$rolling_tag" --jq .object.sha)"
              old_title="$(gh release view "$rolling_tag" --json name --jq .name)"
              gh release view "$rolling_tag" --json body --jq .body > "$backup_dir/notes.md"
              gh release download "$rolling_tag" --dir "$backup_dir/assets"

              rollback() {
                status=$?
                set +e
                gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$rolling_tag" -f sha="$old_sha" -F force=true
                gh release edit "$rolling_tag" --title "$old_title" --notes-file "$backup_dir/notes.md"
                gh release upload "$rolling_tag" "$backup_dir"/assets/* --clobber
                set -e
                return "$status"
              }
              trap rollback ERR

              gh release upload "$rolling_tag" "${assets[@]}" --clobber
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$rolling_tag" -f sha="$GITHUB_SHA" -F force=true
              gh release edit "$rolling_tag" --title "Paint.NET ICO · latest v${VERSION}" --notes-file rolling-notes.md
              trap - ERR
            else
              gh release create "$rolling_tag" \
                --draft \
                --target "$GITHUB_SHA" \
                --title "Paint.NET ICO · latest v${VERSION}" \
                --notes-file rolling-notes.md \
                --latest=false
              gh release upload "$rolling_tag" "${assets[@]}"
              gh release edit "$rolling_tag" --draft=false
            fi
          fi
