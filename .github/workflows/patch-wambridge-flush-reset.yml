name: Patch WAM flush reset

on:
  push:
    branches:
      - wambridge/foo-out-wam
    paths:
      - ".github/workflows/patch-wambridge-flush-reset.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: wambridge/foo-out-wam

      - name: Reset helper on flush
        shell: python
        run: |
          import base64
          from pathlib import Path

          path = Path("wambridge/foobar/foo_out_wam.cpp")
          source = path.read_text(encoding="utf-8")
          old = base64.b64decode(
              ""
          ).decode()
          new = base64.b64decode(
              "ICAgICAgICAgICAgbV9xdWV1ZS5jbGVhcigpOwogICAgICAgICAgICBtX2ZhaWx1cmUuY2xlYXIoKTsKICAgICAgICAgICAgcmV0aXJlX3N0cmVhbV9sb2NrZWQoKTsKICAgICAgICAgICAgbV9yZXN0YXJ0ID0gdHJ1ZTsKICAgICAgICAgICAgY2FuY2VsX2NoaWxkKCk7Cg=="
          ).decode()
          count = source.count(old)
          if count != 1:
              raise SystemExit(f"Expected one match, found {count}")
          path.write_text(source.replace(old, new), encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wambridge/foobar/foo_out_wam.cpp
          git rm .github/workflows/patch-wambridge-flush-reset.yml
          git commit -m "Reset WAM encoder on flush"
          git push origin HEAD:wambridge/foo-out-wam
