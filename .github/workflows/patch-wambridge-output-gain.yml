name: Patch WAM output gain

on:
  push:
    branches:
      - wambridge/foo-out-wam
    paths:
      - ".github/workflows/patch-wambridge-output-gain.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: wambridge/foo-out-wam

      - name: Apply gain when dequeuing PCM
        shell: python
        run: |
          import base64
          from pathlib import Path

          path = Path("wambridge/foobar/foo_out_wam.cpp")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "",
                  "",
              ),
              (
                  "",
                  "",
              ),
          ]

          for old_encoded, new_encoded in replacements:
              old = base64.b64decode(old_encoded).decode()
              new = base64.b64decode(new_encoded).decode()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wambridge/foobar/foo_out_wam.cpp
          git rm .github/workflows/patch-wambridge-output-gain.yml
          git commit -m "Apply WAM gain on dequeue"
          git push origin HEAD:wambridge/foo-out-wam
