name: Patch WAM pipe cancellation

on:
  push:
    branches:
      - wambridge/foo-out-wam
    paths:
      - ".github/workflows/patch-wambridge-pipe-cancel.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: wambridge/foo-out-wam

      - name: Patch helper cancellation
        shell: python
        run: |
          import base64
          from pathlib import Path

          replacements = {
              Path("wambridge/src/wambridge/pcm_cli.py"): [
                  (
                      "X1BBVVNFX0hBTkRPRkZfRVJST1IgPSAiU2Ftc3VuZyBXQU0gcmVqZWN0ZWQgUGF1c2VQbGF5YmFja0V2ZW50Igo=",
                      "X1BBVVNFX0hBTkRPRkZfRVJST1IgPSAiU2Ftc3VuZyBXQU0gcmVqZWN0ZWQgUGF1c2VQbGF5YmFja0V2ZW50IgpfQlJPS0VOX1BJUEVfRVJST1JTID0gezEwOSwgMjMzfQo=",
                  ),
                  (
                      "ZGVmIF93YWl0X2Zvcl9zdHJlYW1fZXZlbnQoCg==",
                      "",
                  ),
                  (
                      "ICAgICAgICBpZiBub3Qgc2VydmVyLnJlcXVlc3Rfc3RhcnRlZC53YWl0KHRpbWVvdXQ9YXJncy5zdGFydHVwX3RpbWVvdXQpOgogICAgICAgICAgICByYWlzZSBTdHJlYW1FcnJvcigKICAgICAgICAgICAgICAgICJTcGVha2VyIGFjY2VwdGVkIFVSTCBwbGF5YmFjayBidXQgZGlkIG5vdCByZXF1ZXN0IHRoZSBQQ00gc3RyZWFtIgogICAgICAgICAgICApCg==",
                      "ICAgICAgICBfd2FpdF9mb3Jfc3RyZWFtX3JlcXVlc3QoCiAgICAgICAgICAgIHNlcnZlciwKICAgICAgICAgICAgaW5wdXRfc3RyZWFtLAogICAgICAgICAgICB0aW1lb3V0PWFyZ3Muc3RhcnR1cF90aW1lb3V0LAogICAgICAgICkK",
                  ),
              ],
              Path("wambridge/tests/test_pcm_cli.py"): [
                  (
                      "ICAgIEBwYXRjaCgid2FtYnJpZGdlLnBjbV9jbGkucGxheV91cmwiKQogICAgQHBhdGNoKCJ3YW1icmlkZ2UucGNtX2NsaS5zZXRfdm9sdW1lIikKICAgIEBwYXRjaCgid2FtYnJpZGdlLnBjbV9jbGkuZ2V0X3ZvbHVtZSIsIHJldHVybl92YWx1ZT0wKQo=",
                      "",
                  ),
              ],
          }

          for path, changes in replacements.items():
              source = path.read_text(encoding="utf-8")
              for old_encoded, new_encoded in changes:
                  old = base64.b64decode(old_encoded).decode()
                  new = base64.b64decode(new_encoded).decode()
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f"{path}: expected one match, found {count}")
                  source = source.replace(old, new)
              path.write_text(source, encoding="utf-8")

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wambridge/src/wambridge/pcm_cli.py wambridge/tests/test_pcm_cli.py
          git rm .github/workflows/patch-wambridge-pipe-cancel.yml
          git commit -m "Cancel WAM startup on closed PCM pipe"
          git push origin HEAD:wambridge/foo-out-wam
