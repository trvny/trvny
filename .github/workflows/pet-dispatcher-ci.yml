name: Pet Dispatcher CI

on:
  push:
    branches: [main]
    paths:
      - "mcp/pet-dispatcher/**"
      - ".github/workflows/pet-dispatcher-ci.yml"
      - ".github/workflows/pet-dispatcher-control-deploy.yml"
      - ".github/scripts/sync-cloudflare-worker-secret.sh"
      - "assets/pet-dispatcher.svg"
      - "assets/pet-dispatcher.png"
  pull_request:
    branches: [main]
    paths:
      - "mcp/pet-dispatcher/**"
      - ".github/workflows/pet-dispatcher-ci.yml"
      - ".github/workflows/pet-dispatcher-control-deploy.yml"
      - ".github/scripts/sync-cloudflare-worker-secret.sh"
      - "assets/pet-dispatcher.svg"
      - "assets/pet-dispatcher.png"
  workflow_dispatch:

concurrency:
  group: pet-dispatcher-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp/pet-dispatcher
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/pet-dispatcher/package-lock.json

      - name: Install MXC process backend
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - run: npm ci
      - run: npm run check:portable
