name: Deploy Pet Dispatcher control plane

on:
  push:
    branches: [main]
    paths:
      - "mcp/pet-dispatcher/control-plane/**"
      - "mcp/pet-dispatcher/src/remote-protocol.ts"
      - "mcp/pet-dispatcher/package.json"
      - "mcp/pet-dispatcher/package-lock.json"
      - "mcp/pet-dispatcher/tsconfig.control-plane.json"
      - ".github/workflows/pet-dispatcher-control-deploy.yml"
  workflow_dispatch:

concurrency:
  group: pet-dispatcher-control-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp/pet-dispatcher
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_URL: https://pet-dispatcher-control.travny.workers.dev/health
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/pet-dispatcher/package-lock.json

      - run: npm ci

      - name: Validate control plane
        run: npm run control:check

      - name: Deploy control plane
        id: deploy
        shell: bash
        env:
          WRANGLER_OUTPUT_FILE: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          set -euo pipefail
          npm run control:deploy
          version_id=$(node --input-type=module -e '
            import fs from "node:fs";
            const rows = fs.readFileSync(process.env.WRANGLER_OUTPUT_FILE, "utf8")
              .trim().split(/\r?\n/u).filter(Boolean).map(JSON.parse);
            const deploy = rows.findLast((row) => row.type === "deploy");
            if (!deploy?.version_id) process.exit(1);
            process.stdout.write(deploy.version_id);
          ')
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Verify live health
        shell: bash
        env:
          DEPLOYED_VERSION_ID: ${{ steps.deploy.outputs.version_id }}
        run: |
          set -euo pipefail
          for _ in {1..12}; do
            if body=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$HEALTH_URL") &&
              BODY="$body" node --input-type=module -e '
                const body = JSON.parse(process.env.BODY);
                if (!(body.ok === true &&
                  body.service === "pet-dispatcher-control" &&
                  body.versionId === process.env.DEPLOYED_VERSION_ID)) process.exit(1);
              '
            then
              exit 0
            fi
            sleep 5
          done
          echo "Pet Dispatcher control plane did not expose deployed version $DEPLOYED_VERSION_ID." >&2
          exit 1
