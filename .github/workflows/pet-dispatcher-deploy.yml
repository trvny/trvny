name: Deploy Pet Dispatcher control plane

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pet-dispatcher-control
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HEALTH_URL: https://pet-dispatcher-control.travny.workers.dev/health
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/pet-dispatcher/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix mcp/pet-dispatcher

      - name: Validate control plane
        run: npm run control:check --prefix mcp/pet-dispatcher

      - name: Deploy control plane
        run: npm run control:deploy --prefix mcp/pet-dispatcher

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          for _attempt in {1..12}; do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$HEALTH_URL" |
              jq -e '.ok == true and .service == "pet-dispatcher-control"' >/dev/null
            then
              exit 0
            fi
            sleep 5
          done
          echo "Pet Dispatcher control plane did not become healthy." >&2
          exit 1
