name: PR 297 review fix

on:
  push:
    branches: [feat/code-change-autopilot]
    paths:
      - ".github/workflows/pr297-autopilot-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Apply exact review fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("gh-apps/kanarek-companion/src/code-change-orchestration.ts")
          source = path.read_text()

          old_discovery = (
              "  if (!response) return { ok: false, error: 'targeted_test_route_missing' };\n"
              "  return responseObject(response);\n"
          )
          new_discovery = (
              "  if (!response) throw new CodeChangeError('targeted_test_route_missing', 502);\n"
              "  const payload = await responseObject(response);\n"
              "  if (!response.ok || payload.ok !== true) {\n"
              "    throw new CodeChangeError(\n"
              "      typeof payload.error === 'string' ? payload.error : 'targeted_test_discovery_failed',\n"
              "      response.status,\n"
              "      payload,\n"
              "    );\n"
              "  }\n"
              "  return payload;\n"
          )

          old_recovery = (
              "      const alreadyMerged = await mergedPullRequest(request, invoke, core, progress.pullRequest.number);\n"
              "      if (alreadyMerged) {\n"
              "        const cleanupResult = await cleanup(request, invoke, core, progress.pullRequest);\n"
          )
          new_recovery = (
              "      const alreadyMerged = await mergedPullRequest(request, invoke, core, progress.pullRequest.number);\n"
              "      if (alreadyMerged) {\n"
              "        const mergedHead = isObject(alreadyMerged.head) ? stringValue(alreadyMerged.head.sha) : null;\n"
              "        const mergedBase = isObject(alreadyMerged.base) ? stringValue(alreadyMerged.base.ref) : null;\n"
              "        if (!mergedHead || mergedHead.toLowerCase() !== progress.branchHead) {\n"
              "          throw new CodeChangeError('pull_request_head_changed', 409, {\n"
              "            expected: progress.branchHead,\n"
              "            current: mergedHead,\n"
              "          });\n"
              "        }\n"
              "        if (mergedBase !== progress.defaultBranch) {\n"
              "          throw new CodeChangeError('pull_request_base_changed', 409, {\n"
              "            expected: progress.defaultBranch,\n"
              "            current: mergedBase,\n"
              "          });\n"
              "        }\n"
              "        const cleanupResult = await cleanup(request, invoke, core, progress.pullRequest);\n"
          )

          for label, old, new in (
              ("targeted discovery", old_discovery, new_discovery),
              ("merged recovery", old_recovery, new_recovery),
          ):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Commit patched tree and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr297-autopilot-fix.yml
          git add gh-apps/kanarek-companion/src/code-change-orchestration.ts
          git commit -m "fix(gpt-actions): harden code change recovery"
          git push origin HEAD:${GITHUB_REF_NAME}
