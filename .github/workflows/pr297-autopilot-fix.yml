name: PR 297 review fix

on:
  push:
    branches: [feat/code-change-autopilot]
    paths:
      - ".github/workflows/pr297-autopilot-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - name: Apply exact review fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path("gh-apps/kanarek-companion/src/code-change-orchestration.ts")
          source = path.read_text()

          old_discovery = """  if (!response) return { ok: false, error: 'targeted_test_route_missing' };
          return responseObject(response);
          """
          new_discovery = """  if (!response) throw new CodeChangeError('targeted_test_route_missing', 502);
          const payload = await responseObject(response);
          if (!response.ok || payload.ok !== true) {
            throw new CodeChangeError(
              typeof payload.error === 'string' ? payload.error : 'targeted_test_discovery_failed',
              response.status,
              payload,
            );
          }
          return payload;
          """

          old_recovery = """      const alreadyMerged = await mergedPullRequest(request, invoke, core, progress.pullRequest.number);
          if (alreadyMerged) {
            const cleanupResult = await cleanup(request, invoke, core, progress.pullRequest);
          """
          new_recovery = """      const alreadyMerged = await mergedPullRequest(request, invoke, core, progress.pullRequest.number);
          if (alreadyMerged) {
            const mergedHead = isObject(alreadyMerged.head) ? stringValue(alreadyMerged.head.sha) : null;
            const mergedBase = isObject(alreadyMerged.base) ? stringValue(alreadyMerged.base.ref) : null;
            if (!mergedHead || mergedHead.toLowerCase() !== progress.branchHead) {
              throw new CodeChangeError('pull_request_head_changed', 409, {
                expected: progress.branchHead,
                current: mergedHead,
              });
            }
            if (mergedBase !== progress.defaultBranch) {
              throw new CodeChangeError('pull_request_base_changed', 409, {
                expected: progress.defaultBranch,
                current: mergedBase,
              });
            }
            const cleanupResult = await cleanup(request, invoke, core, progress.pullRequest);
          """

          for label, old, new in (
            ("targeted discovery", old_discovery, new_discovery),
            ("merged recovery", old_recovery, new_recovery),
          ):
            count = source.count(old)
            if count != 1:
              raise SystemExit(f"{label}: expected exactly one match, got {count}")
            source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Verify companion
        working-directory: gh-apps/kanarek-companion
        run: |
          npm ci
          npm run check

      - name: Commit patched tree and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr297-autopilot-fix.yml
          git add gh-apps/kanarek-companion/src/code-change-orchestration.ts
          git commit -m "fix(gpt-actions): harden code change recovery"
          git push origin HEAD:${GITHUB_REF_NAME}
