name: Apply PR 297 review fixes

on:
  push:
    branches:
      - feat/code-change-autopilot
    paths:
      - .github/workflows/pr297-review-fixes.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.repository == 'trvny/trvny'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/code-change-autopilot
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gh-apps/kanarek-companion/package-lock.json

      - name: Apply review fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          root = Path('gh-apps/kanarek-companion')
          orchestration = root / 'src/code-change-orchestration.ts'
          actions = root / 'src/gpt-actions.ts'
          orchestration_test = root / 'test/code-change-orchestration.test.ts'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          def replace_regex(text: str, pattern: str, replacement: str, label: str) -> str:
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return new

          git_tree = textwrap.dedent(r'''\
          export type GitTreeEntry = {
            path: string;
            mode: string;
            type: string;
            sha: string;
          };

          export type ReadGitTree = (sha: string) => Promise<GitTreeEntry[]>;

          export async function resolveGitTreeEntries(
            rootTreeSha: string,
            paths: string[],
            readTree: ReadGitTree,
          ): Promise<Map<string, GitTreeEntry>> {
            const cache = new Map<string, Promise<GitTreeEntry[]>>();
            const load = (sha: string): Promise<GitTreeEntry[]> => {
              let pending = cache.get(sha);
              if (!pending) {
                pending = readTree(sha);
                cache.set(sha, pending);
              }
              return pending;
            };

            const resolved = new Map<string, GitTreeEntry>();
            for (const path of paths) {
              const parts = path.split('/');
              let treeSha = rootTreeSha;
              for (let index = 0; index < parts.length; index += 1) {
                const entries = await load(treeSha);
                const entry = entries.find((candidate) => candidate.path === parts[index]);
                if (!entry) break;
                if (index === parts.length - 1) {
                  resolved.set(path, { ...entry, path });
                  break;
                }
                if (entry.type !== 'tree') break;
                treeSha = entry.sha;
              }
            }
            return resolved;
          }
          ''')
          (root / 'src/git-tree.ts').write_text(git_tree)

          tree_test = textwrap.dedent(r'''\
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import { resolveGitTreeEntries, type GitTreeEntry } from '../src/git-tree.ts';

          test('git tree resolver walks requested paths and caches shared trees', async () => {
            const trees = new Map<string, GitTreeEntry[]>([
              ['root', [
                { path: 'src', mode: '040000', type: 'tree', sha: 'src-tree' },
                { path: 'link', mode: '120000', type: 'blob', sha: 'link-blob' },
              ]],
              ['src-tree', [
                { path: 'run.sh', mode: '100755', type: 'blob', sha: 'run-blob' },
                { path: 'plain.ts', mode: '100644', type: 'blob', sha: 'plain-blob' },
              ]],
            ]);
            const reads: string[] = [];
            const result = await resolveGitTreeEntries(
              'root',
              ['src/run.sh', 'src/plain.ts', 'link', 'missing.txt'],
              async (sha) => {
                reads.push(sha);
                return trees.get(sha) ?? [];
              },
            );

            assert.equal(result.get('src/run.sh')?.mode, '100755');
            assert.equal(result.get('src/plain.ts')?.sha, 'plain-blob');
            assert.equal(result.get('link')?.mode, '120000');
            assert.equal(result.has('missing.txt'), false);
            assert.deepEqual(reads.sort(), ['root', 'src-tree']);
          });
          ''')
          (root / 'test/git-tree.test.ts').write_text(tree_test)

          text = orchestration.read_text()
          text = replace_once(
              text,
              "import { loadAgentGuidance } from './agents-guidance.ts';\n",
              "import { loadAgentGuidance } from './agents-guidance.ts';\nimport { resolveGitTreeEntries, type GitTreeEntry } from './git-tree.ts';\n",
              'orchestration import',
          )
          text = replace_once(
              text,
              "const GPTOMEK_COMMIT_EMAIL = '314538226+gptomek[bot]@users.noreply.github.com';\n",
              "const GPTOMEK_COMMIT_EMAIL = '314538226+gptomek[bot]@users.noreply.github.com';\nconst OPERATION_TRAILER = 'GPTomek-Operation';\nconst INPUT_HASH_TRAILER = 'GPTomek-Input-Hash';\n",
              'provenance constants',
          )
          text = replace_once(
              text,
              "type EditAction = { type: 'edit'; message: string; files: EditFile[] };",
              "type EditAction = { type: 'edit'; headSha: string; revision: number; message: string; files: EditFile[] };",
              'edit action type',
          )
          text = replace_once(
              text,
              """  if (value.type === 'edit') {
              return {
                type: 'edit',
                message: requiredText(value.message, 'commit_message', 1_000),
                files: editFiles(value.files, scope),
              };
            }
          """,
              """  if (value.type === 'edit') {
              const headSha = expectedSha(value.headSha, 'edit_head_sha');
              const revision = numberValue(value.revision);
              if (revision === null || revision < 0) throw new CodeChangeError('invalid_edit_revision');
              return {
                type: 'edit',
                headSha,
                revision,
                message: requiredText(value.message, 'commit_message', 1_000),
                files: editFiles(value.files, scope),
              };
            }
          """,
              'edit parser',
          )
          text = replace_once(
              text,
              """function decodeContent(value: unknown): string | null {
            if (!isObject(value) || value.encoding !== 'base64' || typeof value.content !== 'string') return null;
            try {
              const binary = atob(value.content.replace(/\\s/g, ''));
              return new TextDecoder().decode(Uint8Array.from(binary, (char) => char.charCodeAt(0)));
            } catch {
              return null;
            }
          }
          """,
              """export function decodeContent(value: unknown): string | null {
            if (!isObject(value) || value.encoding !== 'base64' || typeof value.content !== 'string') return null;
            try {
              const binary = atob(value.content.replace(/\\s/g, ''));
              return new TextDecoder('utf-8', { fatal: true }).decode(
                Uint8Array.from(binary, (char) => char.charCodeAt(0)),
              );
            } catch {
              return null;
            }
          }
          """,
              'fatal utf8 decoder',
          )

          provenance = r'''export function operationCommitMessage(
            message: string,
            operationId: string,
            inputHash: string,
          ): string {
            return `${message}\n\n${OPERATION_TRAILER}: ${operationId}\n${INPUT_HASH_TRAILER}: ${inputHash}`;
          }

          export function commitProvenanceMatches(
            message: string | null,
            operationId: string,
            inputHash: string,
          ): boolean {
            if (!message) return false;
            const trailer = `\n\n${OPERATION_TRAILER}: ${operationId}\n${INPUT_HASH_TRAILER}: ${inputHash}`;
            return message.endsWith(trailer);
          }

          export function recoveredChangedPathsAllowed(changed: string[], submitted: string[]): boolean {
            if (new Set(changed).size !== changed.length) return false;
            const allowed = new Set(submitted);
            return changed.every((path) => allowed.has(path));
          }

          '''
          text = replace_once(text, 'function editFiles(value: unknown, scope: string[]): EditFile[] {', provenance + 'function editFiles(value: unknown, scope: string[]): EditFile[] {', 'provenance helpers')

          snapshots = r'''async function treeEntriesAtRef(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
            ref: string,
            paths: string[],
          ): Promise<Map<string, GitTreeEntry>> {
            const rawCommit = await readData(
              source,
              invoke,
              `/repos/${repoPath(core.repository)}/commits/${encodeURIComponent(ref)}`,
            );
            const commit = isObject(rawCommit) && isObject(rawCommit.commit) ? rawCommit.commit : null;
            const tree = commit && isObject(commit.tree) ? commit.tree : null;
            const treeSha = tree ? stringValue(tree.sha) : null;
            if (!treeSha || !SHA_RE.test(treeSha)) throw new CodeChangeError('invalid_commit_tree_response', 502);

            return resolveGitTreeEntries(treeSha, paths, async (sha) => {
              const raw = await readData(source, invoke, `/repos/${repoPath(core.repository)}/git/trees/${sha}`);
              if (!isObject(raw) || raw.truncated === true || !Array.isArray(raw.tree)) {
                throw new CodeChangeError('git_tree_not_readable', 502);
              }
              return raw.tree.flatMap((value): GitTreeEntry[] => {
                if (!isObject(value)) return [];
                const path = stringValue(value.path);
                const mode = stringValue(value.mode);
                const type = stringValue(value.type);
                const entrySha = stringValue(value.sha);
                return path && mode && type && entrySha && SHA_RE.test(entrySha)
                  ? [{ path, mode, type, sha: entrySha.toLowerCase() }]
                  : [];
              });
            });
          }

          type TargetFileSnapshot = {
            path: string;
            exists: boolean;
            content: string | null;
            mode?: string;
          };

          async function fileSnapshotsAtRef(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
            ref: string,
            paths: string[],
          ): Promise<TargetFileSnapshot[]> {
            const entries = await treeEntriesAtRef(source, invoke, core, ref, paths);
            return Promise.all(paths.map(async (path) => {
              const entry = entries.get(path);
              if (!entry) return { path, exists: false, content: null };
              if (
                entry.type !== 'blob' ||
                (entry.mode !== '100644' && entry.mode !== '100755' && entry.mode !== '120000')
              ) {
                throw new CodeChangeError('unsupported_target_file_mode', 409, { path, mode: entry.mode, type: entry.type });
              }
              const raw = await readData(
                source,
                invoke,
                `/repos/${repoPath(core.repository)}/git/blobs/${entry.sha}`,
              );
              const content = decodeContent(raw);
              if (content === null) throw new CodeChangeError('target_file_not_utf8', 415, { path });
              if (content.length > MAX_FILE_CONTENT) {
                throw new CodeChangeError('file_content_too_large', 413, { path });
              }
              return { path, exists: true, content, mode: entry.mode };
            }));
          }

          async function targetFileSnapshots(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
            ref: string,
          ): Promise<TargetFileSnapshot[]> {
            return fileSnapshotsAtRef(source, invoke, core, ref, core.targetPaths);
          }

          async function branchHead'''
          text = replace_regex(
              text,
              r"async function targetFileSnapshots\([\s\S]*?\n}\n\nasync function branchHead",
              snapshots,
              'target snapshots',
          )

          text = replace_once(
              text,
              """async function recoverEvolvedBranch(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
            currentBranch: string,
            defaultBranch: string,
          ): Promise<RecoveredBranch> {""",
              """async function recoverEvolvedBranch(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
            inputHash: string,
            currentBranch: string,
            defaultBranch: string,
          ): Promise<RecoveredBranch> {""",
              'recover signature',
          )
          text = replace_once(
              text,
              """      !commitIdentityMatches(commit.author) ||
                !commitIdentityMatches(commit.committer)
          """,
              """      !commitIdentityMatches(commit.author) ||
                !commitIdentityMatches(commit.committer) ||
                !commitProvenanceMatches(stringValue(commit.message), core.operationId, inputHash)
          """,
              'recovery provenance',
          )
          text = replace_once(
              text,
              'async function preparationContext(source: Request, invoke: Invoke, core: CoreInput): Promise<JsonObject> {',
              'async function preparationContext(source: Request, invoke: Invoke, core: CoreInput, inputHash: string): Promise<JsonObject> {',
              'preparation signature',
          )
          text = replace_once(
              text,
              """    core,
                currentBranch,
                currentBase.defaultBranch,
              );""",
              """    core,
                inputHash,
                currentBranch,
                currentBase.defaultBranch,
              );""",
              'recover call provenance',
          )

          recovered_commit = r'''async function verifyRecoveredCommit(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
            inputHash: string,
            previousHead: string,
            currentHead: string,
            edit: EditAction,
          ): Promise<boolean> {
            const commit = await readData(
              source,
              invoke,
              `/repos/${repoPath(core.repository)}/commits/${currentHead}`,
            );
            if (!isObject(commit) || !Array.isArray(commit.parents) || commit.parents.length !== 1) return false;
            const parent = isObject(commit.parents[0]) ? stringValue(commit.parents[0].sha) : null;
            const message = isObject(commit.commit) ? stringValue(commit.commit.message) : null;
            if (
              parent?.toLowerCase() !== previousHead ||
              message !== operationCommitMessage(edit.message, core.operationId, inputHash)
            ) return false;
            const files = Array.isArray(commit.files) ? commit.files : [];
            const changed = files
              .map((file) => (isObject(file) ? stringValue(file.filename) : null))
              .filter((path): path is string => Boolean(path));
            if (!recoveredChangedPathsAllowed(changed, edit.files.map((file) => file.path))) return false;

            const snapshots = await fileSnapshotsAtRef(
              source,
              invoke,
              core,
              currentHead,
              edit.files.map((file) => file.path),
            );
            const byPath = new Map(snapshots.map((snapshot) => [snapshot.path, snapshot]));
            return edit.files.every((file) => {
              const snapshot = byPath.get(file.path);
              if (!snapshot) return false;
              return file.content === null
                ? snapshot.exists === false
                : snapshot.exists === true && snapshot.content === file.content;
            });
          }

          async function commitEdit'''
          text = replace_regex(
              text,
              r"async function verifyRecoveredCommit\([\s\S]*?\n}\n\nasync function commitEdit",
              recovered_commit,
              'recovered commit verifier',
          )

          commit_edit = r'''async function commitEdit(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
            inputHash: string,
            progress: Progress,
            edit: EditAction,
          ): Promise<string> {
            const current = await branchHead(source, invoke, core);
            if (current !== progress.branchHead) {
              if (await verifyRecoveredCommit(source, invoke, core, inputHash, progress.branchHead, current, edit)) {
                return current;
              }
              throw new CodeChangeError('branch_head_changed', 409, { expected: progress.branchHead, current });
            }
            const { payload } = await invokePayload(source, invoke, COMMIT_FILES_PATH, {
              repository: core.repository,
              branch: core.branch,
              expectedHeadSha: progress.branchHead,
              message: operationCommitMessage(edit.message, core.operationId, inputHash),
              files: edit.files,
            });
            const sha = stringValue(payload.sha);
            if (!sha || !SHA_RE.test(sha)) throw new CodeChangeError('invalid_commit_response', 502);
            return sha.toLowerCase();
          }

          async function findOpenPullRequest'''
          text = replace_regex(
              text,
              r"async function commitEdit\([\s\S]*?\n}\n\nasync function findOpenPullRequest",
              commit_edit,
              'commit edit',
          )

          text = replace_once(
              text,
              """    nextAction: {
                type: 'edit',
                note: 'Use targetFiles as the authoritative full snapshot. Submit complete replacement contents only for declared targetPaths; missing targets are marked exists:false.',
              },""",
              """    nextAction: {
                type: 'edit',
                headSha: progress.branchHead,
                revision: progress.revision,
                note: 'Use targetFiles as the authoritative full snapshot. Submit complete replacement contents only for declared targetPaths; missing targets are marked exists:false.',
              },""",
              'editing next action',
          )
          text = replace_once(
              text,
              """async function initialProgress(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
          ): Promise<{ progress: Progress; body: JsonObject }> {
            const prepared = await preparationContext(source, invoke, core);""",
              """async function initialProgress(
            source: Request,
            invoke: Invoke,
            core: CoreInput,
            inputHash: string,
          ): Promise<{ progress: Progress; body: JsonObject }> {
            const prepared = await preparationContext(source, invoke, core, inputHash);""",
              'initial progress provenance',
          )
          text = replace_once(
              text,
              """      nextAction: {
                type: 'edit',
                note: 'Use targetFiles as the authoritative full snapshot. Submit complete replacement contents only for declared targetPaths; missing targets are marked exists:false.',
              },""",
              """      nextAction: {
                type: 'edit',
                headSha: progress.branchHead,
                revision: progress.revision,
                note: 'Use targetFiles as the authoritative full snapshot. Submit complete replacement contents only for declared targetPaths; missing targets are marked exists:false.',
              },""",
              'initial next action',
          )
          text = replace_once(
              text,
              '      const started = await initialProgress(request, invoke, core);',
              '      const started = await initialProgress(request, invoke, core, inputHash);',
              'initial call',
          )

          edit_block = r'''    if (submitted?.type === 'edit') {
              if (progress.stage !== 'editing' && progress.stage !== 'waiting_ci_review') {
                throw new CodeChangeError('edit_not_allowed_in_stage', 409, { stage: progress.stage });
              }
              if (submitted.headSha !== progress.branchHead || submitted.revision !== progress.revision) {
                throw new CodeChangeError('edit_revision_changed', 409, {
                  expectedHeadSha: progress.branchHead,
                  expectedRevision: progress.revision,
                });
              }

              let editProgress = progress;
              let recoveredEdit = false;
              if (progress.stage === 'waiting_ci_review') {
                if (!progress.pullRequest) throw new CodeChangeError('missing_pull_request_progress', 500);
                const current = await branchHead(request, invoke, core);
                if (current !== progress.branchHead) {
                  if (!await verifyRecoveredCommit(request, invoke, core, inputHash, progress.branchHead, current, submitted)) {
                    throw new CodeChangeError('branch_head_changed', 409, { expected: progress.branchHead, current });
                  }
                  editProgress = {
                    ...progress,
                    branchHead: current,
                    pullRequest: { ...progress.pullRequest, headSha: current },
                  };
                  recoveredEdit = true;
                }
                await assertPullRequestEditable(request, invoke, core, editProgress);
              }

              const previousHead = editProgress.branchHead;
              const newHead = recoveredEdit
                ? editProgress.branchHead
                : await commitEdit(request, invoke, core, inputHash, editProgress, submitted);
              if (progress.stage === 'waiting_ci_review' && newHead !== previousHead) {
                editProgress = {
                  ...editProgress,
                  branchHead: newHead,
                  pullRequest: editProgress.pullRequest
                    ? { ...editProgress.pullRequest, headSha: newHead }
                    : undefined,
                };
                await assertPullRequestEditable(request, invoke, core, editProgress);
              }

              const verificationPlan = await targetedVerification(request, invoke, core, newHead);
              const next: Progress = {
                ...editProgress,
                stage: 'verifying',
                branchHead: newHead,
                revision: progress.revision + 1,
                ...(editProgress.pullRequest
                  ? { pullRequest: { ...editProgress.pullRequest, headSha: newHead } }
                  : {}),
              };
              delete next.verification;
              return pause(env, core, inputHash, next, {
                ok: true,
                stage: 'verifying',
                revision: next.revision,
                headSha: newHead,
                verificationPlan,
                finalGate: 'Normal repository CI on the final PR head remains mandatory.',
                nextAction: verificationNextAction(next),
              });
            }

            if (submitted?.type === 'verification') {'''
          text = replace_regex(
              text,
              r"    if \(submitted\?\.type === 'edit'\) \{[\s\S]*?\n    if \(submitted\?\.type === 'verification'\) \{",
              edit_block,
              'edit state machine',
          )
          text = replace_once(
              text,
              "nextAction: { type: 'edit', note: 'Fix the failed targeted verification on the same guarded branch.' },",
              "nextAction: { type: 'edit', headSha: progress.branchHead, revision: progress.revision, note: 'Fix the failed targeted verification on the same guarded branch.' },",
              'failed verification next action',
          )
          text = replace_once(
              text,
              "required: ['type', 'message', 'files'],",
              "required: ['type', 'headSha', 'revision', 'message', 'files'],",
              'edit openapi required',
          )
          text = replace_once(
              text,
              """                    type: { type: 'string', enum: ['edit'] },
                        message: { type: 'string' },""",
              """                    type: { type: 'string', enum: ['edit'] },
                        headSha: { type: 'string', pattern: '^[0-9a-fA-F]{40}$' },
                        revision: { type: 'integer', minimum: 0 },
                        message: { type: 'string' },""",
              'edit openapi fields',
          )
          orchestration.write_text(text)

          text = actions.read_text()
          text = replace_once(
              text,
              "import type { CompanionEnv } from './companion-types.ts';\n",
              "import type { CompanionEnv } from './companion-types.ts';\nimport { resolveGitTreeEntries, type GitTreeEntry } from './git-tree.ts';\n",
              'gpt actions tree import',
          )
          text = replace_once(text, "  const message = requiredString(input.message, 'message', 1_000);", "  const message = requiredString(input.message, 'message', 1_500);", 'commit message size')
          tree_reader = r'''async function baseTreeEntries(
            client: GitHubInstallationClient,
            repositoryName: string,
            treeSha: string,
            paths: string[],
          ): Promise<Map<string, GitTreeEntry>> {
            return resolveGitTreeEntries(treeSha, paths, async (sha) => {
              const data = await client.json<{
                truncated?: boolean;
                tree?: Array<{ path?: string; mode?: string; type?: string; sha?: string }>;
              }>(
                `/repos/${repoPath(repositoryName)}/git/trees/${sha}`,
                'gpt_action_get_base_tree',
              );
              if (data.truncated === true || !Array.isArray(data.tree)) {
                throw new ActionError('base_tree_not_readable', 502);
              }
              return data.tree.flatMap((entry): GitTreeEntry[] => {
                return typeof entry.path === 'string' &&
                  typeof entry.mode === 'string' &&
                  typeof entry.type === 'string' &&
                  typeof entry.sha === 'string' &&
                  SHA_RE.test(entry.sha)
                  ? [{ path: entry.path, mode: entry.mode, type: entry.type, sha: entry.sha.toLowerCase() }]
                  : [];
              });
            });
          }

          async function commitFiles'''
          text = replace_regex(
              text,
              r"type ContentTreeEntry = \{ mode: string; type: string \};\n\nexport function contentTreeMode([\s\S]*?\n}\n\nasync function baseTreeEntries\([\s\S]*?\n}\n\nasync function commitFiles",
              """export function contentTreeMode(entry?: { mode?: unknown; type?: unknown }): '100644' | '100755' | '120000' {
            if (!entry) return '100644';
            if (
              entry.type !== 'blob' ||
              (entry.mode !== '100644' && entry.mode !== '100755' && entry.mode !== '120000')
            ) {
              throw new ActionError('unsupported_file_mode', 409);
            }
            return entry.mode;
          }

          """ + tree_reader,
              'path scoped tree reader',
          )
          text = replace_once(
              text,
              '  const baseEntries = await baseTreeEntries(client, repositoryName, baseCommit.tree.sha);',
              '  const baseEntries = await baseTreeEntries(client, repositoryName, baseCommit.tree.sha, files.map((file) => file.path));',
              'tree reader call',
          )
          actions.write_text(text)

          text = orchestration_test.read_text()
          text = replace_once(
              text,
              """import {
            addCodeChangeAutopilotOpenApi,
            reviewGateBlockers,
          } from '../src/code-change-orchestration.ts';""",
              """import {
            addCodeChangeAutopilotOpenApi,
            commitProvenanceMatches,
            decodeContent,
            operationCommitMessage,
            recoveredChangedPathsAllowed,
            reviewGateBlockers,
          } from '../src/code-change-orchestration.ts';""",
              'orchestration test imports',
          )
          text = replace_once(
              text,
              """  const verification = variants[1];
            assert.deepEqual(verification.required, ['type', 'status', 'headSha', 'revision']);""",
              """  const edit = variants[0];
            assert.deepEqual(edit.required, ['type', 'headSha', 'revision', 'message', 'files']);
            assert.equal(edit.properties.revision.minimum, 0);
            const verification = variants[1];
            assert.deepEqual(verification.required, ['type', 'status', 'headSha', 'revision']);""",
