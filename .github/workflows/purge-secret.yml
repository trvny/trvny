name: purge-secret-from-history

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Exact repo path of the leaked file (empty = just list candidates)"
        required: false
        default: ""
      confirm:
        description: 'Type "true" to actually rewrite history + force-push. Otherwise dry-run.'
        required: false
        default: "false"

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Clone full history
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git clone "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" work

      - name: List candidates (no path given)
        if: ${{ inputs.path == '' }}
        working-directory: work
        run: |
          echo "Files ever added, matching *api.md (excluding legit skill refs):"
          git log --all --pretty=format: --name-only --diff-filter=A \
            | sort -u | grep -iE 'api\.md$' | grep -v '^\.claude/skills/' || echo "(none found by that pattern)"
          echo
          echo "All files ever deleted (in case it was named otherwise):"
          git log --all --pretty=format: --name-only --diff-filter=D | sort -u | grep -v '^\.claude/skills/'
          echo
          echo ">> Re-run with path=<the leaked file> and confirm=true to purge."

      - name: Dry-run for given path
        if: ${{ inputs.path != '' && inputs.confirm != 'true' }}
        working-directory: work
        env:
          FILE_PATH: ${{ inputs.path }}
        run: |
          echo "Commits that ever touched '$FILE_PATH':"
          git log --all --oneline -- "$FILE_PATH" || true
          echo
          echo ">> If that's the right file, re-run with the same path and confirm=true."

      - name: Purge + force-push
        if: ${{ inputs.path != '' && inputs.confirm == 'true' }}
        working-directory: work
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          FILE_PATH: ${{ inputs.path }}
        run: |
          case "$FILE_PATH" in
            .claude/skills/*) echo "Refusing: '$FILE_PATH' is a legit skill file, not the leak."; exit 1 ;;
          esac
          git filter-repo --path "$FILE_PATH" --invert-paths --force
          git remote add origin "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git"
          git push origin --force --all
          git push origin --force --tags
          echo "Done. Now: delete this workflow, and rotate the leaked secrets."
