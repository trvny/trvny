name: Quarto report check

on:
  pull_request:
    paths:
      - "stuff/other/token-worldcup/**"
      - ".github/workflows/quarto-check.yml"
  push:
    branches: [main]
    paths:
      - "stuff/other/token-worldcup/**"
      - ".github/workflows/quarto-check.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render maintained Quarto sources
        run: |
          quarto render stuff/other/token-worldcup/token-worldcup.qmd
          quarto render stuff/other/token-worldcup/effort-matrix.qmd
      - name: Verify committed HTML is current
        run: git diff --exit-code -- stuff/other/token-worldcup
