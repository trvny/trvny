name: Quarto report check

on:
  pull_request:
    paths:
      - "stuff/other/token-worldcup.qmd"
      - "stuff/other/token-worldcup.css"
      - "stuff/other/token-worldcup.html"
      - ".github/workflows/quarto-check.yml"
  push:
    branches: [main]
    paths:
      - "stuff/other/token-worldcup.qmd"
      - "stuff/other/token-worldcup.css"
      - "stuff/other/token-worldcup.html"
      - ".github/workflows/quarto-check.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render maintained Quarto source
        run: quarto render stuff/other/token-worldcup.qmd
      - name: Verify committed HTML is current
        run: git diff --exit-code -- stuff/other/token-worldcup.html
