name: Quarto

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "pages/token-worldcup/**"
      - ".github/workflows/quarto.yml"
  push:
    branches: [main]
    paths:
      - "pages/token-worldcup/**"
      - ".github/workflows/quarto.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      task:
        description: Quarto task
        required: true
        default: check
        type: choice
        options:
          - check
          - update
          - all

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'check' || inputs.task == 'all'))
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node and cache npm downloads
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pages/token-worldcup/package-lock.json
      - name: Set up Python and cache pip downloads
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pages/token-worldcup/requirements.txt
      - name: Install tokenizer tools
        run: npm ci --prefix pages/token-worldcup --ignore-scripts
      - name: Verify OpenAI token counts
        run: npm run check:openai --prefix pages/token-worldcup
      - name: Install Python tokenizer tools
        run: python -m pip install --disable-pip-version-check -r pages/token-worldcup/requirements.txt
      - name: Verify DeepSeek V4.1 token counts
        run: python pages/token-worldcup/recount-deepseek-tokens.py --check
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Render token worldcup
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: pages/token-worldcup/token-worldcup.qmd
      - name: Render effort matrix
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: pages/token-worldcup/effort-matrix.qmd
      - name: Upload manually rendered HTML
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: token-worldcup-html-${{ github.sha }}
          path: |
            pages/token-worldcup/token-worldcup.html
            pages/token-worldcup/effort-matrix.html
          if-no-files-found: error
          retention-days: 7
      - name: Verify committed HTML is current
        if: github.event_name != 'workflow_dispatch'
        run: git diff --exit-code -- pages/token-worldcup

  update:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'update' || inputs.task == 'all'))
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"
      - name: Update extensions
        uses: mcanouil/quarto-extensions-updater@v2
        with:
          github-token: ${{ secrets.GH_PAT }}
          scan-directories: pages/token-worldcup
          update-strategy: minor
