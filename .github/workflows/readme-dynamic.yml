---
name: README dynamic

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: readme-dynamic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    name: Refresh shared quote and feed
    runs-on: ubuntu-slim
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/update-readme-quote.cjs
            .github/scripts/update-shared-readmes.cjs
          sparse-checkout-cone-mode: false

      - name: Require cross-repository token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Add the repository secret GH_PAT."
            exit 1
          fi

      - name: Update READMEs
        uses: actions/github-script@v9
        env:
          GIST_ID: 167d2271e3cf7d21e118aa7d906a7d2c
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          README_FEED_URLS: >-
            ${{ vars.README_FEED_URLS || 'https://raw.githubusercontent.com/trvny/feeds/main/feedseek/feeds/feed_pap.xml' }},
            https://raw.githubusercontent.com/trvny/feeds/main/feedseek/feeds/feed_daily_digest.xml,
            https://raw.githubusercontent.com/trvny/feeds/main/feedseek/feeds/feed_aibridge.xml,
            https://raw.githubusercontent.com/trvny/feeds/main/feedseek/feeds/feed_github.xml
          README_FEED_MAX_ENTRIES: ${{ vars.README_FEED_MAX_ENTRIES || '5' }}
          README_PATH: README.md
          README_TARGET_REPOS: >-
            trvny/feeds,
            trvny/tvpi,
            trvny/autka
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const run = require('./.github/scripts/update-shared-readmes.cjs');
            await run({ github, context, core });
      
  stats:
     runs-on: ubuntu-slim
     steps:
      - uses: actions/checkout@v7
      
      - name: top-languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&hide_title=true&langs_count=10
          path: assets/profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}

      - name: pin_1
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=trvny%2Ffeeds&theme=great-gatsby
          path: assets/profile/pin_1.svg
          token: ${{ secrets.GH_PAT }}

      - name: pin_2
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=trvny%2Ftvpi&theme=yeblu
          path: assets/profile/pin_2.svg
          token: ${{ secrets.GH_PAT }}
          
      - uses: stats-organization/github-readme-stats-action@v2
        with:
           card: gist
           options: id=167d2271e3cf7d21e118aa7d906a7d2&theme=synthwave       
           path: assets/profile/gist.svg
           token: ${{ secrets.GH_PAT }}
  
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
