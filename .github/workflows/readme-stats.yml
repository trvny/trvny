name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-slim

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
          
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=donut&hide_title=true&langs_count=10
          path: assets/profile/top-langs.svg
          token: ${{ secrets.GH_PAT }}

      - name: Generate pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=stats-organization&repo=github-readme-stats
          path: assets/profile/pin.svg
          token: ${{ secrets.GH_PAT }}

      - uses: stats-organization/github-readme-stats-action@v2
        with:
           card: gist
           options: id=167d2271e3cf7d21e118aa7d906a7d2&theme=synthwave       
           path: assets/profile/gist.svg
           token: ${{ secrets.GH_PAT }}
  
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
