name: Recompile Kanarek reviewers

on:
  push:
    paths:
      - .github/workflows/recompile-kanarek-reviewers.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install gh-aw v0.87.2
        run: |
          curl -fsSL https://github.com/github/gh-aw/releases/download/v0.87.2/linux-amd64 -o /tmp/gh-aw
          chmod +x /tmp/gh-aw
      - name: Compile reviewer workflows
        run: |
          /tmp/gh-aw compile --validate --no-check-update \
            .github/workflows/kanarek-review-openrouter-worker.md \
            .github/workflows/kanarek-review-worker.md
      - name: Commit generated locks
        run: |
          git config user.name 'gptomek[bot]'
          git config user.email '314538226+gptomek[bot]@users.noreply.github.com'
          git add \
            .github/workflows/kanarek-review-openrouter-worker.lock.yml \
            .github/workflows/kanarek-review-worker.lock.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(review): regenerate reviewer locks'
          git pull --rebase origin main
          git push origin HEAD:main
