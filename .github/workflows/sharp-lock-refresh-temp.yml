name: Refresh sharp lockfiles

on:
  pull_request:
    paths:
      - "weather-feed/package.json"
      - "mcp/status-mcp/package.json"
      - ".github/workflows/sharp-lock-refresh-temp.yml"

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh weather-feed lockfile
        working-directory: weather-feed
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh status-mcp lockfile
        working-directory: mcp/status-mcp
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched sharp tree
        run: |
          node -e 'for (const p of ["weather-feed/package-lock.json", "mcp/status-mcp/package-lock.json"]) { const l=require("./"+p); const s=l.packages["node_modules/sharp"]?.version; const v=l.packages["node_modules/@img/sharp-libvips-linux-x64"]?.version; if(s!=="0.35.3"||v!=="1.3.2") throw new Error(`${p}: sharp=${s}, libvips package=${v}`); console.log(`${p}: sharp ${s}, @img/sharp-libvips ${v}`) }'
      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-feed/package-lock.json mcp/status-mcp/package-lock.json
          git diff --cached --quiet || git commit -m "security: refresh sharp lockfiles"
          git push
