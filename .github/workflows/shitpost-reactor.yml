name: Shitpost Reactor

on:
  schedule:
    # Early morning: free provider daily quotas fresh, little PR traffic.
    - cron: "20 4 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      topic:
        description: Optional topic or setup for this one draft
        required: false
        type: string
      mode:
        description: Output type
        required: false
        default: auto
        type: choice
        options:
          - auto
          - text
          - meme

permissions:
  contents: read
  id-token: write

concurrency:
  group: shitpost-reactor
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: gh-apps/shitpost-reactor
    env:
      SHITPOST_TOPIC: ${{ github.event.inputs.topic || '' }}
      SHITPOST_MODE: ${{ github.event.inputs.mode || 'auto' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install shared npm workspace
        working-directory: gh-apps
        run: npm ci --no-audit --no-fund

      - name: Test generator and feed
        run: npm test

      - name: Require compatible deployed Reactor Worker
        shell: bash
        run: |
          set -euo pipefail
          worker_paths=(
            gh-apps/shitpost-reactor
            gh-apps/package.json
            gh-apps/package-lock.json
            gh-apps/core/worker-deploy.mjs
            gh-apps/core/deploy-lock.mjs
            ':(exclude,glob)gh-apps/shitpost-reactor/**/*.md'
          )
          expected="$(git -C ../.. log -1 --first-parent --format=%H -- "${worker_paths[@]}")"
          for attempt in {1..10}; do
            deployed="$(curl --fail --silent --show-error --max-time 8 https://shitpost-reactor.travny.workers.dev/version || true)"
            # Docs-only Builds stamp a newer commit without changing Worker code.
            if [[ "$deployed" =~ ^[0-9a-f]{40}$ ]] \
              && git -C ../.. merge-base --is-ancestor "$expected" "$deployed" 2>/dev/null \
              && [[ "$(git -C ../.. log -1 --first-parent --format=%H "$deployed" -- "${worker_paths[@]}")" == "$expected" ]]; then
              echo "Reactor Worker compatible: deployed=$deployed source=$expected"
              exit 0
            fi
            echo "Reactor Worker not compatible with $expected (deployed=${deployed:-unavailable}, attempt $attempt/10)"
            sleep 15
          done
          echo "Reactor Worker deployment is stale or incompatible; refusing publish" >&2
          exit 1

      - name: Generate draft
        shell: bash
        env:
          KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
          SHITPOST_OUTPUT_DIR: ${{ runner.temp }}/shitpost-reactor
        run: |
          set -euo pipefail
          : "${KANAREK_REVIEW_ROUTER_TOKEN:?KANAREK_REVIEW_ROUTER_TOKEN must be configured}"
          npm run generate

      - name: Publish to public feed
        env:
          SHITPOST_OUTPUT_DIR: ${{ runner.temp }}/shitpost-reactor
        run: npm run publish

      - name: Upload draft
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shitpost-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shitpost-reactor/
          if-no-files-found: warn
          retention-days: 14
