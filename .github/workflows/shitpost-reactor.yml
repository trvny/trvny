name: Shitpost Reactor

on:
  schedule:
    - cron: "37 21 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      topic:
        description: Optional topic or setup for this one draft
        required: false
        type: string
      mode:
        description: Output type
        required: false
        default: auto
        type: choice
        options:
          - auto
          - text
          - meme

permissions:
  contents: read
  id-token: write

concurrency:
  group: shitpost-reactor
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gh-apps/shitpost-reactor
    env:
      KANAREK_REVIEW_ROUTER_TOKEN: ${{ secrets.KANAREK_REVIEW_ROUTER_TOKEN }}
      SHITPOST_TOPIC: ${{ github.event.inputs.topic || '' }}
      SHITPOST_MODE: ${{ github.event.inputs.mode || 'auto' }}
      SHITPOST_PUBLISH_URL: https://shitpost.trfny.com/api/publish
      SHITPOST_PUBLISH_AUDIENCE: https://shitpost.trfny.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test generator and feed
        run: npm test

      - name: Generate draft
        shell: bash
        env:
          SHITPOST_OUTPUT_DIR: ${{ runner.temp }}/shitpost-reactor
        run: |
          set -euo pipefail
          : "${KANAREK_REVIEW_ROUTER_TOKEN:?KANAREK_REVIEW_ROUTER_TOKEN must be configured}"
          npm run generate

      - name: Publish to public feed
        env:
          SHITPOST_OUTPUT_DIR: ${{ runner.temp }}/shitpost-reactor
        run: npm run publish

      - name: Upload draft
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shitpost-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shitpost-reactor/
          if-no-files-found: error
          retention-days: 14
