name: Status MCP CI

on:
  push:
    branches: [main]
    paths:
      - "mcp/status-mcp/**"
      - "!mcp/status-mcp/**/*.md"
      - ".github/workflows/status-mcp-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp/status-mcp/**"
      - "!mcp/status-mcp/**/*.md"
      - ".github/workflows/status-mcp-ci.yml"
  workflow_dispatch:

concurrency:
  group: status-mcp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mcp/status-mcp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/status-mcp/package-lock.json

      - run: npm ci
      - run: npm run typecheck
