name: Deploy status-mcp

on:
  push:
    branches: [main]
    paths:
      - "mcp/status-mcp/**"
      - ".github/workflows/status-mcp-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-status-mcp
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp/status-mcp
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/status-mcp/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
