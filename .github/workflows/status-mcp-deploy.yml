name: Deploy status-mcp

on:
  push:
    branches: [main]
    paths:
      - "mcp/status-mcp/**"
      - "!mcp/status-mcp/**/*.md"
      - ".github/workflows/status-mcp-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "mcp/status-mcp/**"
      - "!mcp/status-mcp/**/*.md"
      - ".github/workflows/status-mcp-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-status-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mcp/status-mcp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/status-mcp/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Deploy
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
