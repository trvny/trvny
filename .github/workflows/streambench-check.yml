name: Check streambench

on:
  push:
    branches: [main]
    paths:
      - "streambench/**"
      - ".github/workflows/streambench-check.yml"
  pull_request:
    paths:
      - "streambench/**"
      - ".github/workflows/streambench-check.yml"
  workflow_dispatch:

concurrency:
  group: check-streambench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: streambench
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
