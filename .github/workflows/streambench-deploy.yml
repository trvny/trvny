name: Deploy streambench

on:
  push:
    branches: [main]
    paths:
      - "streambench/**"
      - ".github/workflows/streambench-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-streambench
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        working-directory: streambench
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install

      - name: Check
        run: npm run check

      - name: Deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          output="$(npx wrangler deploy 2>&1 | tee /dev/stderr)"
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -1)"
          if [ -z "$url" ]; then
            echo "::error::Wrangler did not report a workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Production smoke test
        run: npm run smoke -- "${{ steps.deploy.outputs.url }}"
