name: Smoke streambench

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed Streambench HTTPS URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node streambench/scripts/smoke.mjs "${{ inputs.base_url }}"
