name: Apply Streambench playlist patch

on:
  push:
    branches: [feat/streambench-add-current]
    paths:
      - ".github/workflows/temp-streambench-add-current.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-streambench-add-current.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feat/streambench-add-current
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Write checked implementation
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          python <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          payload = base64.b64decode(os.environ["PATCH_GZIP_BASE64"])
          Path("streambench/public/playlist-workspace.js").write_bytes(gzip.decompress(payload))
          PY
          node --check streambench/public/playlist-workspace.js
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/temp-streambench-add-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streambench/public/playlist-workspace.js .github/workflows/temp-streambench-add-current.yml
          git commit -m "feat: add current stream to playlist"
          git push origin HEAD:feat/streambench-add-current
