name: Temporary Docbench attachment round-trip

on:
  push:
    branches:
      - feat/docbench-pdf-attachments
    paths:
      - .github/tmp-docbench-attachment-roundtrip.py
      - .github/tmp-docbench-attachment-roundtrip-fix.py
      - .github/tmp-docbench-attachment-final.py
      - .github/workflows/tmp-docbench-attachment-roundtrip.yml

permissions:
  contents: write

jobs:
  patch-check-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/docbench-pdf-attachments
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docbench/package-lock.json
      - name: Apply attachment preservation patches
        run: |
          python .github/tmp-docbench-attachment-roundtrip.py
          python .github/tmp-docbench-attachment-roundtrip-fix.py
          python .github/tmp-docbench-attachment-final.py
          python - <<'PY'
          from pathlib import Path
          src = Path('docbench/tests/pdf-attachment-review.test.mjs')
          text = src.read_text(encoding='utf-8')
          marks = [
              ('const caseDistinctBase =', 'case-distinct'),
              ('const pdfa2aDocument =', 'pdfa-level-a'),
              ('const richBase =', 'rich-filespec'),
              ('const richSourceBytes =', 'rich-source-save'),
              ('const richAttachments =', 'rich-source-saved'),
              ('const richRoundTrip =', 'rich-read'),
              ('const richOutput =', 'rich-roundtrip-saved'),
              ('const aliasBase =', 'shared-alias'),
              ('const filenamesBase =', 'independent-filenames'),
              ('console.log("Doc Bench PDF attachment review tests passed.");', 'done'),
          ]
          for needle, label in marks:
              text = text.replace(needle, f'console.log("TRACE {label}");\n{needle}', 1)
          Path('docbench/tests/pdf-attachment-debug.test.mjs').write_text(text, encoding='utf-8')
          PY
          nl -ba docbench/tests/pdf-attachment-debug.test.mjs | sed -n '276,294p'
      - name: Install
        working-directory: docbench
        run: npm ci --no-audit --no-fund
      - name: Trace attachment regressions
        working-directory: docbench
        run: node tests/pdf-attachment-debug.test.mjs
      - name: Check Docbench
        working-directory: docbench
        run: npm run check
      - name: Commit clean fix
        shell: bash
        run: |
          rm -rf docbench/public/fonts
          rm -f docbench/tests/pdf-attachment-debug.test.mjs
          rm -f \
            .github/tmp-docbench-attachment-filespec-testfix.py \
            .github/tmp-docbench-attachment-filespec.py \
            .github/tmp-docbench-attachment-roundtrip.py \
            .github/tmp-docbench-attachment-roundtrip-fix.py \
            .github/tmp-docbench-attachment-final.py \
            .github/workflows/tmp-docbench-attachment-filespec.yml \
            .github/workflows/tmp-docbench-attachment-roundtrip.yml \
            .github/workflows/tmp-docbench-attachment-roundtrip-macos.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "gptomek[bot]"
          git config user.email "199175422+gptomek[bot]@users.noreply.github.com"
          git commit -m "fix(docbench): preserve attachment round trips"
          git push origin HEAD:feat/docbench-pdf-attachments
