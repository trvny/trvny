name: Temporary Docbench attachment round-trip

on:
  push:
    branches:
      - feat/docbench-pdf-attachments
    paths:
      - .github/tmp-docbench-attachment-roundtrip.py
      - .github/tmp-docbench-attachment-roundtrip-fix.py
      - .github/tmp-docbench-attachment-final.py
      - .github/workflows/tmp-docbench-attachment-roundtrip.yml

permissions:
  contents: write

jobs:
  patch-check-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/docbench-pdf-attachments
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docbench/package-lock.json
      - name: Apply attachment preservation patches
        run: |
          python .github/tmp-docbench-attachment-roundtrip.py
          python .github/tmp-docbench-attachment-roundtrip-fix.py
          python .github/tmp-docbench-attachment-final.py
          echo '--- generated failing-test area ---'
          nl -ba docbench/tests/pdf-attachment-review.test.mjs | sed -n '215,245p'
          echo '--- generated merge helper area ---'
          nl -ba docbench/public/pdf-core.mjs | sed -n '1240,1288p'
      - name: Install
        working-directory: docbench
        run: npm ci --no-audit --no-fund
      - name: Check Docbench
        working-directory: docbench
        run: npm run check
      - name: Commit clean fix
        shell: bash
        run: |
          rm -rf docbench/public/fonts
          rm -f \
            .github/tmp-docbench-attachment-filespec-testfix.py \
            .github/tmp-docbench-attachment-filespec.py \
            .github/tmp-docbench-attachment-roundtrip.py \
            .github/tmp-docbench-attachment-roundtrip-fix.py \
            .github/tmp-docbench-attachment-final.py \
            .github/workflows/tmp-docbench-attachment-filespec.yml \
            .github/workflows/tmp-docbench-attachment-roundtrip.yml \
            .github/workflows/tmp-docbench-attachment-roundtrip-macos.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "gptomek[bot]"
          git config user.email "199175422+gptomek[bot]@users.noreply.github.com"
          git commit -m "fix(docbench): preserve attachment round trips"
          git push origin HEAD:feat/docbench-pdf-attachments
