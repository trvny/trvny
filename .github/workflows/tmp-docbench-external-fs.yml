name: Temporary Docbench external FileSpec hotfix

on:
  push:
    branches:
      - feat/docbench-pdf-attachments
    paths:
      - .github/tmp-docbench-external-fs.py
      - .github/workflows/tmp-docbench-external-fs.yml

permissions:
  contents: write

jobs:
  patch-check-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/docbench-pdf-attachments
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docbench/package-lock.json
      - name: Apply hotfix
        run: python .github/tmp-docbench-external-fs.py
      - name: Install
        working-directory: docbench
        run: npm ci --no-audit --no-fund
      - name: Check Docbench
        working-directory: docbench
        run: npm run check
      - name: Commit clean hotfix
        shell: bash
        run: |
          rm -rf docbench/public/fonts
          rm -f \
            .github/tmp-docbench-attachment-final.py \
            .github/tmp-docbench-external-fs.py \
            .github/workflows/tmp-docbench-external-fs.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "gptomek[bot]"
          git config user.email "199175422+gptomek[bot]@users.noreply.github.com"
          git commit -m "fix(docbench): preserve external FileAttachment targets"
          git push origin HEAD:feat/docbench-pdf-attachments
