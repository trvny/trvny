name: Probe Monday icon archives fast
on:
  push:
    branches:
      - tmp/monday-icon-probe-20261105
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe fast
        shell: bash
        run: |
          set -u
          for u in             'https://web.archive.org/cdx/search/cdx?url=files.oaiusercontent.com/file-9TrFWKq8W7mNBmLy1dP9QT*&output=json&filter=statuscode:200&collapse=digest'             'https://web.archive.org/cdx/search/cdx?url=files.oaiusercontent.com/file-RFWBMhwa9SsnXoMCKdyBjH*&output=json&filter=statuscode:200&collapse=digest'             'https://index.commoncrawl.org/CC-MAIN-2025-18-index?url=chatgpt.com%2Fg%2Fg-67ec3b78892481918c89067962526695-monday&output=json'             'https://index.commoncrawl.org/CC-MAIN-2025-21-index?url=chatgpt.com%2Fg%2Fg-67ec3b78892481918c89067962526695-monday&output=json'
          do
            echo "=== $u"
            timeout 12s curl -L -sS "$u" | head -c 12000 || true
            echo
          done
