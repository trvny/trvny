name: Probe AIPRM Monday asset
on:
  push:
    branches:
      - tmp/monday-icon-probe-20261105
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe AIPRM
        shell: bash
        run: |
          set -u
          mkdir -p out
          for id in             g-67ec3b78892481918c89067962526695             g-67ec3b4988f8819184c5454e18f5e84b             g-67edab4a24fc8191b975acaa8da2dcef
          do
            url="https://app.aiprm.com/gpts/$id/monday"
            echo "=== $url"
            curl -L --max-time 35 -sS -D "out/$id.headers" -A 'Mozilla/5.0' "$url" -o "out/$id.html" || true
            head -8 "out/$id.headers" || true
            grep -Eoi 'https?[^"<> ]+\.(png|jpe?g|webp)(\?[^"<> ]*)?' "out/$id.html" | head -30 || true
            grep -Eoi '<meta[^>]+(og:image|twitter:image)[^>]+>' "out/$id.html" | head -10 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monday-aiprm-probe
          path: out/
          if-no-files-found: error
          retention-days: 2
