name: Recover Monday static GPT image
on:
  push:
    branches:
      - tmp/monday-icon-probe-20261105
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch static screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          urls=(
            'https://assets.st-note.com/production/uploads/images/183949594/rectangle_large_type_2_a47b8e271bdb66aaef053842917e6abf.png?width=1200'
            'https://assets.st-note.com/production/uploads/images/183949594/rectangle_large_type_2_a47b8e271bdb66aaef053842917e6abf.png'
          )
          names=(note-1200.png note-original.png)
          for i in 0 1; do
            curl -fL --retry 2 --connect-timeout 10 --max-time 40 -A 'Mozilla/5.0' "${urls[$i]}" -o "out/${names[$i]}" || rm -f "out/${names[$i]}"
            [ -f "out/${names[$i]}" ] && file "out/${names[$i]}" || true
          done
          ls -lh out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monday-note-static
          path: out/
          if-no-files-found: error
          retention-days: 2
