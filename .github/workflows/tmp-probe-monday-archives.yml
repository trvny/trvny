name: Probe Monday GPT metadata cache
on:
  push:
    branches:
      - tmp/monday-icon-probe-20261105
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query legacy get-gpts
        shell: bash
        run: |
          set -u
          for host in draw.openai-next.com api.openai-next.com; do
            for id in               g-67ec3b4988f8819184c5454e18f5e84b               g-67ec3b78892481918c89067962526695               g-67edaaa3d3a081918205d0c470f00a32
            do
              echo "=== $host $id"
              body=$(printf '{"model":"get-gpts","messages":[{"role":"user","content":"%s"}],"stream":false}' "$id")
              timeout 20s curl -L -sS -D /tmp/h "https://$host/v1/chat/completions"                 -H 'Content-Type: application/json' -d "$body" -o /tmp/body || true
              head -8 /tmp/h || true
              head -c 16000 /tmp/body || true
              echo
            done
          done
