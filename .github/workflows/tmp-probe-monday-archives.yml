name: Recover Monday static GPT screenshot
on:
  push:
    branches:
      - tmp/monday-icon-probe-20261105
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe LinkedIn image sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          base='https://media.licdn.com/dms/image/v2/D4E22AQFxeDr128ScNg'
          tail='B4EZYDCh1aGYAg-/0/1743807717336?e=2147483647&t=UjMoqV0umInyaT8Zxl69haQ-wEJ4cBw7TZWBxLvsaH4&v=beta'
          for sz in 800 1280 1600 2048; do
            u="$base/feedshare-shrink_$sz/$tail"
            echo "=== $sz"
            curl -fL --retry 2 --connect-timeout 10 --max-time 40 -A 'Mozilla/5.0' "$u" -o "out/linkedin-$sz.jpg" || rm -f "out/linkedin-$sz.jpg"
            [ -f "out/linkedin-$sz.jpg" ] && file "out/linkedin-$sz.jpg" || true
          done
          ls -lh out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monday-static-sources
          path: out/
          if-no-files-found: error
          retention-days: 2
