name: Recover Monday from official OpenAI video
on:
  push:
    branches:
      - tmp/monday-icon-probe-20261105
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download official OpenAI YouTube short
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python -m pip install -q yt-dlp
          yt-dlp --no-playlist -f 'bv*[height<=1080]+ba/b[height<=1080]'             --merge-output-format mp4             -o 'out/openai-monday.%(ext)s'             'https://www.youtube.com/watch?v=2uoF2w8-hKg'
          ffprobe -v error -show_entries stream=width,height,duration -of default=nw=1 out/openai-monday.mp4 || true
          ls -lh out/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monday-official-video
          path: out/
          if-no-files-found: error
          retention-days: 2
