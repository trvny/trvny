name: Probe Monday icon archives
on:
  push:
    branches:
      - tmp/monday-icon-probe-20261105
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe archives
        shell: bash
        run: |
          set -u
          echo "=== WAYBACK: file-9Tr ==="
          curl -L --max-time 40 -sS 'https://web.archive.org/cdx/search/cdx?url=files.oaiusercontent.com/file-9TrFWKq8W7mNBmLy1dP9QT*&output=json&filter=statuscode:200&collapse=digest' || true
          echo
          echo "=== WAYBACK: file-RFW ==="
          curl -L --max-time 40 -sS 'https://web.archive.org/cdx/search/cdx?url=files.oaiusercontent.com/file-RFWBMhwa9SsnXoMCKdyBjH*&output=json&filter=statuscode:200&collapse=digest' || true
          echo
          echo "=== WAYBACK: backend file-9Tr ==="
          curl -L --max-time 40 -sS 'https://web.archive.org/cdx/search/cdx?url=chatgpt.com/backend-api/*file-9TrFWKq8W7mNBmLy1dP9QT*&output=json&filter=statuscode:200&collapse=digest' || true
          echo
          echo "=== COMMON CRAWL recent indexes ==="
          curl -L --max-time 30 -sS 'https://index.commoncrawl.org/collinfo.json' | python -c 'import sys,json; x=json.load(sys.stdin); print("\n".join(i["id"] for i in x[:8]))' || true
          echo
          echo "=== COMMON CRAWL GPT page ==="
          for idx in $(curl -L --max-time 30 -sS 'https://index.commoncrawl.org/collinfo.json' | python -c 'import sys,json; print(" ".join(i["id"] for i in json.load(sys.stdin)[:8]))' 2>/dev/null); do
            echo "-- $idx"
            curl -L --max-time 30 -sS "https://index.commoncrawl.org/$idx-index?url=chatgpt.com/g/g-67ec3b78892481918c89067962526695-monday&output=json" | head -c 5000 || true
            echo
          done
