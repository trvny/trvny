name: TRAVNY Pages control

on:
  push:
    branches: [main]
    paths:
      - "pages/site/**"
      - "pages/functions/**"
      - "pages/build.sh"
      - "pages/scripts/waf_allow_chatgpt.py"
      - ".github/workflows/travny-pages-control.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Pages Git deployment control
        required: true
        default: status
        type: choice
        options:
          - status
          - assert
          - disable-git-auto-deploy
          - enable-git-auto-deploy

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: travny
    steps:
      - name: Read current Pages settings
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          current=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$endpoint")
          jq -e '.success == true' <<<"$current" >/dev/null
          jq '{
            name: .result.name,
            subdomain: .result.subdomain,
            domains: .result.domains,
            source: {
              type: .result.source.type,
              owner: .result.source.config.owner,
              repo_name: .result.source.config.repo_name,
              production_branch: .result.source.config.production_branch,
              production_deployments_enabled: .result.source.config.production_deployments_enabled,
              preview_deployment_setting: .result.source.config.preview_deployment_setting
            }
          }' <<<"$current"

      # Source of truth for where the project builds from. Leaves
      # production_deployments_enabled alone so the toggle modes stick.
      - name: Assert Git source and build settings
        if: ${{ github.event_name == 'push' || inputs.mode == 'assert' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          payload='{"build_config":{"build_command":"if [ -f build.sh ]; then sh build.sh; fi","destination_dir":"site","root_dir":"pages"},"source":{"type":"github","config":{"owner":"trvny","owner_id":"120686325","repo_name":"trvny","repo_id":"926010685","production_branch":"main","preview_deployment_setting":"none","pr_comments_enabled":false,"path_includes":["pages/*"],"path_excludes":[]}}}'
          updated=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$endpoint")
          jq -e '
            .success == true and
            .result.source.config.repo_name == "trvny" and
            .result.build_config.root_dir == "pages"
          ' <<<"$updated" >/dev/null
          # Build settings apply only to the next build. On push, wait until this
          # commit's deployment is done or skipped; then, if live production was
          # built with an older build command, redeploy. Retryable via mode=assert.
          want=$(jq -r '.result.build_config.build_command' <<<"$updated")
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            settled=false
            for _ in $(seq 1 30); do
              state=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
                "${endpoint}/deployments?per_page=10" | jq -r --arg sha "$GITHUB_SHA" '
                  [.result[] | select(.deployment_trigger.metadata.commit_hash == $sha)][0]
                  | if . == null then "pending"
                    elif .is_skipped then "done"
                    elif .latest_stage.status == "success" then "done"
                    elif (.latest_stage.status | IN("failure", "canceled")) then "failed"
                    else "pending" end')
              if [[ "$state" == "done" ]]; then settled=true; break; fi
              if [[ "$state" == "failed" ]]; then
                echo "::error::Cloudflare deployment for ${GITHUB_SHA} failed."
                exit 1
              fi
              sleep 10
            done
            if [[ "$settled" != true ]]; then
              echo "::error::Deployment for ${GITHUB_SHA} not finished after 5 min; rerun with mode=assert."
              exit 1
            fi
          fi
          live=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$endpoint" \
            | jq -r '.result.canonical_deployment.build_config.build_command // ""')
          if [[ "$live" != "$want" ]]; then
            id=$(curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
              -F branch=main "${endpoint}/deployments" | jq -er '.result.id')
            echo "Live deployment used an older build command; redeploy ${id} started."
            for _ in $(seq 1 30); do
              status=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
                "${endpoint}/deployments/${id}" | jq -r '.result.latest_stage | "\(.name)/\(.status)"')
              case "$status" in
                deploy/success) echo "Redeploy ${id} live."; break ;;
                */failure|*/canceled) echo "::error::Redeploy ${id} ended ${status}."; exit 1 ;;
              esac
              sleep 10
            done
            [[ "$status" == "deploy/success" ]] || { echo "::error::Redeploy ${id} still ${status} after 5 min."; exit 1; }
          fi

      - name: Check dedicated WAF token
        id: waf_token
        # Main only: the script runs with a zone WAF token.
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'assert') }}
        env:
          CLOUDFLARE_WAF_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_WAF_API_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WAF sync skipped: set CLOUDFLARE_WAF_API_TOKEN (Zone WAF Write on trfny.com)."
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.waf_token.outputs.available == 'true' }}
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: pages/scripts

      - name: Allow ChatGPT Work Cloud browser
        if: ${{ steps.waf_token.outputs.available == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: "22c6b82ea8b722c6976f5c2c4714c5e8"
        run: python pages/scripts/waf_allow_chatgpt.py

      - name: Update Git auto-deploy control
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'disable-git-auto-deploy' || inputs.mode == 'enable-git-auto-deploy') }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          case "${{ inputs.mode }}" in
            disable-git-auto-deploy) enabled=false ;;
            enable-git-auto-deploy) enabled=true ;;
            *) echo "Unsupported mode" >&2; exit 2 ;;
          esac
          payload=$(jq -nc --argjson enabled "$enabled" \
            '{source:{config:{production_deployments_enabled:$enabled,preview_deployment_setting:"none"}}}')
          updated=$(curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$endpoint")
          jq -e --argjson expected "$enabled" '
            .success == true and
            .result.source.config.production_deployments_enabled == $expected and
            .result.source.config.preview_deployment_setting == "none"
          ' <<<"$updated" >/dev/null
          jq '{
            name: .result.name,
            production_deployments_enabled: .result.source.config.production_deployments_enabled,
            preview_deployment_setting: .result.source.config.preview_deployment_setting
          }' <<<"$updated"
