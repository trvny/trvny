name: TRAVNY Pages

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - "pages/site/**"
      - "pages/token-worldcup/**"
      - "pages/papagenerator/**"
      - "pages/astro/**"
      - "pages/functions/**"
      - "pages/worker/**"
      - "pages/build.sh"
      - "pages/tests/**"
      - "pages/eslint.config.mjs"
      - "pages/scripts/waf_allow_chatgpt.py"
      - "pages/scripts/build-badge-previews.mjs"
      - "pages/scripts/build-static-shell.mjs"
      - "pages/scripts/worldcup-seo.mjs"
      - ".github/scripts/indexnow*.cjs"
      - ".github/workflows/travny-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "pages/site/**"
      - "pages/token-worldcup/**"
      - "pages/papagenerator/**"
      - "pages/astro/**"
      - "pages/functions/**"
      - "pages/worker/**"
      - "pages/build.sh"
      - "pages/tests/**"
      - "pages/eslint.config.mjs"
      - "pages/scripts/waf_allow_chatgpt.py"
      - "pages/scripts/build-badge-previews.mjs"
      - "pages/scripts/build-static-shell.mjs"
      - "pages/scripts/worldcup-seo.mjs"
      - ".github/scripts/indexnow*.cjs"
      - ".github/workflows/travny-pages.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Pages Git deployment control
        required: true
        default: status
        type: choice
        options:
          - status
          - assert
          - disable-git-auto-deploy
          - enable-git-auto-deploy

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    outputs:
      pages_deploy_expected: ${{ steps.deploy_scope.outputs.pages_deploy_expected }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pages
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Reject committed generated HTML shell
        run: |
          if git grep -n -F '<!-- hub-shell:' -- site/; then
            echo "::error::Generated shell markers in tracked site assets. Keep source HTML clean."
            exit 1
          fi
      - run: sh -n build.sh
      - run: npm --prefix astro ci --no-audit --no-fund
      - run: npm --prefix astro run build
      - run: npx --yes eslint@10.12.0 .
      - run: node --test tests/*.test.mjs
      - run: node --test ../.github/scripts/indexnow.test.cjs
      - run: npx --yes wrangler@4.160.0 deploy --config worker/wrangler.jsonc --dry-run --outdir "$RUNNER_TEMP/hub-worker"

      - name: Detect Pages deployment changes
        if: ${{ github.event_name == 'push' }}
        id: deploy_scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "pages_deploy_expected=true" >> "$GITHUB_OUTPUT"
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            if grep -Eq '^pages/(astro/|site/|token-worldcup/|papagenerator/|functions/|scripts/(build-badge-previews|build-static-shell|worldcup-seo)\.mjs$|build\.sh$)' <<<"$changed"; then
              echo "pages_deploy_expected=true" >> "$GITHUB_OUTPUT"
            else
              echo "pages_deploy_expected=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  # Production-only control. No Cloudflare credentials in PR test steps.
  control:
    needs: check
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.check.result == 'success')) }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: travny
      DEPLOY_EXPECTED: ${{ needs.check.outputs.pages_deploy_expected }}
    steps:
      - name: Read current Pages settings
        shell: bash
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN must be configured}"
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID must be configured}"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          current=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "$endpoint")
          jq -e '.success == true' <<<"$current" >/dev/null
          jq '{
            name: .result.name,
            subdomain: .result.subdomain,
            domains: .result.domains,
            source: {
              type: .result.source.type,
              owner: .result.source.config.owner,
              repo_name: .result.source.config.repo_name,
              production_branch: .result.source.config.production_branch,
              production_deployments_enabled: .result.source.config.production_deployments_enabled,
              preview_deployment_setting: .result.source.config.preview_deployment_setting
            }
          }' <<<"$current"

      # Source of truth for where the project builds from. Leaves
      # production_deployments_enabled alone so the toggle modes stick.
      - name: Assert Git source and build settings
        id: pages_settings
        env:
          BEFORE_SHA: ${{ github.event.before }}
        if: ${{ github.event_name == 'push' || inputs.mode == 'assert' }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          payload='{"build_config":{"build_command":"if [ -f build.sh ]; then sh build.sh; fi","destination_dir":"site","root_dir":"pages"},"source":{"type":"github","config":{"owner":"trvny","owner_id":"120686325","repo_name":"trvny","repo_id":"926010685","production_branch":"main","preview_deployment_setting":"none","pr_comments_enabled":false,"path_includes":["pages/*"],"path_excludes":[]}}}'
          updated=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$endpoint")
          jq -e '
            .success == true and
            .result.source.config.repo_name == "trvny" and
            .result.build_config.root_dir == "pages"
          ' <<<"$updated" >/dev/null
          # Build settings apply only to the next build. On push, wait until this
          # commit's deployment is done or skipped; then, if live production was
          # built with an older build command, redeploy. Retryable via mode=assert.
          want=$(jq -r '.result.build_config.build_command' <<<"$updated")
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          indexnow_before=""
          indexnow_head=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$DEPLOY_EXPECTED" == "true" ]]; then
            settled=false
            for _ in $(seq 1 30); do
              state=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
                "${endpoint}/deployments?per_page=10" | jq -r --arg sha "$GITHUB_SHA" '
                  [.result[] | select(.environment == "production" and .deployment_trigger.metadata.commit_hash == $sha)][0]
                  | if . == null then "pending"
                    elif .is_skipped then "skipped"
                    elif .latest_stage.status == "success" then "done"
                    elif (.latest_stage.status | IN("failure", "canceled")) then "failed"
                    else "pending" end')
              if [[ "$state" == "done" || "$state" == "skipped" ]]; then settled=true; break; fi
              if [[ "$state" == "failed" ]]; then
                echo "::error::Cloudflare deployment for ${GITHUB_SHA} failed."
                exit 1
              fi
              sleep 10
            done
            if [[ "$settled" != true ]]; then
              echo "::error::Deployment for ${GITHUB_SHA} not finished after 5 min; rerun with mode=assert."
              exit 1
            fi
            if [[ "$state" == "done" ]]; then
              indexnow_before="$BEFORE_SHA"
              indexnow_head="$GITHUB_SHA"
            fi
          fi
          live=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$endpoint")
          live_command=$(jq -r '.result.canonical_deployment.build_config.build_command // ""' <<<"$live")
          if [[ "$live_command" != "$want" ]]; then
            previous=$(jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash // ""' <<<"$live")
            id=$(curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
              -F branch=main "${endpoint}/deployments" | jq -er '.result.id')
            echo "Live deployment used an older build command; redeploy ${id} started."
            for _ in $(seq 1 30); do
              status=$(curl --fail-with-body --silent --show-error "${auth[@]}" \
                "${endpoint}/deployments/${id}" | jq -r '.result.latest_stage | "\(.name)/\(.status)"')
              case "$status" in
                deploy/success) echo "Redeploy ${id} live."; break ;;
                */failure|*/canceled) echo "::error::Redeploy ${id} ended ${status}."; exit 1 ;;
              esac
              sleep 10
            done
            [[ "$status" == "deploy/success" ]] || { echo "::error::Redeploy ${id} still ${status} after 5 min."; exit 1; }
            deployed=$(curl --fail-with-body --silent --show-error "${auth[@]}" "${endpoint}/deployments/${id}" \
              | jq -r '.result.deployment_trigger.metadata.commit_hash // ""')
            if [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]; then
              # Preserve a successfully published push diff; otherwise use the recovery diff.
              if [[ -z "$indexnow_head" ]]; then indexnow_before="$previous"; fi
              indexnow_head="$deployed"
              # Same-commit rebuild changes the published output, not the Git tree.
              if [[ "$indexnow_before" == "$indexnow_head" ]]; then indexnow_before=""; fi
            fi
          fi

          # Explicit assert is also a manual notification retry for live production.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "$indexnow_head" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            indexnow_head=$(jq -r 'if .result.canonical_deployment.latest_stage.status == "success" then .result.canonical_deployment.deployment_trigger.metadata.commit_hash // "" else "" end' <<<"$live")
            indexnow_before=""
          fi
          # A queued push run may be superseded before it starts. If this push
          # needed no new deployment, the current successful production revision
          # can still contain unpublished notification scope from that run.
          if [[ "$GITHUB_EVENT_NAME" == "push" && -z "$indexnow_head" ]]; then
            indexnow_head=$(jq -r 'if .result.canonical_deployment.latest_stage.status == "success" then .result.canonical_deployment.deployment_trigger.metadata.commit_hash // "" else "" end' <<<"$live")
            indexnow_before="$BEFORE_SHA"
          fi
          if [[ "$indexnow_head" =~ ^[0-9a-f]{40}$ ]]; then
            {
              echo "indexnow_ready=true"
              echo "indexnow_before=$indexnow_before"
              echo "indexnow_head=$indexnow_head"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.pages_settings.outputs.indexnow_ready == 'true' }}
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: .github/scripts

      - name: Notify IndexNow of published changes
        if: ${{ steps.pages_settings.outputs.indexnow_ready == 'true' }}
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ steps.pages_settings.outputs.indexnow_before }}
          INDEXNOW_HEAD: ${{ steps.pages_settings.outputs.indexnow_head }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Combine the immediate deployment diff with the catch-up diff.
          # An older successful run alone can conceal a deployed rollback.
          urls=$(node .github/scripts/indexnow.cjs hub-changes "$INDEXNOW_BEFORE" "$INDEXNOW_HEAD")
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "$INDEXNOW_BEFORE" ]]; then
            prior=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/travny-pages.yml/runs?branch=main&event=push&status=success&per_page=20" \
              --jq '.workflow_runs[].head_sha' || true)
            INDEXNOW_BEFORE=""
            while IFS= read -r sha; do
              if [[ "$sha" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$sha" "$INDEXNOW_HEAD" 2>/dev/null; then
                INDEXNOW_BEFORE="$sha"
                break
              fi
            done <<<"$prior"
            catchup=$(node .github/scripts/indexnow.cjs hub-changes "$INDEXNOW_BEFORE" "$INDEXNOW_HEAD")
            urls=$(jq -cn --argjson immediate "$urls" --argjson catchup "$catchup" '$immediate + $catchup | unique')
          fi
          node .github/scripts/indexnow.cjs hub "$urls"

      - name: Check dedicated WAF token
        id: waf_token
        # Main only: the script runs with a zone WAF token.
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.mode == 'assert') }}
        env:
          CLOUDFLARE_WAF_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_WAF_API_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WAF sync skipped: set CLOUDFLARE_WAF_API_TOKEN (Zone WAF Write on trfny.com)."
          fi

      - uses: actions/checkout@v7
        if: ${{ steps.waf_token.outputs.available == 'true' }}
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: pages/scripts

      - name: Allow ChatGPT Work Cloud browser
        if: ${{ steps.waf_token.outputs.available == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WAF_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: "22c6b82ea8b722c6976f5c2c4714c5e8"
        run: python pages/scripts/waf_allow_chatgpt.py

      - name: Update Git auto-deploy control
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'disable-git-auto-deploy' || inputs.mode == 'enable-git-auto-deploy') }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          case "${{ inputs.mode }}" in
            disable-git-auto-deploy) enabled=false ;;
            enable-git-auto-deploy) enabled=true ;;
            *) echo "Unsupported mode" >&2; exit 2 ;;
          esac
          payload=$(jq -nc --argjson enabled "$enabled" \
            '{source:{config:{production_deployments_enabled:$enabled,preview_deployment_setting:"none"}}}')
          updated=$(curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "$endpoint")
          jq -e --argjson expected "$enabled" '
            .success == true and
            .result.source.config.production_deployments_enabled == $expected and
            .result.source.config.preview_deployment_setting == "none"
          ' <<<"$updated" >/dev/null
          jq '{
            name: .result.name,
            production_deployments_enabled: .result.source.config.production_deployments_enabled,
            preview_deployment_setting: .result.source.config.preview_deployment_setting
          }' <<<"$updated"
