---
name: Update README quote

on: # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme-quote
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: Rotate quote
    runs-on: ubuntu-slim
    steps:
      - name: Checkout workflow script
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/update-readme-quote.cjs
          sparse-checkout-cone-mode: false

      - name: Update README
        uses: actions/github-script@v9
        env:
          GIST_ID: 167d2271e3cf7d21e118aa7d906a7d2c
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          README_PATH: README.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = require('./.github/scripts/update-readme-quote.cjs');
            await run({ github, context, core });
