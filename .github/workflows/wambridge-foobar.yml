name: WAM Bridge foobar

on:
  pull_request:
    paths:
      - ".github/workflows/wambridge-foobar.yml"
      - "wambridge/foobar/**"
      - "wambridge/pyproject.toml"
      - "wambridge/src/**"
      - "wambridge/tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wambridge-foobar.yml"
      - "wambridge/foobar/**"
      - "wambridge/pyproject.toml"
      - "wambridge/src/**"
      - "wambridge/tests/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Commit generation guard
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          @'
          from pathlib import Path

          path = Path("wambridge/foobar/foo_out_wam.cpp")
          source = path.read_text(encoding="utf-8")
          if "set_protocol_state_if_current" not in source:
              marker = """    bool session_matches_locked(
                  uint64_t generation,
                  unsigned sampleRate,
                  unsigned channels
              ) const {
          """
              guard = """    void set_protocol_state_if_current(
                  uint64_t generation,
                  bool ready,
                  bool playing
              ) {
                  bool accepted = false;
                  {
                      std::lock_guard lock(m_mutex);
                      if (!m_shutdown && !m_restart && !m_flushing &&
                          generation == m_generation &&
                          !m_childStopping.load()) {
                          if (ready) m_helperReady.store(true);
                          if (playing) m_playing.store(true);
                          accepted = true;
                      }
                  }
                  if (accepted) m_cv.notify_all();
              }

          """
              if marker not in source:
                  raise RuntimeError("session marker not found")
              source = source.replace(marker, guard + marker, 1)

              old_protocol = """                if (line == \"WAMBRIDGE READY\") {
                              m_helperReady.store(true);
                              m_cv.notify_all();
                          } else if (line.rfind(\"WAMBRIDGE PLAYING\", 0) == 0) {
                              m_playing.store(true);
          """
              new_protocol = """                if (line == \"WAMBRIDGE READY\") {
                              set_protocol_state_if_current(generation, true, false);
                          } else if (line.rfind(\"WAMBRIDGE PLAYING\", 0) == 0) {
                              set_protocol_state_if_current(generation, false, true);
          """
              if old_protocol not in source:
                  raise RuntimeError("protocol marker block not found")
              source = source.replace(old_protocol, new_protocol, 1)

              old_join = """        if (m_protocolThread.joinable()) m_protocolThread.join();

                  {
          """
              new_join = """        if (m_protocolThread.joinable()) m_protocolThread.join();
                  m_helperReady.store(false);

                  {
          """
              if old_join not in source:
                  raise RuntimeError("protocol join block not found")
              source = source.replace(old_join, new_join, 1)
              path.write_text(source, encoding="utf-8")
          '@ | python -
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wambridge/foobar/foo_out_wam.cpp
          git commit -m "Reject stale WAM protocol markers"
          git push origin "HEAD:$env:HEAD_REF"

      - name: Test WAM helper
        run: |
          python -m pip install -e wambridge
          python -m unittest discover -s wambridge/tests

      - name: Build standalone helper
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name wambridge-pcm `
            --distpath dist/helper `
            --workpath build/pyinstaller `
            --specpath build/pyinstaller `
            wambridge/foobar/wambridge_pcm_entry.py
          & dist/helper/wambridge-pcm/wambridge-pcm.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Download foobar2000 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force external/foobar-sdk | Out-Null
          Invoke-WebRequest `
            -Uri "https://www.foobar2000.org/downloads/SDK-2025-03-07.7z" `
            -OutFile external/foobar-sdk.7z
          7z x external/foobar-sdk.7z -oexternal/foobar-sdk -y

          $sdkProject = Get-ChildItem external/foobar-sdk `
            -Recurse -Filter foobar2000_SDK.vcxproj | Select-Object -First 1
          if (-not $sdkProject) {
            throw "foobar2000 SDK project not found after extraction"
          }
          $sdkRoot = Split-Path `
            (Split-Path (Split-Path $sdkProject.FullName -Parent) -Parent) -Parent
          "FOOBAR_SDK_ROOT=$sdkRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x64 component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild not found"
          }
          & $msbuild wambridge/foobar/foo_out_wam.vcxproj `
            /t:Rebuild `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VCToolsVersion=14.29.30133 `
            "/p:FoobarSdkRoot=$env:FOOBAR_SDK_ROOT"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package component and source snapshot
        shell: pwsh
        run: |
          $output = "wambridge/foobar/build/x64/Release/foo_out_wam.dll"
          if (-not (Test-Path $output)) {
            throw "foo_out_wam.dll was not produced"
          }
          New-Item -ItemType Directory -Force dist/component | Out-Null
          Copy-Item $output dist/component/foo_out_wam.dll
          Copy-Item `
            dist/helper/wambridge-pcm `
            dist/component/wambridge-pcm `
            -Recurse
          Push-Location dist/component
          7z a -tzip ../foo_out_wam.fb2k-component *
          Pop-Location
          Copy-Item $output dist/foo_out_wam.dll
          git archive `
            --format=zip `
            --output=dist/wambridge-foo-out-wam.zip `
            HEAD wambridge

      - uses: actions/upload-artifact@v4
        with:
          name: foo_out_wam-x64
          path: |
            dist/foo_out_wam.dll
            dist/foo_out_wam.fb2k-component
            dist/wambridge-foo-out-wam.zip
          if-no-files-found: error
