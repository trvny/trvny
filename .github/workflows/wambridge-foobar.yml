name: WAM Bridge foobar

on:
  pull_request:
    paths:
      - ".github/workflows/wambridge-foobar.yml"
      - "wambridge/foobar/**"
      - "wambridge/pyproject.toml"
      - "wambridge/src/**"
      - "wambridge/tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wambridge-foobar.yml"
      - "wambridge/foobar/**"
      - "wambridge/pyproject.toml"
      - "wambridge/src/**"
      - "wambridge/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-wam-startup:
    if: github.event_name == 'pull_request' && github.head_ref == 'wambridge/foo-out-wam'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: wambridge/foo-out-wam
          persist-credentials: false

      - name: Apply and commit startup cancellation patch
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f .github/patches/wam-startup-shutdown.json ]; then
            exit 0
          fi
          if [ -z "$GH_PAT" ]; then
            echo "::error::GH_PAT is required"
            exit 1
          fi

          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          replacements = json.loads(
              Path(".github/patches/wam-startup-shutdown.json").read_text(
                  encoding="utf-8"
              )
          )
          grouped = {}
          for path, old_encoded, new_encoded, expected_count in replacements:
              grouped.setdefault(Path(path), []).append(
                  (old_encoded, new_encoded, expected_count)
              )

          for path, path_replacements in grouped.items():
              source = path.read_text(encoding="utf-8")
              for old_encoded, new_encoded, expected_count in path_replacements:
                  old = base64.b64decode(old_encoded).decode()
                  new = base64.b64decode(new_encoded).decode()
                  count = source.count(old)
                  if count != expected_count:
                      raise SystemExit(
                          f"{path}: expected {expected_count} matches, found {count}"
                      )
                  source = source.replace(old, new)
              path.write_text(source, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 4df615d50e4f5bde55a9d57f143548a57e3b5892 -- \
            .github/workflows/wambridge-foobar.yml
          git add .github/workflows/wambridge-foobar.yml
          git add wambridge/foobar/foo_out_wam.cpp
          git add wambridge/src/wambridge/pcm_cli.py
          git add wambridge/tests/test_pcm_cli.py
          git rm .github/workflows/patch-wam-startup-shutdown.yml
          git rm .github/patches/wam-startup-shutdown.json
          git commit -m "Gracefully cancel WAM startup"
          git push \
            "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:wambridge/foo-out-wam

  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test WAM helper
        run: |
          python -m pip install -e wambridge
          python -m unittest discover -s wambridge/tests

      - name: Build standalone helper
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name wambridge-pcm `
            --distpath dist/helper `
            --workpath build/pyinstaller `
            --specpath build/pyinstaller `
            wambridge/foobar/wambridge_pcm_entry.py
          & dist/helper/wambridge-pcm/wambridge-pcm.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Download foobar2000 SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force external/foobar-sdk | Out-Null
          Invoke-WebRequest `
            -Uri "https://www.foobar2000.org/downloads/SDK-2025-03-07.7z" `
            -OutFile external/foobar-sdk.7z
          7z x external/foobar-sdk.7z -oexternal/foobar-sdk -y

          $sdkProject = Get-ChildItem external/foobar-sdk `
            -Recurse -Filter foobar2000_SDK.vcxproj | Select-Object -First 1
          if (-not $sdkProject) {
            throw "foobar2000 SDK project not found after extraction"
          }
          $sdkRoot = Split-Path `
            (Split-Path (Split-Path $sdkProject.FullName -Parent) -Parent) -Parent
          "FOOBAR_SDK_ROOT=$sdkRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x64 component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild not found"
          }
          & $msbuild wambridge/foobar/foo_out_wam.vcxproj `
            /t:Rebuild `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:VCToolsVersion=14.29.30133 `
            "/p:FoobarSdkRoot=$env:FOOBAR_SDK_ROOT"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package component and source snapshot
        shell: pwsh
        run: |
          $output = "wambridge/foobar/build/x64/Release/foo_out_wam.dll"
          if (-not (Test-Path $output)) {
            throw "foo_out_wam.dll was not produced"
          }
          New-Item -ItemType Directory -Force dist/component | Out-Null
          Copy-Item $output dist/component/foo_out_wam.dll
          Copy-Item `
            dist/helper/wambridge-pcm `
            dist/component/wambridge-pcm `
            -Recurse
          Push-Location dist/component
          7z a -tzip ../foo_out_wam.fb2k-component *
          Pop-Location
          Copy-Item $output dist/foo_out_wam.dll
          git archive `
            --format=zip `
            --output=dist/wambridge-foo-out-wam.zip `
            HEAD wambridge

      - uses: actions/upload-artifact@v4
        with:
          name: foo_out_wam-x64
          path: |
            dist/foo_out_wam.dll
            dist/foo_out_wam.fb2k-component
            dist/wambridge-foo-out-wam.zip
          if-no-files-found: error
