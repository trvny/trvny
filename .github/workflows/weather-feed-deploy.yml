name: Deploy weather-feed

on:
  push:
    branches: [main]
    paths:
      - "weather-feed/**"
      - ".github/workflows/weather-feed-deploy.yml"
  pull_request:
    paths:
      - "weather-feed/**"
      - ".github/workflows/weather-feed-deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-weather-feed
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: weather-feed
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weather-feed/package-lock.json
      - run: npm install
      - name: Type check and test
        run: npm run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    defaults:
      run:
        working-directory: weather-feed
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weather-feed/package-lock.json
      - run: npm install
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
