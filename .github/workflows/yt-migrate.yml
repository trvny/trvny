name: yt-migrate

on:
  schedule:
    - cron: "17 8 * * *" # after the YouTube quota reset (midnight Pacific)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List and report only, no writes"
        type: boolean
        default: false

concurrency:
  group: yt-migrate
  cancel-in-progress: true

permissions: {}

jobs:
  migrate:
    if: github.repository == 'trvny/trvny'
    runs-on: ubuntu-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: yt-migrate
      - uses: actions/cache/restore@v6
        with:
          path: yt-migrate/state.json
          key: yt-migrate-state-${{ github.run_id }}
          restore-keys: yt-migrate-state-
      - name: Decrypt Takeout extras
        if: hashFiles('yt-migrate/takeout.json.gz.enc') != ''
        env:
          KEY: ${{ secrets.YT_EXTRA_KEY }}
        run: |
          KEY=$(printf %s "$KEY" | tr -d "[:space:]"); export KEY  # tolerate pasted whitespace
          [ -n "$KEY" ] || { echo "::notice::YT_EXTRA_KEY not set, Takeout extras skipped"; exit 0; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -pass env:KEY \
            -in yt-migrate/takeout.json.gz.enc | gunzip > "$RUNNER_TEMP/takeout.json"
      - name: Migrate
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_SRC_REFRESH: ${{ secrets.YT_SRC_REFRESH }}
          YT_DST_REFRESH: ${{ secrets.YT_DST_REFRESH }}
          YT_STATE: yt-migrate/state.json
          YT_EXTRA: ${{ runner.temp }}/takeout.json
          YT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python3 yt-migrate/migrate.py
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: yt-migrate/state.json
          key: yt-migrate-state-${{ github.run_id }}
