<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRVNY / TRAVNIE Universe</title>
<meta name="description" content="Interactive operational map of the TRVNY / TRAVNIE GitHub and Cloudflare universe.">
<link rel="canonical" href="https://bartek.lol/teksty/githubowa-kraina/universe">
<meta property="og:type" content="website">
<meta property="og:title" content="TRVNY / TRAVNIE Universe">
<meta property="og:description" content="Interactive map of the TRVNY and TRAVNIE GitHub and Cloudflare projects.">
<meta property="og:url" content="https://bartek.lol/teksty/githubowa-kraina/universe">
<meta property="og:image" content="https://bartek.lol/assets/og.png">
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--card:#171c26;--text:#eef2f7;--muted:#9aa6b6;--border:#2b3442;--repo:#7dd3fc;--component:#c4b5fd;--worker:#f6c453;--storage:#86efac;--external:#f9a8d4;--accent:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:1500px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:.25rem 0;font-size:clamp(26px,4vw,44px);line-height:1.03}p{margin:.35rem 0;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.controls button,.controls input,.controls select,.map-tools button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
.controls button{cursor:pointer}.controls button:hover,.controls button.active{border-color:var(--accent);background:#152236}.controls input{min-width:210px;outline:none}.controls input:focus{border-color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:4px 0 14px;color:var(--muted);font-size:12px}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px;align-items:start}.canvas{border:1px solid var(--border);background:linear-gradient(180deg,#0d1118,#0a0d13);border-radius:14px;overflow:auto}
#graph{display:block;width:100%;min-width:980px;height:auto}.edge{fill:none;stroke:#526071;stroke-width:1.7;opacity:.55;transition:.18s}.edge.service{stroke:#f59e0b;stroke-dasharray:7 5}.edge.storage{stroke:#22c55e;stroke-dasharray:3 4}.edge.external{stroke:#ec4899;stroke-dasharray:10 5}.edge.active{stroke-width:4;opacity:1}.edge.dim{opacity:.08}
.node{cursor:pointer;transition:.15s}.node rect.body{fill:#141a23;stroke:#344052;stroke-width:1.2;rx:10}.node rect.strip{rx:10}.node text.title{fill:var(--text);font-size:12px;font-weight:700}.node text.sub{fill:var(--muted);font-size:9.5px}.node:hover rect.body,.node.active rect.body{stroke:var(--accent);stroke-width:2.2}.node.dim{opacity:.13}.node.repo rect.strip{fill:var(--repo)}.node.component rect.strip{fill:var(--component)}.node.worker rect.strip{fill:var(--worker)}.node.storage rect.strip{fill:var(--storage)}.node.external rect.strip{fill:var(--external)}
.cluster{fill:none;stroke:#243041;stroke-width:1;stroke-dasharray:6 7;rx:18}.cluster-label{fill:#667487;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.side{position:sticky;top:12px;border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:14px}.side h2{font-size:16px;margin:0 0 4px}.pill{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:11px;margin-bottom:10px}.side dl{margin:12px 0}.side dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.side dd{margin:2px 0 10px}.side a{color:#93c5fd;text-decoration:none;word-break:break-word}.side ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-top:10px}
.footer{margin-top:14px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.side{position:static}.controls input{flex:1;min-width:180px}}
[hidden]{display:none!important}
.map-body{min-width:0}
.map-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.map-tools button{min-height:44px;cursor:pointer}
.map-tools button[aria-pressed="true"]{border-color:var(--accent);color:#b3d7ff}
#map-view-status:empty{display:none}
#map-zoom{display:flex;gap:6px;flex-wrap:wrap}
#map-webgl{position:relative;min-width:0;width:100%;height:clamp(320px,60vh,660px);background:#0d1118}
:where(button,input,select,summary,a):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:500px){main{padding:16px}.top{padding-inline-end:52px}.controls select{width:100%}}
.node-directory{margin:0 0 12px;border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:12px}
.node-directory summary{cursor:pointer;font-weight:700;color:var(--text)}
#node-count{color:var(--muted);font-weight:400}
#node-list{list-style:none;padding:0;margin:10px 0 0;max-height:320px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:6px}
#node-list button{width:100%;text-align:left;min-height:44px;border:1px solid var(--border);border-radius:8px;background:var(--card);padding:8px;color:var(--text);font:inherit;cursor:pointer}
#node-list button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#node-list small{display:block;color:var(--muted)}
aside a,.footer a,#map-error a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.edge,.node{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <div class="eyebrow" id="snapshot">Infrastructure snapshot</div>
      <h1>TRVNY / TRAVNIE Universe</h1>
      <p>Explore the projects, domains and services behind TRVNY and TRAVNIE.</p>
    </div>
  </div>

  <p id="map-loading" role="status">Loading map…</p>
  <p id="map-error" hidden>Map unavailable. <a href="./">Open the project atlas</a> or <a href="./infrastructure.json">view the snapshot JSON</a>.</p>
  <noscript><style>#map-loading{display:none}</style><p><a href="./">Project atlas</a> · <a href="./infrastructure.json">Infrastructure snapshot JSON</a></p></noscript>
  <div class="controls" hidden aria-label="Graph controls">
    <button type="button" data-preset="all" class="active">Everything</button>
    <button type="button" data-preset="kanarek">Kanarek network</button>
    <button type="button" data-preset="web">Public web</button>
    <button type="button" data-preset="automation">Automation</button>
    <input id="search" type="search" placeholder="Search repo, worker, storage…" aria-label="Search graph">
    <select id="node-kind" aria-label="Node type"><option value="">All node types</option></select>
    <select id="relation-kind" aria-label="Connection type"><option value="">All connections</option></select>
    <button type="button" id="download-json">Download JSON</button>
    <button type="button" id="download-svg">Download SVG</button>
  </div>

  <div id="map-legend" class="legend" hidden aria-label="Node types"></div>

  <div class="layout" hidden>
    <div class="map-body">
      <details class="node-directory">
        <summary>Browse nodes <span id="node-count"></span></summary>
        <ul id="node-list"></ul>
      </details>
      <div class="map-tools">
        <button id="map-view" type="button" aria-pressed="false">Interactive graph</button>
        <div id="map-zoom" hidden aria-label="Graph zoom">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="zoom-fit" type="button">Fit graph</button>
        </div>
        <p id="map-view-status" role="status"></p>
      </div>
      <div class="canvas">
        <div id="map-webgl" hidden role="img" aria-label="Interactive project graph. The node list provides keyboard navigation."></div>
        <svg id="graph" viewBox="0 0 1330 930" role="img" aria-label="Interactive graph of TRVNY and TRAVNIE repositories and infrastructure">
          <g id="clusters"></g>
          <g id="edges"></g>
          <g id="nodes"></g>
        </svg>
      </div>
    </div>

    <aside class="side" id="details" aria-live="polite">
      <h2>Universe map</h2>
    </aside>
  </div>

  <div class="footer">
    <span>GitHub and Cloudflare infrastructure snapshot.</span>
    <span><a href="./infrastructure.json">Snapshot JSON</a></span>
  </div>
</main>

<script type="module" src="/assets/universe-map.js"></script>
</body>
</html>
